id = 317
slug = "hosted-runner-label"
revision = 1
kind = "rule"
status = "trial"
lang = "en"
parent = 276
default = "off"
requires = [212]
authority = ["discriminating-checks"]
constitution = ">=1"
level = "project"
check = "none"
uses = ["instructions", "review"]

[title]
en = "Pin the hosted Linux runners of CI to one set label"
zh = "CI 托管的 Linux runner 钉到指定的标签"

[text.statement]
en = "Run each Linux runner that the CI service hosts on the label `{$ci.linux-runner-label}`, in a matrix too."
zh = "CI 服务托管的 Linux runner 一律用标签 `{$ci.linux-runner-label}`，matrix 里的也一样。"

[text.reason]
en = '''
{@rule:212} pins the hosted Linux runners to a label that names a fixed release, and leaves the release to the rule set; this rule names the label. With one label in every workflow, the same change reaches the same conclusion in every repository ({@constitution:discriminating-checks}). The value is a person's own, the same in every repository they keep.
'''
zh = '''
{@rule:212} 把托管的 Linux runner 钉到指明固定版本的标签，版本留给规定集定；本规定写明是哪个标签。所有 workflow 用同一个标签，同一个变更在各个仓库里得出同样的结论 ({@constitution:discriminating-checks})。这个值是个人的，本人的各个仓库都一样。
'''

[text.verification]
en = '''
Self-hosted runners and runners of a system other than Linux are not covered. Moving to another label is a change of this value, which only whoever sets the value decides.

Violated when a CI workflow of the repository sets a Linux runner that the CI service hosts, a value in a matrix included, to a label other than `{$ci.linux-runner-label}`.
'''
zh = '''
自托管 runner 与 Linux 以外系统的 runner 不在此列。换成别的标签就是改这个值，只由设定这个值的人决定。

仓库的 CI workflow 里，CI 服务托管的 Linux runner (包括 matrix 里的取值) 用的标签不是 `{$ci.linux-runner-label}` 的，即为违反本规定。
'''

[translations]
