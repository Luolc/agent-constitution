[title]
en = "Shared Resources"
zh = "共享资源"

[applicability]
en = '''
Work that shares a resource whose capacity is limited with other tasks, such as a machine's processors and memory, an account with a shared quota or a service with a rate limit: a fair share of it, no harm to the tasks already running, waits that end when what they wait for fails, and a fallback for stopping every lasting background process. Enable it wherever agents work.
'''
zh = '''
和别的任务共用有上限的资源时的工作，例如机器的 CPU 和内存、共用额度的账号、限了速率的服务：共用的资源只用自己该用的一份，不妨碍正在运行的任务，等的事失败了就结束等待，一直占用资源的后台进程都有兜底。凡有 agent 工作的地方都要启用。
'''

