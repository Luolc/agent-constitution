[title]
en = "Keep each node of the first-party rule tree in a file of its own, and delete none"

[text.statement]
en = "Keep each rule, one-of and domain of the first-party source in `rules/<id>.toml`, named by its ID without zero padding, and never delete one or reuse its ID: a rule that goes is superseded or repealed."

[text.reason]
en = '''
A rule set pins rules by ID; a deleted rule or a reused ID would make a rule set that cites it compile something else, or nothing.
'''

[text.verification]
en = '''
`rules/params.toml` declares the parameters the rules use and is no node. `cargo run --locked --quiet -p statute -- validate rules` checks each file's format, the tree, the references, the translations and the citations.

Violated when a change deletes a file of `rules/`, gives a new node an ID used before, or names a node's file other than by its ID.
'''
