id = 31
slug = "compiled-agents-file-and-lock-entries-generated"
revision = 1
kind = "rule"
status = "trial"
lang = "en"
overrides = "R280"
authority = ["separate-instruction-changes"]
constitution = ">=1"
level = "project"
