constitution = ">=1"
level = "project"
check = "none"
uses = ["instructions", "review"]

[title]
en = "Count statute's files as instruction files"

[text.statement]
en = "Count `statute.toml`, `statute.lock`, `statute-checks.toml`, every file under `.statute/` and every `*.legacy.md` as instruction files of this repository too."

[text.reason]
en = '''
These files decide or record what the compiled `AGENTS.md` holds, so a change to them changes the instructions ({@constitution:separate-instruction-changes}).
'''

[text.verification]
en = '''
`uv run check-instruction-changes --base origin/main` fails a change that mixes instruction files with other files, and CI runs it on every pull request.

Violated when a change mixes one of these files with files that are not instruction files.
'''
