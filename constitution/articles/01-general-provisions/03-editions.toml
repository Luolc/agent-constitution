id = "editions"
status = "draft"
audience = "maintainers"

[content]
en = '''
Naming an edition by its year and month follows the practice of calling a constitution by the year of its adoption, as China does with its constitutions of 1954 and 1982 and France with that of 1958. The distinction between an edition and the amendments within it resembles that between total and partial revision of the Federal Constitution of Switzerland.
'''
zh = '''
每一版以年月命名，沿用按通过年份称呼宪法的做法，如中国的 1954 年宪法、1982 年宪法和法国的 1958 年宪法。版与版内修正案之分，类似瑞士联邦宪法的全面修订与部分修订。
'''

[[items]]
id = "edition"
number = "1"
status = "draft"

[items.content]
en = '''
An **edition** is one approved text of this constitution as a whole. It is named by the year and month in which the competent principal for this constitution ({@principals.competent}) approved it (for example, the 2026-10 edition), and the title carries that name; no two editions open in the same month.
'''
zh = '''
**版** (edition) 指本宪法经批准的一份完整文本。每一版以本宪法的有权委托人 ({@principals.competent}) 批准它生效的年月命名 (例如「2026-10 版」)，标题写明这个名字；同一个月内不制定两版。
'''

[[items]]
id = "in-force"
number = "2"
status = "draft"

[items.content]
en = '''
The edition last approved is the **edition in force**, the text that applies.
'''
zh = '''
最近一次批准的那一版是**现行版**，即适用的文本。
'''

[[items]]
id = "draft"
number = "3"
status = "draft"

[items.content]
en = '''
The **draft** is the text being prepared for the next edition. Its title carries the name of the edition it is meant to become, and its revision number is marked as a draft. If that edition is approved in another month, it takes the name of that month: the text put up for approval carries that name, and the renaming is part of opening the edition ({@new-editions}), not a separate amendment. Before the first edition is approved, the draft is the only text. A draft may be used on a trial basis: a competent principal for a project may decide to adopt the draft in that project, and while it is adopted, the draft applies in that project, in place of the edition in force if there is one. Trial use is not approval, and the draft may still change at any time.
'''
zh = '''
**草案**是为下一版准备的文本，标题写它准备成为的那一版的名字，修订号旁注明「草案」。那一版如果在其他月份批准，就以批准的月份命名：提请批准的文本写这个名字，改名属于制定新的一版 ({@new-editions})，不另算一次修正案。第一版批准之前，只有草案。草案可以试行：项目的有权委托人可以决定在该项目中采用草案，采用期间，草案在该项目中适用；已有现行版的，由草案代替现行版。试行不等于批准，草案仍可随时修改。
'''

[[items]]
id = "revision"
number = "4"
status = "draft"

[items.content]
en = '''
Within an edition, the **revision number** counts from one and rises by one with each amendment that takes effect ({@revision-count}), and numbers never change ({@stable-numbers}). A draft's revision number is written 0.*n*; in every draft, *n* counts from one and rises in the same way.
'''
zh = '''
同一版内，**修订号** (revision) 从一起算，每有一次修正案生效就加一 ({@revision-count})，编号永不更改 ({@stable-numbers})。草案的修订号写作 0.*n*；每份草案的 *n* 都从一起算，同样逐次加一。
'''

[[items]]
id = "new-edition"
number = "5"
status = "draft"

[items.content]
en = '''
A new edition may rearrange and renumber the whole text; opening one is itself an amendment ({@new-editions}). A provision carried into a new edition keeps its ID, so a record that cites by ID stays valid; a citation by number names the edition.
'''
zh = '''
新的一版可以对全文大范围重排、重新编号；制定新的一版，本身就是一次修宪 ({@new-editions})。延续到新一版的条文保留原来的 ID，旧记录按 ID 的引用仍然有效；按编号引用时要写明是哪一版。
'''
