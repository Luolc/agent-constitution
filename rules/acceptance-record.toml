id = "acceptance-record"
status = "draft"
scope = "all"
authority = ["constitution:verification", "constitution:evidence"]

[title]
en = "Back every \"done\" with an acceptance record"
zh = "报告完成时附验收记录"

[content]
en = '''
When an agent reports work as done, whether to another agent or to a person, the report carries an acceptance record:

- each check that ran, the version it ran on (a commit, a build or a file revision), and the line of its output that shows the result;
- each check that applies but did not run, and why.

Each value in the record is copied from the output that established it ({@constitution:evidence}). When the work changes after a check ran, the record moves to the new version: the check runs again, or it is listed as not run on that version, with the reason.

When unsure whether a check applies, list it as not run, with the reason, rather than leave it out.
'''
zh = '''
agent 报告工作完成时，无论报告给其他 agent 还是人，都附一份验收记录：

- 跑过的每项检查，在哪个版本上跑的 (commit、构建或文件版本)，以及显示结果的那一行输出；
- 适用但没有跑的每项检查，以及没有跑的原因。

记录中的每个值都从确立它的那次输出中照抄 ({@constitution:evidence})。检查跑完之后工作又有改动的，记录随之更新到新版本：重跑这项检查，或者把它列为在新版本上没有跑，并写明原因。

拿不准某项检查是否适用的，列为没有跑并写明原因，不要略去。
'''
