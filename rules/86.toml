[title]
en = "Write no test for input that is plainly unreasonable"
zh = "不为明显不合理的输入写测试"

[text.statement]
en = "Write no test of what code does with input that is plainly unreasonable."
zh = "不为代码怎样处理明显不合理的输入写测试。"

[text.reason]
en = '''
Input that no caller gives and no requirement names is not part of what the code is for; a test of it fixes behavior nobody needs and is one more test to run and keep up ({@constitution:simplicity}).
'''
zh = '''
没有调用方会给、也没有哪条需求提到的输入，不属于代码要处理的范围；为它写测试，是把谁都不需要的行为固定下来，还多了一个要运行和维护的测试 ({@constitution:simplicity})。
'''

[text.verification]
en = '''
Input is plainly unreasonable when no caller of the code gives it or could be expected to, and no requirement, specification or record of a bug names it: a negative count of files, a path that is a number, a type the signature excludes. A boundary the requirements set, such as an empty list the code must accept, a limit it must enforce or input from outside that it must reject, is not unreasonable, and a test of it complies.

Violated when a change adds a test that asserts what code does with plainly unreasonable input.
'''
zh = '''
明显不合理的输入，指代码的调用方不会给、也不会被指望给，而且没有哪条需求、规格或 bug 记录提到的输入，例如为负数的文件个数、一个是数字的路径、函数签名已经排除的类型。需求规定的边界，例如代码必须接受的空列表、必须执行的上限、必须拒绝的外部输入，不算不合理，测试它们是合规的。

变更加入的测试断言代码怎样处理明显不合理的输入的，即为违反本规定。
'''

