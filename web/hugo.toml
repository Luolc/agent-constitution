# The static site: two pages per language, the constitution and its version
# for agents, built by tools/build_site.py from
# constitution/constitution.<lang>.md and constitution.<lang>.agent.md. See
# docs/design.md (Static site).
baseURL = "/"
# Relative links, so that site/index.html also opens as a file.
relativeURLs = true
title = "Agent Constitution"
theme = "hugo-book"
defaultContentLanguage = "en"
disableKinds = ["taxonomy", "term", "section", "rss", "sitemap", "404"]
enableRobotsTXT = false

[languages.en]
  label = "English"
  title = "Agent Constitution"
  weight = 1

[languages.zh]
  label = "中文"
  title = "Agent 宪法"
  weight = 2

# The sidebar lists the site's pages in groups, each a top-level entry
# with the group's name in bold and an icon from assets/icons (BookIcon),
# its pages as children. Today there is one group, the constitution, which
# is the home page; its version for agents is not listed, as it is not
# meant for people to read, and is linked from the home page. The icon is
# the scales of Octicons' `law` (MIT license), as is GitHub's mark beside
# the source link.
[[languages.en.menus.before]]
  identifier = "constitution"
  name = "Constitution"
  pageRef = "/"
  weight = 1
  [languages.en.menus.before.params]
    class = "menu-group"
    BookIcon = "law"
[[languages.zh.menus.before]]
  identifier = "constitution"
  name = "宪法"
  pageRef = "/"
  weight = 1
  [languages.zh.menus.before.params]
    class = "menu-group"
    BookIcon = "law"

# The content is only this repo's own built constitution; raw HTML is
# needed for its anchors (<a id="...">) and the wrapper and popup
# build_site.py adds.
[markup.goldmark.renderer]
  unsafe = true

# The table of contents at the right lists the articles and the preamble,
# the level-2 headings under the page's `#` title.
[markup.tableOfContents]
  startLevel = 2
  endLevel = 2

[params]
  BookTheme = "auto"
  # The menu root is the home page; its one child, the version for
  # agents, is hidden from the theme's list of pages, which the menu
  # above replaces.
  BookSection = "/"
  BookToC = true
  BookSearch = false
  BookComments = false
  BookServiceWorker = false
  BookTranslatedOnly = false
  # Linked in the sidebar, under the site's title.
  SourceRepo = "https://github.com/Luolc/agent-constitution"
