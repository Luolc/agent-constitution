[title]
en = "Run the commit hooks and the touched checks before a push"
zh = "push 之前运行 commit hook 和改动涉及的检查"

[text.statement]
en = "Before you push a change, run the commit hooks and the checks the change touches on the version you push, and push only when they all pass."
zh = "push 一个变更之前，在要 push 的版本上运行 commit hook 和改动涉及的检查，全部通过才 push。"

[text.reason]
en = '''
A change pushed for review is put forward as working, and that needs grounds someone else can check ({@constitution:evidence}). The commit hooks and the checks the change touches are the quickest of them; run first, they keep a failure the author could have found from reaching the reviewer and CI. The rest is left to CI; {@rule:72} says which run to cite.
'''
zh = '''
push 去审查的变更，等于声称它能正常工作，这需要别人能够核对的依据 ({@constitution:evidence})。commit hook 和改动涉及的检查是其中最快的一部分；先运行它们，作者本来就能发现的失败就不会落到审查方和 CI 头上。其余的检查交给 CI，引用哪次运行见 {@rule:72}。
'''

[text.verification]
en = '''
Before each push of a change, the first and every one after it, the agent runs on the version it pushes:

- the repository's commit hooks;
- each check of the repository whose inputs the change touches, as the project instructions list the checks.

It pushes only when each of them passes ({@rule:54}). When unsure whether a check is touched, it runs it.

Where CI runs the full set of checks on the change, checks the change does not touch need not run locally; what to cite for the full set is in {@rule:72}.

Violated when a change is pushed and a commit hook or a check it touches did not run on the pushed version, or did not pass on it.
'''
zh = '''
每次 push 一个变更之前，第一次和之后的每一次，agent 都在要 push 的版本上运行：

- 仓库的 commit hook；
- 仓库里输入涉及这次改动的每一项检查，检查以项目说明列出的为准。

每一项都通过了才 push ({@rule:54})。不确定某项检查是否涉及这次改动的，就运行它。

CI 会在这个变更上运行全部检查的，改动不涉及的检查不必在本地运行；说到全部检查时引用什么，见 {@rule:72}。

一个变更已经 push，而某个 commit hook 或某项涉及这次改动的检查没有在所 push 的版本上运行，或者没有通过的，即为违反本规定。
'''

