[title]
en = "A worker that `fleet watch` started follows its watch's prompt"
zh = "`fleet watch` 起的 worker 照 watch 的 prompt 做"

[text.statement]
en = "As a worker that `fleet watch` started, do what the prompt of your watch says, and never run `fleet done`."
zh = "作为 `fleet watch` 起的 worker，照自己那个 watch 的 prompt 做，不运行 `fleet done`。"

[text.reason]
en = '''
`fleet watch` starts such a worker from the scope's settings, with no lead and no job; its task is the prompt written in the watch's entry ({@constitution:delivered-tasks.principal-setup}). `fleet done` hands work to a lead, and this worker has none to hand it to.
'''
zh = '''
这种 worker 由 `fleet watch` 按 scope 的设置起，没有 lead，也没有 job；它的任务就是 watch 条目里写好的 prompt ({@constitution:delivered-tasks.principal-setup})。`fleet done` 是向 lead 交工的命令，这个 worker 没有 lead 可交。
'''

[text.verification]
en = '''
This rule covers the workers whose `FLEET_PARENT` is `watch`. Such a worker asks and finishes as its watch's prompt and its built-in prompt say; when its task is done it ends its turn, and Agent Fleet closes its tab on its next run. {@rule:171} does not apply to it.

Violated when such a worker runs `fleet done` or does work outside its watch's prompt.
'''
zh = '''
本规定只管 `FLEET_PARENT` 为 `watch` 的 worker。这种 worker 问人与收尾都按 watch 的 prompt 和它的内置 prompt 做；任务做完就结束这一轮，Agent Fleet 下次运行时关掉它的 tab。{@rule:171}对它不适用。

这种 worker 运行了 `fleet done`，或者做了 watch 的 prompt 之外的工作的，即为违反本规定。
'''

