# Written by `statute init`; `statute add` and `statute remove` change the rules.
constitution = { source = "R", edition = "2026-10" }
public = true

domains = [
  # Agents write and change rules here, the first-party ones and the local ones.
  "R96",
  # The repository keeps a design, in docs/design/ with a Chinese translation.
  "R232",
  # Work here is divided among agents the way fleet does.
  "R78",
  # fleet itself starts the agents that work here.
  "R161",
  # The agents here take their work from tickets, one child ticket per attempt.
  "R175",
  # The repository builds two sites from web/, with a frontend design in docs/design/frontend.md.
  "R240",
  # The owner's environment, public rules that hold no private value; the private layer
  # adds what is private: machines and their directories,
  "R127",
  # the tiers of the secret manager,
  "R137",
  # test accounts, logins and usage quotas,
  "R145",
  # the agent tools in use,
  "R150",
  "R151",
  "R152",
  # and approvals relayed through fednet.
  "R188",
]

rules = [
  # The constitution and rule sources are instruction files and change in pull requests of their own.
  "R280",
  # The generated constitution goes with the sources it was rebuilt from.
  "R47",
  # Here the code is the compiler of AGENTS.md: the root AGENTS.md goes with the side
  # that changed it, in place of R280.
  "L28",
  # A change that needs new instructions waits until they are merged.
  "R48",
  # CI runs check-instruction-changes on every pull request.
  "R49",
  # The repository is public: a reviewer reads what is pushed before the push.
  "R52",
  # The implementer reads the description back against the head before review and merge.
  "R56",
  # main is protected and takes changes only through reviewed pull requests.
  "R57",
  # A crate published or a site deployed is a release, from a commit CI passed on its first attempt;
  # L21 names the check that tells it for statute.
  "R58",
  # A release that passes over a commit green only on a rerun finds out why the first attempt failed.
  "R254",
  # The merging agent reads CI on the merge commit, and before the merge what arrived after the verdict.
  "R258",
  "R59",
  # Reviews are held in the pull request comments.
  "R63",
  # A review unsettled after three rounds goes to a principal, unless the lead gives one more round to findings that only shrink.
  "R255",
  # The full set of checks is cited from CI, not from a local run.
  "R72",
  # A red main does not hold back pull requests that are ready.
  "R95",
  # Implementer and reviewer use models of the same family today.
  "R205",
  # check is the required status check, and a merge waits for it.
  "R211",
  # CI runners are pinned to a fixed Ubuntu release (L17).
  "R212",
  # Pushed text goes through files written with a quoted heredoc.
  "R93",
  "R94",
  # Tests cover the happy path, the set boundaries and the bugs that occurred.
  "R84",
  "R85",
  "R252",
  # Comments say only what the code cannot.
  "R88",
  # Test data is made up (L10 sets the values).
  "R27",
  # Content Markdown lives under docs/ and only convention files at the root.
  "R206",
  # The owner's environment, as for the domains above: shared machines take no load,
  # and a problem that needs heavy load is reproduced only where its load is capped,
  "R30",
  "R278",
  # a task gives no precautions for what a shared machine forbids,
  "R251",
  # and design questions go to the owner directly, at most five at a time.
  "R237",
  "R238",
]

[sources]
R = { path = "." }

[language]
code-comments = "en"
docs = "en"
commits = "en"
pull-requests = "en"
# What agents write to a person here is in English, as the repository is; a person who reads
# another language sets it in their own private layer.
communication = "en"
# The tickets of this repository's work are written in Chinese.
work-items = "zh"
