[title]
en = "Count what is left after a cleanup"
zh = "清理之后清点残留"

[text.statement]
en = "After cleaning up processes or other resources, count what is left, and report the cleanup as done only when the count is zero."
zh = "清理进程或其他资源之后，清点剩下的数量，数量为零才报告清理完成。"

[text.reason]
en = '''
A claim that a cleanup is done needs grounds someone else can check ({@constitution:evidence.grounds}); having run the commands that should clean up is not one, since they can miss things. The count is a check, and it has to catch a leftover when there is one ({@constitution:discriminating-checks}).
'''
zh = '''
声称清理完成，要有别人能核对的依据 ({@constitution:evidence.grounds})；运行过本该完成清理的命令不算依据，因为这些命令可能有遗漏。清点是一项检查，有残留时它必须能发现 ({@constitution:discriminating-checks})。
'''

[text.verification]
en = '''
The count matches what was meant to be cleaned up and nothing else: a pattern that also matches the command running the count, for example the shell running a process search, is not a count. A zero shows only that moment; where what was cleaned up can come back, such as a process a supervisor restarts or a child started late, the agent counts again after a while.

Violated when an agent reports a cleanup as done without a count of what is left, with a count above zero, or, where what was cleaned up can come back, without counting again after a while.
'''
zh = '''
清点的对象正好是要清理的东西，不多不少：匹配模式把运行清点的命令也匹配进去的 (例如执行进程搜索的那个 shell)，不算清点。一次清点为零只说明那一刻；清理掉的东西可能重新出现的，例如被守护进程拉起的进程、晚启动的子进程，agent 隔一段时间再清点一次。

agent 没有清点残留就报告清理完成，清点结果大于零却报告清理完成，或者清理掉的东西可能重新出现、却没有隔一段时间再清点一次就报告清理完成的，即为违反本规定。
'''

