[title]
en = "On a local device, read through a route that a person unlocks"
zh = "本地设备上，经人解锁的途径读"

[text.statement]
en = "On a local device, a machine that a person sits at and works on directly, such as a laptop, read the secret manager, except in an unattended task there, only through a route that a person unlocks, such as a fingerprint or a security key, never through a service account's token."
zh = "在本地设备 (人坐在跟前直接操作的机器，例如笔记本电脑) 上，除那里无人值守的任务外，agent 读密钥管理器只经人解锁的途径 (例如指纹或 security key)，不用 service account 的 token。"

[text.reason]
en = '''
On a local device the person sits at it, at hand to unlock each read, so no token is needed there, and every read waits for that person. A token kept on it could be read by anything the person runs.
'''
zh = '''
本地设备有人坐在跟前，可以逐次解锁，用不着 token，每次读取都要等这个人。放在这台设备上的 token，这个人运行的任何东西都可能读到。
'''

[text.verification]
en = '''
A local device is a machine that a person sits at and works on directly; a machine that people and agents reach only over the network, such as a server, is a remote machine ({@rule:305}). A route that a person unlocks is one where each read waits for a person to unlock it, such as the desktop integration of a secret manager's app. Which machines are local devices and which route is used on each is set in the jurisdiction. The unattended tasks on a local device read as {@rule:305} and {@rule:306} say.

Violated when an agent on a local device, other than an unattended task there, reads the secret manager through a service account's token or by any other route that no person unlocks.
'''
zh = '''
本地设备，指人坐在跟前直接操作的机器；人和 agent 只经网络访问的机器 (例如服务器) 是远程机器 ({@rule:305})。人解锁的途径，指每次读取都要等人解锁的途径，例如密钥管理器应用的桌面集成。哪些机器是本地设备、各用哪条途径，由法域规定。本地设备上无人值守的任务怎么读，见 {@rule:305} 和 {@rule:306}。

本地设备上无人值守的任务以外的 agent 经 service account 的 token，或者经别的不需要人解锁的途径读密钥管理器的，即为违反本规定。
'''

