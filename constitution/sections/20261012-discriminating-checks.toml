id = "20261012-discriminating-checks"
article = "20261012-verification"
number = "2"
status = "draft"

[content]
en = '''
A check that would not fail in the case it is meant to rule out proves nothing. A sentence in compiled instructions does not show compliant behavior.
'''
zh = '''
一项检查，如果在它要排除的那种情况下也不会失败，就什么也证明不了。编译出的指令里有某句话，不能说明 agent 的行为合规。
'''
