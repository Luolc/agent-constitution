[title]
en = "Merge the change to the instructions first"
zh = "修改指令的变更先合入"

[text.statement]
en = "When work needs a change to instructions, merge that change first and do the rest of the work under the new instructions; the change of its own that updates the design next to it ({@rule:18}) may come before or after."
zh = "工作需要修改指令的，先合入修改指令的变更，其余的工作再按新指令进行；按 {@rule:18} 紧挨着它单独修改设计的那个变更，先后均可。"

[text.reason]
en = '''
Work proceeds under new instructions only once the change to them is in effect ({@constitution:separate-instruction-changes}).
'''
zh = '''
修改指令的变更生效之后，工作才能按新的指令进行 ({@constitution:separate-instruction-changes})。
'''

[text.verification]
en = '''
When work needs both a change to instruction files and changes to other files, which {@rule:46} keeps in two changes, the change to the instructions is merged and takes effect first, and the rest of the work is then done under the new instructions.

One change is outside this order: the change of its own in which the design follows the change to the instructions, which {@rule:18} lets be merged before or after it. A change that holds anything besides that change to the design is part of the rest of the work.

Violated when a change with the rest of the work is merged before the change to the instructions is in effect.
'''
zh = '''
工作既要修改指令文件、又要修改其他文件，按 {@rule:46} 分成两个变更的，修改指令的变更先合入并生效，其余的工作再按新指令进行。

只有一个变更不受这个先后限制：按 {@rule:18} 紧挨着修改指令的变更、单独修改设计的那个变更，在它之前或之后合入均可。变更里除了这处设计修改还有别的内容的，仍属于其余的工作。

做其余工作的变更在修改指令的变更生效之前合入的，即为违反本规定。
'''

