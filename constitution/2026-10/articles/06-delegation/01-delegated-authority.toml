id = "delegated-authority"
status = "active"

[content]
en = '''
When an agent delegates work to another agent, the authority it grants must not exceed its own; the delegated agent must not act beyond the scope of its task.
'''
zh = '''
agent 将工作委派给其他 agent 时，授予的权限不得超过自身的权限；受委派的 agent 不得超出任务的范围行事。
'''
