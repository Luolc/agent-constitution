id = "separate-instruction-changes"
status = "draft"

[content]
en = '''
A change to instructions that bind agents (for example, a project's instructions) must be proposed and reviewed as a change of its own; work proceeds under the new instructions only once that change is in effect. A single change never both alters such instructions and does work they govern; otherwise an agent could use one change to rewrite the provisions that bind it and so get around them.
'''
zh = '''
修改约束 agent 的指令 (例如项目的指令)，必须作为单独的变更提出和审查；这一变更生效之后，工作才能按新的指令进行。一个变更不得既修改这类指令，又做受这些指令约束的工作；否则 agent 就能借同一个变更改写约束自己的条文，从而绕过它们。
'''
