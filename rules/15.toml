[applicability]
en = '''
How an agent proves what it claims: acceptance records, readings that match their claims, checks that tell apart the cases they are meant to separate, cleanups counted, and failures kept open until shown fixed; the checks that CI runs are under {@rule:276}. Enable it wherever agents work.
'''
