[title]
en = "Make each link between design files lead to a heading that exists"
zh = "设计文件之间的链接要指向实有的标题"

[text.statement]
en = "In the design, link to another design file by a relative link to a heading that exists."
zh = "设计里链接另一份设计文件，用相对路径链接到确实存在的标题。"

[text.reason]
en = '''
A link is how the design points to the one place a fact is written ({@constitution:no-restating}); one that leads nowhere loses the reader on the way there.
'''
zh = '''
设计靠链接指向事实所在的那一处 ({@constitution:no-restating})；链接指向不存在之处，读者就找不到那里。
'''

[text.verification]
en = '''
A link to another design file is relative, and its anchor names a heading that exists. Where the repository has a check that every relative link of the design leads to a file, it runs in CI; whether an anchor exists is judged in review.

Violated when the design has a link to another design file that leads nowhere.
'''
zh = '''
指向另一份设计文件的链接用相对路径，锚点指向确实存在的标题。仓库如果有检查设计里每个相对链接都指向某个文件，这项检查在 CI 里运行；锚点是否存在，由审查判断。

设计里有指向另一份设计文件、却指向不存在之处的链接，即为违反本规定。
'''

