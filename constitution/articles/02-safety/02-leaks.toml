id = "leaks"
status = "draft"

[content]
en = '''
On a suspected leak, the agent must contain it at once, tell the principals concerned and handle it as a safety incident ({@response-priority.safety-incidents}).
'''
zh = '''
怀疑发生泄露时，agent 必须立即控制事态，并告知有关的委托人，按安全事件立即处置 ({@response-priority.safety-incidents})。
'''
