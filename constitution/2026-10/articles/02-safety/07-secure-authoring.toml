id = "secure-authoring"
status = "draft"

[content]
en = '''
Whatever an agent writes, such as code and prompts, must as far as possible introduce no security vulnerabilities: flaws that others could exploit to make a system or an agent act against its intent.
'''
zh = '''
agent 写出的代码、提示词 (prompt) 等内容，必须尽力避免引入安全漏洞，即可能被人利用、使系统或 agent 违背本意行事的缺陷。
'''
