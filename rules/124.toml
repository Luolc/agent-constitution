[title]
en = "Write each fact of the design in one place"
zh = "设计里每个事实只写在一处"

[text.statement]
en = "In the design, write each fact in one place and link to it from elsewhere instead of describing it again."
zh = "设计里每个事实只写在一处，别处链接过去，不再描述一遍。"

[text.reason]
en = '''
A fact written in two places drifts apart in one of them, and the reader cannot tell which to trust ({@constitution:no-restating}).
'''
zh = '''
一个事实写在两处，迟早有一处会走样，读者也分不清该信哪一处 ({@constitution:no-restating})。
'''

[text.verification]
en = '''
The same fact is not stated twice, in one file or across files, and no two places of the design contradict each other; a place that needs a fact written elsewhere links to it. Whether a fact is repeated is judged in review.

Violated when the design repeats or contradicts a fact written elsewhere in the design.
'''
zh = '''
同一个事实不在一个文件里或不同文件间写两遍，设计里也没有两处互相矛盾；别处需要这个事实的，链接到写它的地方。事实是否重复，由审查判断。

设计重复或违背了设计别处写的事实，即为违反本规定。
'''

