[title]
en = "Name a Slack channel with the scope's prefix"
zh = "Slack channel 按 scope 的前缀命名"

[text.statement]
en = "Name a Slack channel for one repository with the scope's repository prefix followed by the repository's name, and one for a cross-repository joint project with the scope's initiative prefix followed by the initiative's name."
zh = "单个仓库的 Slack channel 用 scope 的仓库前缀加仓库名命名，跨仓联合项目的用 scope 的 initiative 前缀加 initiative 的名字命名。"

[text.reason]
en = '''
fleet decides by a channel's name which repository or initiative a thread belongs to: a channel named with the repository prefix maps to that repository's main checkout, one named with the initiative prefix to the initiative's checkout. In a channel named otherwise, a thread starts no agent, and the principals' questions there reach none.
'''
zh = '''
fleet 靠 channel 的名字决定一个线程归哪个仓库或哪个 initiative：用仓库前缀命名的 channel 对应该仓库的主检出，用 initiative 前缀命名的对应该 initiative 的检出。名字不按约定，线程就不会起 agent，委托人在里面提的事也没有 agent 接。
'''

[text.verification]
en = '''
The prefixes are `channels.repo_prefix` and `channels.initiative_prefix` of the scope's settings; their values are set by the layers below. Direct messages belong to the scope's general initiative (`channels.general_initiative`), as does the channel named with the initiative prefix and that initiative's name.

Violated when a Slack channel newly made for a repository or a joint project is not named this way.
'''
zh = '''
两个前缀是 scope 设置里的 `channels.repo_prefix` 与 `channels.initiative_prefix`，取什么值由下层规定定。私信归 scope 的通用 initiative (`channels.general_initiative`)，以 initiative 前缀加这个 initiative 名字命名的 channel 也归它。

为某个仓库或联合项目新建的 Slack channel 不按这种方式命名的，即为违反本规定。
'''

