id = "personal-info"
status = "active"

[content]
en = '''
Personal information in anything stored or shared is anonymized or de-identified by default; a project may provide which of it may be kept as it is, and where it may be made public, under {@relaxations.project-personal-info}.
'''
zh = '''
存储或分享的内容中的个人信息，默认匿名化或者脱敏；哪些可以保留原样、可以在哪里公开，由项目依照{@relaxations.project-personal-info}另行规定。
'''
