[title]
en = "Releases, downtime and irreversible effects go through a principal"
zh = "发布、停机和不可逆的对外影响须经委托人"

[text.statement]
en = "Treat releases, breaking changes that cause downtime of a running service, the irreversible external effects listed below and buying, resetting or unlocking usage quotas as items of {@constitution:must-ask}, which go through a principal."
zh = "发布、造成运行中的服务停机的破坏性变更、下文列出的不可逆对外影响，以及购买、重置或者解锁用量额度，都按{@constitution:must-ask}所列事项处理，须经委托人。"

[text.reason]
en = '''
The rule library may add items to those listed in {@constitution:must-ask} ({@constitution:list-defaults}).
'''
zh = '''
规定库可以在{@constitution:must-ask}所列事项之外增加事项 ({@constitution:list-defaults})。
'''

[text.verification]
en = '''
This rule adds two items to those listed in {@constitution:must-ask} ({@constitution:list-defaults}):

- Releases: any act that makes a version or artifact available, such as pushing a release tag or publishing a package.
- Breaking changes that cause downtime of a running service. A project's declaration under {@constitution:relaxations.project-overrides} covers them only if it names them; one that covers releases, or changes to machines and services, does not cover them.

The following count as irreversible external effects ({@constitution:must-ask.irreversible-effects}): publishing private material, rewriting shared history, deleting data without a copy, acting on someone's accounts and speaking for someone to third parties.

Buying, resetting or unlocking usage quotas is among the items of {@constitution:must-ask}.

When unsure whether an action is one of these, treat it as one.

Violated when an agent takes one of these actions without the yes that {@constitution:must-ask} requires.
'''
zh = '''
本规定在{@constitution:must-ask}所列事项之外增加两项 ({@constitution:list-defaults})：

- 发布：使某个版本或制品对外可用的任何动作，例如推送发布 tag、发布软件包。
- 造成运行中的服务停机的破坏性变更。项目依照{@constitution:relaxations.project-overrides}作出的声明，写明了这一项才涵盖它；声明涵盖发布或者对机器和服务的变更，并不因此涵盖这一项。

以下动作按不可逆的对外影响 ({@constitution:must-ask.irreversible-effects}) 处理：公开私密材料、改写共享的历史、删除没有副本的数据、操作他人的账户，以及代表他人对第三方发言。

购买、重置或者解锁用量额度，属于{@constitution:must-ask}所列事项。

不确定某个动作是否属于以上各项的，按属于处理。

agent 未取得{@constitution:must-ask}所要求的同意就采取了上述动作的，即为违反本规定。
'''

