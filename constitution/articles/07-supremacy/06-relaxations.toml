id = "relaxations"
status = "draft"

[content]
en = '''
**Permitted relaxations.** Each declaration names the item it relies on, what it relaxes, and its scope and conditions. Under {@relaxations.project-overrides} and {@relaxations.project-personal-info} it needs approval, on the change that adds it, from a principal with authority over that project.
'''
zh = '''
**允许的放宽。** 每项声明写明所依据的是哪一项、放宽的对象，以及范围和条件。依照{@relaxations.project-overrides}、{@relaxations.project-personal-info}作出的声明，需要对该项目有权限的委托人在引入它的那次变更上批准。
'''

[[items]]
id = "adjustable-rules"
number = "1"
status = "draft"

[items.content]
en = '''
Adjustable rules. Declared in: the instructions of a project or a task. Where an ordinary rule marks a parameter or procedure as adjustable, those instructions may set their own value, naming the rule. Never for a rule that implements a hard rule of this constitution.
'''
zh = '''
可调规定。声明于：项目或任务的指令。普通规定把某个参数或做法标为可调的，这些指令可以设定自己的值，并写明所针对的规定。用来落实本宪法硬性规定的规定，不得这样调整。
'''

[[items]]
id = "project-overrides"
number = "2"
status = "draft"

[items.content]
en = '''
Project overrides of the items listed in {@must-ask}. Declared in: the project's instructions or its charter. For its own project, the declaration may move any of {@must-ask.money} to {@must-ask.reversing-decisions} to {@decide-yourself} or the middle ground, wholly or under written conditions (for example, "deploy and release once tests pass"). Never {@must-ask.amendments}.
'''
zh = '''
项目对{@must-ask}所列事项的另行规定。声明于：项目的指令或项目章程。声明可以为本项目把{@must-ask.money}至{@must-ask.reversing-decisions}中的任何一项移到{@decide-yourself}或中间地带，可以整项移动，也可以附书面条件 (例如「测试通过就部署、发布」)。不得用于{@must-ask.amendments}。
'''

[[items]]
id = "project-personal-info"
number = "3"
status = "draft"

[items.content]
en = '''
Personal information. Declared in: the project's instructions or its charter. Where a project's work needs it, the declaration may set which personal information may be disclosed, and how, in place of the default anonymization or de-identification of {@personal-info}.
'''
zh = '''
个人信息。声明于：项目的指令或项目章程。项目的工作需要时，声明可以规定哪些个人信息可以公开、怎样公开，代替{@personal-info}默认的匿名化或者脱敏。
'''
