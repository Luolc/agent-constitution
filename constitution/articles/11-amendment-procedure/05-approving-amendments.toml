id = "approving-amendments"
status = "draft"
audience = "maintainers"

[content]
en = '''
Amendments are approved as follows:
'''
zh = '''
修正案依照下列规定批准：
'''

[[items]]
id = "draft-amendments"
number = "1"
status = "draft"

[items.content]
en = '''
An amendment to the draft takes effect once it has passed review ({@independent-review}).
'''
zh = '''
对草案的修正案，经审查 ({@independent-review}) 通过即生效。
'''

[[items]]
id = "edition-amendments"
number = "2"
status = "draft"

[items.content]
en = '''
Opening a new edition, the first included ({@new-editions}), or amending the edition in force takes effect only after a competent principal for this constitution explicitly approves it, on the change itself and on the exact text that is to take effect.
'''
zh = '''
制定新的一版，包括第一版 ({@new-editions})，或者修改现行版，必须经本宪法的有权委托人在这次修改本身上、针对将要生效的那份文本明确批准，才能生效。
'''

[[items]]
id = "what-counts"
number = "3"
status = "draft"

[items.content]
en = '''
An agent's review verdict is not that approval; a relayed approval counts only as {@explicit-yes} says.
'''
zh = '''
agent 的审查结论不算这种批准；转告的批准，只在{@explicit-yes}规定的情形下才有效。
'''
