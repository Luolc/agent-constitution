[title]
en = "Keep large local data in the data directory, outside the repository"
zh = "本地大数据放在仓库外的数据目录"

[text.statement]
en = "Keep large local data in the data directory of its repository, `{$dirs.data}/<repo>/`, outside the repository."
zh = "本地的大数据放在所属仓库的数据目录 `{$dirs.data}/<repo>/`，不放在仓库里。"

[text.reason]
en = '''
Data kept in one fixed place outside the repository is found from the repository's name alone, on every machine ({@constitution:simplicity}).
'''
zh = '''
数据放在仓库外面一个固定的位置，在哪台机器上都只凭仓库名就能找到 ({@constitution:simplicity})。
'''

[text.verification]
en = '''
Every entry directly under `{$dirs.data}` is a directory named after a repository.

Violated when large data is kept elsewhere than in `{$dirs.data}/<repo>/`.
'''
zh = '''
`{$dirs.data}` 下的一级条目都是目录，目录名就是仓库名。

大数据放在 `{$dirs.data}/<repo>/` 以外的地方的，即为违反本规定。
'''

