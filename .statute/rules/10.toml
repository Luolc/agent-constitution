revision = 3
kind = "rule"
status = "trial"
lang = "en"
parent = "R277"
default = "on"
authority = ["personal-info", "sensitive-info"]
constitution = ">=1"
level = "project"
check = "none"
uses = ["instructions"]

[title]
en = "Use only made-up values in test data and examples"

[text.statement]
en = "In test data and in examples, use only made-up values: domains under `example.test`, addresses from 192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24 and 2001:db8::/32, and fictional names."

[text.reason]
en = '''
This repository is public; values that look real can be real, and the reserved ranges and domains can never be.
'''

[text.verification]
en = '''
The rule covers the tests of every member and crate, the examples in the design and the skills, and the example rule sets.

Violated when test data or an example holds a domain, an address or a name that is not made up in this way.
'''
