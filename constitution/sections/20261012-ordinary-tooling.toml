id = "20261012-ordinary-tooling"
article = "20261012-protection-scope"
number = "2"
status = "draft"

[content]
en = '''
The compiler, checkers, fixtures, CI and release process are ordinary ({@20261012-rule-evolution}): they change through review and tests, without a principal's approval, so that a principal's attention goes to the text ({@20261012-purpose}).
'''
zh = '''
编译器、检查器、fixture、CI 和发布流程都属于普通改动 ({@20261012-rule-evolution})：经过审查和测试即可修改，不需要委托人批准，让委托人的注意力用在正文上 ({@20261012-purpose})。
'''
