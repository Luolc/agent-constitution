revision = 2
kind = "rule"
status = "trial"
lang = "en"
parent = 175
default = "on"
authority = ["asking", "no-restating"]
constitution = ">=1"
level = "project"
check = "none"

[title]
en = "While a work item is under discussion, edit its body"
zh = "还在讨论的工作项直接改正文"

[text.statement]
en = "While a work item is under discussion, merge new content, decisions and corrections into its body instead of leaving them in comments."
zh = "还在讨论的工作项，把新内容、决定和更正并进正文，不留在评论里。"

[text.reason]
en = '''
A discussion spread over dozens of comments has to be read from the start to learn where it stands now; merged into the body, the body is enough ({@constitution:asking}), and each decision is written in one place ({@constitution:no-restating}).
'''
zh = '''
讨论散在几十条评论里，读的人要从头读完才知道现在定到哪一步；并进正文，读正文就够了 ({@constitution:asking})，每个决定也只写在一处 ({@constitution:no-restating})。
'''

[text.verification]
en = '''
Comments are for a work item that settled long ago and whose body is not to change again. A report under {@rule:179} is not such a change and is still a comment: it records an attempt once it has settled, not a discussion still going on.

Violated when a work item under discussion has a new decision or correction written only in a comment.
'''
zh = '''
评论只用于定型很久、不想再改正文的工作项。{@rule:179}的报告不在此列，仍写成评论：它是一次尝试定型之后的记录，不是还在进行的讨论。

还在讨论的工作项把新的决定或更正只写在评论里的，即为违反本规定。
'''

