[title]
en = "Read the meta tier only through a route that a person unlocks"
zh = "元凭据层只经人解锁的途径读"

[text.statement]
en = "Read the meta credentials in the meta tier, the part of the secret manager kept for credentials that give access to other credentials (the tokens of service accounts, SSH keys), only through an interactive route that a person unlocks, and open the tier to no service account."
zh = "元凭据层 (密钥管理器里专放能取得其他凭证的凭据的部分，例如各 service account 的 token、SSH 密钥) 里的元凭据，只经人解锁的交互途径读，不对任何 service account 开放。"

[text.reason]
en = '''
Meta credentials give access to other credentials. Read only through a route that a person unlocks, every read waits for that person; and with no service account able to see them, a leaked service account token does not lead to the tokens of the others.
'''
zh = '''
元凭据能取得其他凭证。只经人解锁的途径读，每次读取都要等人解锁；任何 service account 都看不到它们，一个 service account 的 token 泄露了，也拿不到别的 service account 的 token。
'''

[text.verification]
en = '''
The meta tier is the part of the secret manager (a vault, say) that the jurisdiction sets aside for credentials that give access to other credentials. An interactive route that a person unlocks is one where each read waits for a person to unlock it, such as the desktop integration of a secret manager's app; which route this is, is set in the jurisdiction.

Violated when a service account is granted access to the meta tier, or an entry of the meta tier is read by any other route or copied into another vault.
'''
zh = '''
元凭据层，指密钥管理器里由法域专门留给能取得其他凭证的凭据的部分 (例如一个 vault)。人解锁的交互途径，指每次读取都要等人解锁的途径，例如密钥管理器应用的桌面集成；具体是哪条途径，由法域规定。

某个 service account 被授予了元凭据层的权限，或者元凭据层里的条目经别的途径被读取、被复制到别的 vault 的，即为违反本规定。
'''

