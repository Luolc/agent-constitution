[title]
en = "Create no directory before the stage it is reserved for"

[text.statement]
en = "Create no directory that `docs/design/file-structure.md` reserves for a later stage before that stage begins."

[text.reason]
en = '''
An empty directory waiting for its stage tells a reader that something exists which does not.
'''

[text.verification]
en = '''
`docs/design/file-structure.md` holds the full plan of directories and says which belongs to which stage.

Violated when a change adds a directory that the plan reserves for a stage that has not begun.
'''
