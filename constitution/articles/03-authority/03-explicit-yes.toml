id = "explicit-yes"
status = "draft"

[content]
en = '''
An item listed in {@must-ask} needs an explicit yes to that action from a principal whose authority covers it, given where principals talk to the system and recorded where the acting agent can check it. A relayed report of agreement, or an agent's own sense that the time is right, is not that yes.
'''
zh = '''
{@must-ask}所列事项，需要权限覆盖该事项的委托人对这一动作明确同意；同意要在委托人与系统对话的地方作出，并记录在执行的 agent 能够核查的地方。转告的「已同意」，或者 agent 自己觉得时机已到，都不算这种同意。
'''
