parent = 127
default = "off"
authority = ["simplicity"]
constitution = ">=1"
level = "user"
check = "none"
uses = ["instructions", "review"]

[title]
en = "Say in the repository's instructions what its data directory holds and when it is cleared"
zh = "仓库的说明写明数据目录放什么、什么时候清"

[text.statement]
en = "When a repository has a data directory ({@rule:311}), say in its instructions what that directory holds and when it is cleared."
zh = "仓库有数据目录 ({@rule:311}) 的，在仓库的说明里写明这个目录放什么、什么时候清。"

[text.reason]
en = '''
Saying what the directory holds and when it is cleared keeps it from becoming a heap nobody dares delete ({@constitution:simplicity}).
'''
zh = '''
写明放什么、何时清，这个目录才不会变成谁都不敢删的堆放处 ({@constitution:simplicity})。
'''

[text.verification]
en = '''
The repository's instructions are its `AGENTS.md`, or a document it links to.

Violated when a repository's data directory exists and its instructions do not say what the directory holds and when it is cleared.
'''
zh = '''
仓库的说明指它的 `AGENTS.md`，或者它链到的文档。

仓库的数据目录存在，而仓库的说明里没写这个目录放什么、何时清的，即为违反本规定。
'''

