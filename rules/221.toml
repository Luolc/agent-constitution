[title]
en = "Keep nothing but others' sources in the root for third-party sources"
zh = "第三方源码的根目录下只放别人的源码"

[text.statement]
en = "Keep nothing but others' sources in the root for third-party sources ({@rule:132})."
zh = "第三方源码的根目录 ({@rule:132}) 下只放别人的源码。"

[text.reason]
en = '''
Your own reports or findings put among others' sources mix with their code and get lost ({@constitution:simplicity}).
'''
zh = '''
自己的调研报告、findings 放进别人的源码中间，就和别人的代码混在一起，也找不到了 ({@constitution:simplicity})。
'''

[text.verification]
en = '''
Your own output (research reports, findings) goes to the scratch directory ({@rule:130}).

Violated when the root for third-party sources holds your own output.
'''
zh = '''
自己的产物 (调研报告、findings) 放在 scratch 目录 ({@rule:130})。

第三方源码的根目录下放了自己的产物的，即为违反本规定。
'''

