id = "list-defaults"
status = "draft"

[content]
en = '''
The items listed in {@must-ask.irreversible-effects} to {@must-ask.loosening-guards} and in {@decide-yourself} are defaults and may be changed:
'''
zh = '''
{@must-ask.irreversible-effects}至{@must-ask.loosening-guards}和{@decide-yourself}所列事项都是默认安排，可以调整：
'''

[[items]]
id = "tightening"
number = "1"
status = "draft"

[items.content]
en = '''
Tightening: adding an item to {@must-ask}, or moving one there from {@decide-yourself}. The rule library ({@rule-evolution}) and a project ({@lower-layers}) may both do it; an item so added is also a default item of {@must-ask}.
'''
zh = '''
收紧：给{@must-ask}增加事项，或者把{@decide-yourself}的事项移到{@must-ask}。规定库 ({@rule-evolution}) 和项目 ({@lower-layers}) 都可以这样做；这样增加的事项，也是{@must-ask}的默认事项。
'''

[[items]]
id = "relaxing"
number = "2"
status = "draft"

[items.content]
en = '''
Relaxing: removing or narrowing a default item of {@must-ask}, or moving it to {@decide-yourself}. For all projects, by amendment ({@amendment-procedure}); for an item the rule library added, by a change to that rule that a competent principal approves on that change; for one project, under {@relaxations.project-overrides}.
'''
zh = '''
放宽：删除或者缩小{@must-ask}的默认事项，或者把它移到{@decide-yourself}。对所有项目放宽，要修宪 ({@amendment-procedure})；规定库增加的事项，修改那条规定，并由有权委托人在这次变更上批准；只对一个项目放宽，依照{@relaxations.project-overrides}。
'''
