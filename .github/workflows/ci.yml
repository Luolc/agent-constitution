# PR gate: secret scan of the PR's or push's commits, then pre-commit on
# all files, which includes the constitution build check, the tests and
# cargo fmt (local hooks; the site's tests need Hugo and the Rust
# toolchain, cargo fmt the toolchain, both installed before them), then the Rust
# lint, tests and package check, then the static site build with its link
# check, then the constitution numbering check and the instruction-only
# check, both against the base commit.
# The job name `check` is the required status check.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Every main commit needs a result of its own, so each one gets its own
  # group: a shared group would cancel a pending run when a newer one
  # arrives. On a PR branch, a newer push cancels the older run.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the commits of the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the secret scan and the checks against the base
          # commit read commits a shallow clone would miss.
          fetch-depth: 0
          # The site's theme, web/themes/hugo-book.
          submodules: true

      # The other half of the credential scan the commit hook runs. The hook
      # scans the staged content, which is the only place a secret can still
      # be stopped; CI has nothing staged, so it scans the commits of this
      # pull request or push instead: a commit that skipped the hook, or a
      # branch pushed from a clone where `pre-commit install` was never run.
      # The whole history is scanned weekly by gitleaks.yml.
      #
      # Pinned to the same version as the `gitleaks` hook in
      # .pre-commit-config.yaml; the two move together.
      - name: Secret scan (gitleaks, this PR's or push's commits)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.30.1
          # Commenting on the PR would need pull-requests: write; the job
          # log and the failed check are enough.
          GITLEAKS_ENABLE_COMMENTS: false

      # uv sets up the Python of pyproject.toml and, from uv.lock, the
      # environment with the two workspace members under tools/, limae
      # and pre-commit; --locked fails when the lock no longer matches the
      # pyproject.toml files. The uv version is the rev of the
      # uv-lock hook in .pre-commit-config.yaml; change both together.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - run: uv sync --locked --all-packages

      # Hugo builds the static site and runs in the tests of its templates.
      # Pinned by version and SHA-256, unpacked outside the checkout under
      # the versioned name the build step and the tests call; change the
      # version in all three places and in pages.yml.
      - name: Install Hugo
        env:
          HUGO_VERSION: 0.167.0
          HUGO_SHA256: 4d84519b9f619e6d4c3fb45a50157abeabeb724f859c60605f44c23def6e1169
        run: |
          set -euo pipefail
          bindir="$(mktemp -d)"
          tarball="${bindir}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "$bindir" hugo
          mv "${bindir}/hugo" "${bindir}/hugo-${HUGO_VERSION}"
          echo "$bindir" >> "$GITHUB_PATH"

      # The Rust toolchain of rust-toolchain.toml, the one place its version
      # is written, installed with the runner's rustup.
      - name: Install the Rust toolchain
        run: rustup toolchain install --no-self-update

      # The gitleaks hook scans only the staged diff, so CI skips it; the
      # scan of the commits above is the step that counts. The local hooks
      # run with --no-sync in the environment synced above.
      - run: uv run --frozen pre-commit run --all-files
        env:
          SKIP: gitleaks

      # The Rust workspace under crates/; its formatting is checked by the
      # cargo-fmt hook above. The dry run packages and builds the crate as
      # crates.io would receive it, without uploading.
      - name: Rust lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --locked
      - name: Rust package check
        run: cargo publish --dry-run --locked -p statute

      # The static site (docs/design/static-site.md) in four steps. The
      # rules' data, web/data/rules.json, without which Hugo fails; the
      # token count, which gets no credential here, so the pages say the
      # tokens were not counted; Hugo writes site/ (publishDir in
      # web/hugo.toml), failing on any warning; then the link check.
      - name: Rule data
        run: uv run --frozen site-rules
      - name: Token count
        run: uv run --frozen count-tokens
      - name: Build the static site
        run: hugo-0.167.0 --source web --cleanDestinationDir --panicOnWarning
      - name: Link check
        run: uv run --frozen check-site-anchors site

      # Numbering against the base: on a pull request the first parent of
      # the checked-out merge commit, which is the tip of the base branch
      # the PR was merged onto for this run; on a push the commit before it.
      # The commit hook runs without --base. The full-history checkout above
      # makes both commits available; only a push without a usable `before`
      # (the first push, or a rewritten history) skips the comparison and
      # says so. On a pull request a missing base fails the job. The step
      # prints the base it uses.
      - name: Constitution numbering against the base commit
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = push ] && ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "no base commit to compare with (${BASE}); skipping"
            exit 0
          fi
          base="$(git rev-parse --verify "${BASE}^{commit}")"
          echo "base: ${base}"
          cargo run --locked --quiet -p statute -- constitution build --check --base "$base"

      # Instruction files and other files never change together (see
      # docs/design/checkers.md). Same base as the step above, skipped the
      # same way on a push without a usable `before`.
      - name: Instruction-only changes against the base commit
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = push ] && ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "no base commit to compare with (${BASE}); skipping"
            exit 0
          fi
          base="$(git rev-parse --verify "${BASE}^{commit}")"
          echo "base: ${base}"
          uv run --frozen check-instruction-changes --base "$base"
