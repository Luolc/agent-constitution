[title]
en = "Give each file in the scratch directory a date in its name"
zh = "scratch 目录里的文件名带日期"

[text.statement]
en = "Give each file you put in a scratch directory ({@rule:310}) a date in its name."
zh = "放进 scratch 目录 ({@rule:310}) 的每个文件，文件名都带日期。"

[text.reason]
en = '''
A date in the name shows when a file was written and whether it still holds ({@constitution:evidence.grounds}).
'''
zh = '''
文件名带日期，才看得出一份文件是什么时候写的、还算不算数 ({@constitution:evidence.grounds})。
'''

[text.verification]
en = '''
A date is written `YYYY-MM-DD`, and research output is named `research-<topic>-<YYYY-MM-DD>.md`.

Violated when a file in a scratch directory has no date in its name.
'''
zh = '''
日期写成 `YYYY-MM-DD`，调研产物命名为 `research-<topic>-<YYYY-MM-DD>.md`。

scratch 目录里的文件名不带日期的，即为违反本规定。
'''

