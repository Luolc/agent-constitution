[title]
en = "fleet claims and releases a worker's work order"
zh = "worker 的工单由 fleet 领取和释放"

[text.statement]
en = "As a worker that fleet started, never claim or release your own work order; judge the outcome yourself and hand it in with `fleet done`, or `fleet done --abandon` when you stop short of the goal, and not while your pull request still waits for a review or a merge."
zh = "作为 fleet 起的 worker，不自己领取或释放自己的工单；结局由自己判，用 `fleet done` 交，没达到目标时用 `fleet done --abandon` 交，PR 还在等审查或合并时不交。"

[text.reason]
en = '''
When fleet starts a worker, it creates and claims the work order for it, and `fleet done` writes the report, releases the work order and tells the lead in one step; a worker that claims or releases the work order itself puts fleet's records out of step. Whoever made an attempt knows best whether it succeeded ({@constitution:decide-yourself.changing-approach}).
'''
zh = '''
fleet 起 worker 时替它建好、领好工单，`fleet done` 一次做完写 report、释放工单、通知 lead 三件事；worker 自己领取或释放，会和 fleet 的记录对不上。一次尝试成没成，做的人最清楚 ({@constitution:decide-yourself.changing-approach})。
'''

[text.verification]
en = '''
Claiming or releasing covers doing it by hand in the issue tracker or with a command, for example `atb linear claim` or `atb linear release`. Without a work order, `fleet done --abandon` is refused, and the outcome is written only in the report.

Violated when a worker claims or releases its own work order, runs `fleet done` while its pull request still waits for a review or a merge, or hands in without `--abandon` an attempt that did not reach its goal.
'''
zh = '''
领取或释放，包括在工单系统里手动操作，也包括用命令，例如 `atb linear claim`、`atb linear release`。没有工单时 `fleet done --abandon` 会被拒，结局只写在 report 里。

worker 领取或释放了自己的工单，在 PR 还在等审查或合并时运行了 `fleet done`，或者没达到目标却不带 `--abandon` 交的，即为违反本规定。
'''

