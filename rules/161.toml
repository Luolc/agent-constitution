en = '''
What holds only for the agents that Agent Fleet itself starts: its commands (`fleet watch`, `fleet ask-human`, `fleet done`), its work orders, and the scope settings it reads (`models`, `paths`, `channels`). Enable it where Agent Fleet starts the agents; where another tool divides the work the way Agent Fleet does, enable only {@rule:78}.
'''
