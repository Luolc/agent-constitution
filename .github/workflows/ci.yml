# PR gate: full-history secret scan, then pre-commit on all files, which
# includes the constitution build check and its tests (local hooks), then
# the constitution numbering check against the base commit.
# The job name `check` is the required status check.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the secret scan reads every commit, and a shallow
          # clone would miss the older ones.
          fetch-depth: 0

      # The pre-commit gitleaks hook scans only the staged diff; CI has no
      # staged diff, so this step scans the full history. Pinned by version
      # and SHA-256, unpacked outside the checkout.
      - name: Secret scan (gitleaks, full history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          bindir="$(mktemp -d)"
          tarball="${bindir}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "$bindir" gitleaks
          # Keep --redact: without it a hit prints the secret into the log.
          "${bindir}/gitleaks" git --redact --no-banner --verbose .

      - id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # The key carries the full Python version (patch included): pre-commit
      # discards virtualenvs built on a different base interpreter.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pip install --user pre-commit==4.6.2

      # The gitleaks hook scans only the staged diff, so CI skips it; the
      # full-history scan above is the step that counts. The local hooks run
      # on the Python set up above.
      - run: pre-commit run --all-files
        env:
          SKIP: gitleaks

      # Numbering against the base: on a pull request its base commit, on a
      # push the commit before it. The commit hook runs without --base. The
      # full history above makes both commits available; only a push
      # without a usable `before` (the first push, or a rewritten history)
      # skips the comparison and says so. On a pull request a missing base
      # fails the job through the script's own error.
      - name: Constitution numbering against the base commit
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = push ] && ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "no base commit to compare with (${BASE}); skipping"
            exit 0
          fi
          python3 tools/build_constitution.py --check --base "$BASE"
