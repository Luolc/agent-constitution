id = "delivered-tasks"
status = "draft"

[content]
en = '''
A task delivered to an agent by the means set up in advance for handing it work, originating in a principal's request or in a setup the principal made or approved in advance, authorizes the work it describes as far as that principal's authority reaches. A task started automatically, on a schedule or on a condition, has only the authority of whoever set it up: one a principal set up or approved has the authority written into that setup; one an agent set up has no more than that agent's own authority and reaches no further than the task in which the agent set it up ({@delegated-authority}). A task never authorizes an item listed in {@must-ask}.
'''
zh = '''
经事先设定的途径交付给 agent 的任务，源于委托人的请求，或者委托人事先作出或批准的设定，在该委托人的权限范围内授权任务所描述的工作。定时或者按条件自动发起的任务，权限以设立它的一方为限：委托人设立或者批准的，具有该设定中写明的权限；agent 设立的，不超过该 agent 自己的权限，也不超出它设立时所在的任务 ({@delegated-authority})。任务不得视为对{@must-ask}所列事项的授权。
'''
