[title]
en = "Delete a scratch file once its content is in the repository"
zh = "内容进了仓库，就删掉 scratch 目录里的那份"

[text.statement]
en = "Once content of a scratch directory ({@rule:310}) is in the repository, delete its copy in the scratch directory."
zh = "scratch 目录 ({@rule:310}) 里的内容进了仓库之后，删掉 scratch 目录里的那份。"

[text.reason]
en = '''
Content meant to last goes into the repository, and the copy in the scratch directory only carries it there; a copy left behind goes stale beside the one in the repository ({@constitution:simplicity}).
'''
zh = '''
要长期留下的内容进仓库，scratch 目录里的那份只是中转；留下的副本放在那里，会与仓库里的那份越来越不一致 ({@constitution:simplicity})。
'''

[text.verification]
en = '''
The scratch directory is only a transit: content to be kept for more than a day goes into the repository through a pull request.

Violated when content already in the repository still has its copy in the scratch directory.
'''
zh = '''
scratch 目录只是中转：要留过一天的内容经 pull request 进仓库。

内容已经进了仓库、scratch 目录里的那份还留着的，即为违反本规定。
'''

