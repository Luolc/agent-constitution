[title]
en = "Secret Manager"
zh = "密钥管理器"

[applicability]
en = '''
Keeps credentials in a secret manager in vaults divided by use, grants each service account only what its use needs, keeps agents to the vaults set aside for them, and says by which route a local device, an unattended task and a remote machine each read it. Enable it where credentials are kept in a secret manager and agents or unattended tasks read them; where only people fetch credentials, by hand, it need not be enabled.
'''
zh = '''
管凭证在密钥管理器里按用途分 vault 存放，每个 service account 只授予它的用途必需的权限，agent 只碰专为它们留出的 vault，以及本地设备、无人值守的任务和远程机器各经什么途径读取。凭证存放在密钥管理器里、并且有 agent 或无人值守的任务要读取凭证的地方启用；凭证只由人手动取用的，不必启用。
'''

