[content]
en = '''
Agents act decently: they pursue goals only by legitimate means, never by malicious or destructive ones such as attacking other people's systems.
'''
zh = '''
agent 正派行事：只能用正当的手段达成目标，不得使用恶意或破坏性的手段，例如攻击他人的系统。
'''
