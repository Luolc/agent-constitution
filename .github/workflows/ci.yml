# PR gate: full-history secret scan, then pre-commit on all files, which
# includes the constitution build check and the tests (local hooks; the
# tests of the site's templates need Hugo, installed before them), then
# the static site build with its link check, then the constitution
# numbering check and the instruction-only check, both against the base
# commit.
# The job name `check` is the required status check.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the secret scan reads every commit, and a shallow
          # clone would miss the older ones.
          fetch-depth: 0
          # The site's theme, web/themes/hugo-book.
          submodules: true

      # The pre-commit gitleaks hook scans only the staged diff; CI has no
      # staged diff, so this step scans the full history. Pinned by version
      # and SHA-256, unpacked outside the checkout.
      - name: Secret scan (gitleaks, full history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          bindir="$(mktemp -d)"
          tarball="${bindir}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "$bindir" gitleaks
          # Keep --redact: without it a hit prints the secret into the log.
          "${bindir}/gitleaks" git --redact --no-banner --verbose .

      # uv sets up the Python of pyproject.toml and, from uv.lock, the
      # environment with limae and pre-commit; --locked fails when the lock
      # no longer matches pyproject.toml. The uv version is the rev of the
      # uv-lock hook in .pre-commit-config.yaml; change both together.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - run: uv sync --locked

      # Hugo builds the static site and runs in the tests of its templates.
      # Pinned by version and SHA-256, unpacked outside the checkout under
      # the versioned name the build step and the tests call; change the
      # version in all three places and in token-count.yml.
      - name: Install Hugo
        env:
          HUGO_VERSION: 0.167.0
          HUGO_SHA256: 4d84519b9f619e6d4c3fb45a50157abeabeb724f859c60605f44c23def6e1169
        run: |
          set -euo pipefail
          bindir="$(mktemp -d)"
          tarball="${bindir}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "$bindir" hugo
          mv "${bindir}/hugo" "${bindir}/hugo-${HUGO_VERSION}"
          echo "$bindir" >> "$GITHUB_PATH"

      # The gitleaks hook scans only the staged diff, so CI skips it; the
      # full-history scan above is the step that counts. The local hooks run
      # with --no-sync in the environment synced above.
      - run: uv run --frozen pre-commit run --all-files
        env:
          SKIP: gitleaks

      # The static site (docs/design.md, Static site) in three steps. The
      # token count gets no credential here, so the pages say the tokens
      # were not counted; Hugo writes site/ (publishDir in web/hugo.toml),
      # failing on any warning; then the link check.
      - name: Token count
        run: uv run --frozen tools/count_tokens.py
      - name: Build the static site
        run: hugo-0.167.0 --source web --cleanDestinationDir --panicOnWarning
      - name: Link check
        run: uv run --frozen tools/check_site_anchors.py site

      # Numbering against the base: on a pull request the first parent of
      # the checked-out merge commit, which is the tip of the base branch
      # the PR was merged onto for this run; on a push the commit before it.
      # The commit hook runs without --base. The full history above makes
      # both commits available; only a push without a usable `before` (the
      # first push, or a rewritten history) skips the comparison and says
      # so. On a pull request a missing base fails the job. The step prints
      # the base it uses.
      - name: Constitution numbering against the base commit
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = push ] && ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "no base commit to compare with (${BASE}); skipping"
            exit 0
          fi
          base="$(git rev-parse --verify "${BASE}^{commit}")"
          echo "base: ${base}"
          uv run --frozen tools/build_constitution.py --check --base "$base"

      # Instruction files and other files never change together (see
      # docs/design.md, Checkers). Same base as the step above, skipped the
      # same way on a push without a usable `before`.
      - name: Instruction-only changes against the base commit
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = push ] && ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "no base commit to compare with (${BASE}); skipping"
            exit 0
          fi
          base="$(git rev-parse --verify "${BASE}^{commit}")"
          echo "base: ${base}"
          uv run --frozen tools/check_instruction_changes.py --base "$base"
