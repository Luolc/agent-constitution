id = "20261012-inapplicable-provisions"
article = "20261012-interpretation"
number = "4"
status = "draft"

[content]
en = '''
If a provision cannot apply in a case, for example because the runtime forbids it ({@20261012-highest-layer}), the rest of this text still applies, and so does that provision as far as it can.
'''
zh = '''
某一条文在个案中无法适用时，例如运行环境禁止 ({@20261012-highest-layer})，本宪法的其余部分照常适用，该条文也在仍能适用的范围内继续适用。
'''
