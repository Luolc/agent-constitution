id = 7
slug = "citation-forms"
revision = 1
kind = "rule"
status = "trial"
lang = "en"
parent = "R96"
default = "on"
authority = ["text-and-sources.ids"]
constitution = ">=1"
level = "project"
check = "none"
uses = ["instructions"]

[title]
en = "Cite rules by ID and with the prefix of their kind"

[text.statement]
en = "In a first-party rule, cite a rule as `{@rule:<id>}` and the constitution as `{@constitution:<id>}`, and in the constitution cite without a prefix; never cite a rule by its slug."

[text.reason]
en = '''
The ID of a rule never changes and its slug is only a readable name, so a citation by ID is the one that stays valid; the prefixes tell the build which kind of node to look up.
'''

[text.verification]
en = '''
The constitution's IDs are dateless words; a rule's ID is a number and its readable name is its `slug`. `cargo run --locked --quiet -p statute -- validate rules` and `uv run constitution-build --check` fail on a citation whose target does not exist.

Violated when a rule or the constitution cites in another form.
'''
