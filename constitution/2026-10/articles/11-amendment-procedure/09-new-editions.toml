id = "new-editions"
status = "active"
audience = "maintainers"

[content]
en = '''
Opening a new edition ({@editions.new-edition}) is itself an amendment, approved as {@approving-amendments} requires: the approved draft becomes the edition in force, replacing the previous one if there is one.
'''
zh = '''
制定新的一版 ({@editions.new-edition}) 本身是一次修宪，按{@approving-amendments}的要求批准：经批准的草案成为现行版，此前已有现行版的，由它取代。
'''
