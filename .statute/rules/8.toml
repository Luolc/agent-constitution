[title]
en = "Commit no instruction file compiled for a real person's rule set"

[text.statement]
en = "Commit no instruction file compiled from a real person's rule set; the compiled outputs committed here are this repository's own `AGENTS.md` and outputs built from made-up rule sets."

[text.reason]
en = '''
A person's compiled file holds their own rules and values, which belong to them and not to this repository.
'''

[text.verification]
en = '''
This repository's own compiled files are `AGENTS.md` and the installed skills that `statute compile` writes beside `statute.toml`.

Violated when a change commits an instruction file compiled from a rule set other than this repository's own or a made-up one.
'''
