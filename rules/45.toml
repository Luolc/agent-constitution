id = 45
slug = "credential-not-between-agents"
revision = 5
kind = "rule"
status = "trial"
lang = "en"
parent = 265
default = "on"
authority = ["sensitive-info"]
constitution = ">=1"
level = "project"
check = "none"

[title]
en = "Never pass a credential from one agent to another"
zh = "凭证不在 agent 之间传递"

[text.statement]
en = "Never pass a credential from one agent to another, by any channel."
zh = "不以任何方式在 agent 之间传递凭证。"

[text.reason]
en = '''
A credential is protected strictly and kept from leaking ({@constitution:sensitive-info}).
'''
zh = '''
凭证要严格保护，防止泄露 ({@constitution:sensitive-info})。
'''

[text.verification]
en = '''
A credential never passes from one agent to another, by any channel. An agent that needs one has the program that uses it fetch it from the place designated for it ({@rule:43}, {@rule:24}), or asks a principal to grant access.

Violated when a credential passes from one agent to another.
'''
zh = '''
凭证不得以任何方式在 agent 之间传递。agent 需要凭证时，由使用凭证的程序自己从指定的地方取用 ({@rule:43}、{@rule:24})，或者请委托人开通访问权限。

凭证在 agent 之间传递的，即为违反本规定。
'''

