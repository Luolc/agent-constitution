[title]
en = "Put a rule that holds only for one tool under that tool's domain"
zh = "只对某个工具成立的规定挂在这个工具的 domain 下"

[text.statement]
en = "Put a rule whose requirement holds only where a given tool is in use under that tool's domain, naming the tool, and write every other rule so that it holds whatever tool is in use."
zh = "要求只在使用某个工具时才成立的规定，挂在这个工具的 domain 下，并点名这个工具；其余的规定写成不管用什么工具都成立。"

[text.reason]
en = '''
A repository enables a tool's domain only when it uses the tool, so a rule under it binds no repository without the tool; a general rule that depends on a tool would bind every repository that enables its domain to that tool ({@constitution:division-of-instructions.rules}).
'''
zh = '''
仓库只有用到某个工具才启用它的 domain，挂在下面的规定就约束不到不用这个工具的仓库；通用的规定要是依赖某个工具，就会把启用它所在 domain 的每个仓库都绑到这个工具上 ({@constitution:division-of-instructions.rules})。
'''

[text.verification]
en = '''
The test: take the tool's name out of the rule and ask whether it can still be decided. If it can, the rule is general: it sits under no tool's domain, and a tool appears in it only as an example, marked as one, so that the requirement holds with the example removed. If it cannot, the requirement belongs to the tool (the commit hooks of Git, the division of work of Agent Fleet): the rule sits under that tool's domain and names the tool. Commits, branches, pushes, merges and pull requests are general concepts of version control and code hosting, not one tool.

Violated when a change adds or rewrites a rule that fails this test: a rule whose requirement belongs to a tool outside that tool's domain, or a general rule that depends on a tool or sits under a tool's domain.
'''
zh = '''
判据：把工具名从规定里拿掉，看它还能不能判定。能判定，就是通用规定：不挂在任何工具的 domain 下，工具在其中只能作为例子出现，并注明是例子，去掉例子要求照样成立。不能判定，要求就属于这个工具 (比如 Git 的 commit hook，Agent Fleet 的分工)：规定挂在这个工具的 domain 下，并点名这个工具。commit、分支、push、合并和 pull request 是版本控制与代码托管的通用概念，不算某一个工具。

变更新增或改写的规定不符合这个判据的，即为违反本规定：要求属于某个工具的规定不在这个工具的 domain 下，或者通用规定依赖某个工具、挂在某个工具的 domain 下。
'''

