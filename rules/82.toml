[title]
en = "Keep the design in one directory, one file per topic, with an index"
zh = "设计放在一个目录里，每个主题一个文件，配一份索引"

[text.statement]
en = "Keep a repository's design in one directory, split by topic into files so that changes to different topics touch different files, every file listed in the directory's index; write no design or decision document anywhere else."
zh = "仓库的设计放在一个目录里，按主题拆成多个文件，使改不同主题的变更改的是不同的文件，每个文件都列在该目录的索引里；别处不写设计文档或决策文档。"

[text.reason]
en = '''
A reader finds every design decision in one place, and a fact about the design is written once and linked to from elsewhere ({@constitution:no-restating}); a second kind of design document, such as a separate decision record, would hold the same decisions twice ({@constitution:simplicity}). Changes made in parallel each touch the file of their own topic, so they do not conflict when they are merged, as changes to one large file keep doing.
'''
zh = '''
读者在一个地方就能找到所有设计决定，关于设计的一个事实只写一次，别处链接过去 ({@constitution:no-restating})；再加一类设计文档，例如单独的决策记录，同样的决定就会写两遍 ({@constitution:simplicity})。并行的变更各自改自己主题的文件，合入时就不会冲突；大家都改同一个大文件，就会不断冲突。
'''

[text.verification]
en = '''
The design lives in one directory, for example `docs/design/`. Each file covers one topic, a part that a change can alter without altering the others, reads on its own and has one `# ` title. A file that holds several such topics is split. The directory's index, for example its `README.md`, links to every other file of the directory except the translations ({@rule:21}), in reading order, with a line on what each covers. A change that adds a design file adds it to the index in the same change.

A decision is written into the part of the design it concerns, with its reasons; a decision that replaces another changes that part. No separate decision record, design note or second design is kept elsewhere in the repository.

Violated when a design or decision document lives outside that directory, a file of the directory other than a translation is missing from the index, or one file holds several topics that changes alter apart.
'''
zh = '''
设计放在一个目录里，例如 `docs/design/`。每个文件讲一个主题，即一个变更可以只改它、不动其他部分的那一部分；每个文件可以单独阅读，有且只有一个 `# ` 标题。一个文件里装了几个这样的主题的，就拆开。目录的索引 (例如它的 `README.md`) 按阅读顺序链接到目录里除译文 ({@rule:21}) 以外的其他每个文件，每个配一行说明讲的是什么。新增设计文件的变更，在同一个变更里把它加进索引。

一个决定连同理由写进它所涉及的那部分设计；取代旧决定的新决定，直接改那部分。仓库里别处不另设决策记录、设计笔记或第二份设计。

设计文档或决策文档放在这个目录之外，目录里译文以外的文件没有列进索引，或者一个文件里装着几个会被不同变更分别修改的主题，即为违反本规定。
'''

