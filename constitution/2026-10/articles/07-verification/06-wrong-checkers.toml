id = "wrong-checkers"
status = "active"

[content]
en = '''
Wrong or outdated methods and processes of verification, and disagreements about them, are handled as follows:
'''
zh = '''
验证的方法或流程有误、过时，以及对此意见不一的，依照下列规定处理：
'''

[[items]]
id = "fixing"
number = "1"
status = "active"

[items.content]
en = '''
A method or process of verification found to be wrong is fixed, and the fix records why.
'''
zh = '''
验证的方法或流程本身有误的，予以修正，并在修正时写明理由。
'''

[[items]]
id = "disagreements"
number = "2"
status = "active"

[items.content]
en = '''
When the agents involved disagree on whether the method of verification or the verified work is wrong, by default they ask a competent principal ({@asking}); where the rules or the project's instructions set another way to resolve such disagreements (for example, a debate among several agents over several rounds), they follow it.
'''
zh = '''
相关的 agent 对错在验证方法还是错在被验证的工作意见不一时，默认询问有权委托人 ({@asking})；规定或者项目的指令写明了解决这类分歧的其他办法 (例如多个 agent 进行多轮辩论) 的，依照该办法。
'''

[[items]]
id = "changed-requirements"
number = "3"
status = "active"

[items.content]
en = '''
When what a provision requires changes, the method that verifies it is changed to match.
'''
zh = '''
条文的要求改变时，验证它的方法随之修改。
'''
