[title]
en = "The instruction system apart, the compiled AGENTS.md and statute's own entries in the lock file going with the side that changed them"

[text.statement]
en = "Change the instruction system in a change of its own, never together with changes to anything else; the instruction system is the instruction files together with what serves them and has to change with them, the commit hook and CI entries that install statute, pin its version or run it among them; count as generated files ({@rule:R47}), outside the instruction system, the `AGENTS.md` at the root of this repository, which this repository's statute compiles and `statute compile --check` in CI proves equal to a recompile, and a change to the root `statute.lock` that alters nothing in it but the `statute` version and the `commands` that statute records (for example, a change to statute's code commits either together with that code); every other change to `statute.toml`, `statute.lock`, `.statute/`, `rules/` or the sources of the constitution stays a change to the instruction system."

[text.reason]
en = '''
{@rule:R334} counts every `AGENTS.md` and a rule set's lock file as instruction files, and the compiler's own code as outside the instruction system. Here the code is the compiler of `AGENTS.md`: a change to how statute renders the rules must commit the recompiled `AGENTS.md` to pass the compile check, and then mixes an instruction file with code, so it can pass CI neither way. Only this repository is so: in any other repository statute is a fixed tool, part of building the instructions, and the public rule stays as it is there.

The root `AGENTS.md` can hold only what statute compiles from `statute.toml` and `statute.lock` (the commit hook and CI run `statute compile --check`), so a change to it that does not come from those files must come from the compiler. {@rule:R47} still binds such a change: its description says that only the rendering changed, the review checks that, and if the meaning changed the change counts as a change to instructions ({@constitution:separate-instruction-changes}).

The lock file records the version of statute that wrote it and the commands of the enabled rules' checks, so that CI can install that version from the lock file alone. The version is set by statute's code, and the commands are rendered from the rules, so these two entries carry no meaning of their own: a change that raises the version of statute must rewrite them to pass the compile check, as it must recompile `AGENTS.md`. The rest of the lock file pins the rules and sources and stays an instruction file.

{@rule:R334} also has the change that first compiles a repository's instructions add the compile check; this repository's instructions are compiled already, so no change of it is that change, and the requirement is left out here.

This loosens a guard, so it took effect only with a principal's yes on the change that adds it ({@constitution:must-ask.loosening-guards}).
'''

[text.verification]
en = '''
Instruction files are those {@rule:R334} lists, with the files of statute that {@rule:27} counts as instruction files besides them, except the `AGENTS.md` at the root of the repository, and the root `statute.lock` when, read as TOML before and after the change with its top-level `statute` and `commands` left out, it is the same. An `AGENTS.md` or a `statute.lock` in a subdirectory stays an instruction file.

The entries of the commit hook and CI configuration in the instruction system are those that install statute, pin its version or run it; here they are the hooks `statute-validate`, `constitution` and `statute-compile` in `.pre-commit-config.yaml`, and the steps under `.github/workflows/` that run statute's `validate`, `constitution build` or `compile`. Outside the instruction system are the steps that build, test or publish statute's code, the step that runs every commit hook, and the steps that run a tool of `tools/` which calls statute in turn. A file that holds both counts by what the change alters in it.

`uv run check-instruction-changes --base origin/main` lists such a root `AGENTS.md` and `statute.lock` among the generated files, which count with neither side, and CI runs it on every pull request; it fails a change that mixes another instruction file with other files. Where it does not tell the entries that install, pin or run statute apart from the rest of their file, the review does. `statute compile --check` shows that the root `AGENTS.md` and `statute.lock` equal what statute writes now.

Violated when a change alters both the instruction system and anything outside it, the root `AGENTS.md` and a change to the root `statute.lock` that alters nothing but its `statute` and `commands` counted as generated files.
'''
