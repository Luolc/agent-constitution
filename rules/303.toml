[title]
en = "Read only vaults set aside for agents, never a person's own"
zh = "只读专为 agent 留出的 vault，不碰人自己用的"

[text.statement]
en = "Read and reference only vaults that a principal sets aside for agents, never a vault that a person keeps for their own use."
zh = "agent 只读取、引用委托人专为 agent 留出的 vault，不碰人自己用的 vault。"

[text.reason]
en = '''
A vault that a person keeps for their own use holds that person's own logins, which are not meant for agents. Keeping agents to the vaults set aside for them keeps what agents can reach apart from what people use. What an agent does need from a person, such as the answers it fills into a form on their behalf, a principal puts into a vault set aside for agents.
'''
zh = '''
人自己用的 vault 里是这个人自己的登录项，不是给 agent 用的。agent 只碰专为它们留出的 vault，agent 能访问的和人日常用的就分开了。agent 确实需要从人那里拿的东西，比如代人填表时要填的答案，由委托人放进专为 agent 留出的 vault。
'''

[text.verification]
en = '''
A vault set aside for agents is one that a principal names for agents to read, such as the vault of the credentials people put in for agents; a vault that a person keeps for their own use is one holding that person's own logins and other entries, such as the personal vault of a password manager. Which vaults are set aside for agents, which machines may read each and who writes to it are set in the jurisdiction. Reading an entry of a vault references the vault.

Violated when an agent references or reads a vault that no principal has set aside for agents.
'''
zh = '''
专为 agent 留出的 vault，指委托人点名给 agent 读的 vault，例如放着人给 agent 用的凭证的 vault；人自己用的 vault，指放着这个人自己的登录项和其他条目的 vault，例如密码管理器里的个人 vault。哪些 vault 是专为 agent 留出的、各由哪些机器读、由谁写入，由法域规定。读取一个 vault 里的条目，也算引用了这个 vault。

agent 引用或读取了没有委托人专为 agent 留出的 vault 的，即为违反本规定。
'''

