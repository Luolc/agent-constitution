# The static site: two pages per language, the constitution and its version
# for agents, made by content/_content.gotmpl from
# constitution/constitution.<lang>.md and constitution.<lang>.agent.md.
# `hugo-0.167.0 -s web` builds it into site/; tools/build_site.py counts the
# tokens first and checks the links after. See docs/design.md (Static
# site).
baseURL = "/"
publishDir = "../site"
# Relative links, so that site/index.html also opens as a file.
relativeURLs = true
title = "Agent Constitution"
theme = "hugo-book"
defaultContentLanguage = "en"
disableKinds = ["taxonomy", "term", "section", "rss", "sitemap", "404"]
enableRobotsTXT = false

# countWords: whether the lengths give words as well as characters; words
# are split on white space, which Chinese does not put between them.
[languages.en]
  label = "English"
  title = "Agent Constitution"
  weight = 1
  [languages.en.params]
    countWords = true

[languages.zh]
  label = "中文"
  title = "Agent 宪法"
  weight = 2
  [languages.zh.params]
    countWords = false

# The sidebar lists the site's pages: the constitution, which is the home
# page, with its version for agents under it. The names are short, the
# site's title standing above them.
[[languages.en.menus.before]]
  identifier = "constitution"
  name = "Constitution"
  pageRef = "/"
  weight = 1
[[languages.en.menus.before]]
  parent = "constitution"
  title = "The version agents read"
  name = "Agent version"
  pageRef = "/agent"
  weight = 1
[[languages.zh.menus.before]]
  identifier = "constitution"
  name = "宪法"
  pageRef = "/"
  weight = 1
[[languages.zh.menus.before]]
  parent = "constitution"
  title = "agent 读到的版本"
  name = "agent 版"
  pageRef = "/agent"
  weight = 1

# The content is only this repo's own built constitution; raw HTML is
# needed for its anchors (<a id="...">) and the asterisks
# (<sup class="omitted">).
[markup.goldmark.renderer]
  unsafe = true

# The table of contents at the right lists the articles and the preamble,
# the level-2 headings under the page's `#` title.
[markup.tableOfContents]
  startLevel = 2
  endLevel = 2

[params]
  BookTheme = "auto"
  # The menu root is the home page; its one child, the version for
  # agents, is hidden from the theme's list of pages and named in the
  # menu above instead.
  BookSection = "/"
  BookToC = true
  BookSearch = false
  BookComments = false
  BookServiceWorker = false
  BookTranslatedOnly = false
  # Linked in the sidebar, under the site's title.
  SourceRepo = "https://github.com/Luolc/agent-constitution"
  # The asterisk after a provision the version for agents leaves out, as
  # tools/build_constitution.py writes it (OMITTED_MARK).
  omittedMark = '<sup class="omitted">*</sup>'
  # The model tools/count_tokens.py counts the tokens for, and its name in
  # the popup on the counts.
  [params.tokenCount]
    model = "claude-opus-5-5"
    name = "Claude Opus 5.5"

# The built constitution comes from constitution/: the two Markdown files
# of each language as assets, which content/_content.gotmpl reads, and
# index.toml as data, for the revision and the status. data/lengths.json,
# written by tools/count_tokens.py and not committed, holds the tokens.
# A component with a mount of its own loses its default one, so data and
# assets are mounted again.
[[module.mounts]]
  source = "../constitution"
  target = "assets/constitution"
  files = ["constitution.*.md"]
[[module.mounts]]
  source = "../constitution/index.toml"
  target = "data/constitution.toml"
[[module.mounts]]
  source = "data"
  target = "data"
[[module.mounts]]
  source = "assets"
  target = "assets"
