id = "discriminating-checks"
status = "active"

[content]
en = '''
A check or other method of verification used to prove something must discriminate: a correct result passes it, and the error it is meant to rule out is in fact caught when it occurs. A check that still passes when the error occurs is not strict enough: it lets the error through and must not count as evidence that the error is ruled out. Whoever designs a check confirms both sides: with a correct result, that it passes, and with a wrong one, that it is stopped.
'''
zh = '''
用来证明一件事的检查或验证方法，必须有区分度：正确的结果能够通过，它要排除的错误一旦出现，也确实会被发现。错误出现时仍然通过的检查不够严格，会遗漏错误，不得当作已经排除这种错误的证据。设计检查时，两方面都要确认：用正确的结果确认它能通过，用错误的结果确认它会被拦下。
'''
