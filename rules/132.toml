[title]
en = "Keep third-party sources under a root of their own, at `<owner>/<repo>`"
zh = "第三方源码放在自己的根目录下的 `<owner>/<repo>`"

[text.statement]
en = "Clone third-party sources to `<root>/<owner>/<repo>/`, under the root the jurisdiction designates for them, and keep nothing but others' sources there."
zh = "第三方源码的 clone 放在法域为它指定的根目录下的 `<root>/<owner>/<repo>/`，那里只放别人的源码。"

[text.reason]
en = '''
Others' sources cloned into the root of main checkouts ({@rule:128}) mix with your own repositories; with `<owner>` in the path, two repositories of the same name do not collide. Your own reports or findings put among them mix with others' code and get lost ({@constitution:simplicity}).
'''
zh = '''
别人的源码放进主检出的根目录 ({@rule:128})，就和自己的仓库混在一起；路径带上 `<owner>`，同名的仓库也不会冲突。自己的调研报告、findings 放进去，就和别人的代码混在一起，也找不到了 ({@constitution:simplicity})。
'''

[text.verification]
en = '''
The root holds two levels of directories, `<owner>/<repo>`; the jurisdiction designates it, for example in a rule of a lower layer. Your own output (research reports, findings) goes to the scratch directory ({@rule:130}).

Violated when a clone of third-party sources is kept elsewhere than in `<root>/<owner>/<repo>/`, or the root holds your own output.
'''
zh = '''
根目录下是两级目录 `<owner>/<repo>`；根目录由法域指定，例如写在下层的规定里。自己的产物 (调研报告、findings) 放在 scratch 目录 ({@rule:130})。

第三方源码的 clone 放在 `<root>/<owner>/<repo>/` 以外，或者根目录下放了自己的产物的，即为违反本规定。
'''

