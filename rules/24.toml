[title]
en = "Pass a credential to a program only through the environment or a file"
zh = "凭证只经环境变量或文件交给程序"

[text.statement]
en = "Let a credential's value reach a program only through an environment variable or a file, never through a command-line argument or any output you see."
zh = "凭证的值只经环境变量或文件交给程序，不经命令行参数，也不出现在你能看到的任何输出里。"

[text.reason]
en = '''
A credential is protected strictly and kept from leaking ({@constitution:sensitive-info}). A command line can be seen by other processes on the machine and is kept in shell history and logs, and what an agent sees enters its context; either way the value leaks.
'''
zh = '''
凭证要严格保护，防止泄露 ({@constitution:sensitive-info})。命令行能被同一台机器上的其他进程看到，还会留在 shell 历史和日志里；agent 看到的内容会进入它的上下文。两种情况下，凭证的值都会泄露。
'''

[text.verification]
en = '''
Splitting, trimming or otherwise changing the value happens inside the program that uses it, not in the shell. When the work cannot be done without the value showing, the agent stops and reports the gap to a principal.

When unsure whether a way of passing the value lets it show, use an environment variable or a file.

Violated when a credential's value appears in a command line or any output the agent sees, or is split or trimmed in the shell.
'''
zh = '''
需要拆分、截取或者以其他方式处理凭证的值的，在使用它的程序内部完成，不在 shell 里做。不暴露凭证的值就无法完成工作的，agent 停下来，把缺口报告给委托人。

不确定某种传递方式是否会让值显露出来的，改用环境变量或文件。

凭证的值出现在命令行或 agent 可见的任何输出中，或者在 shell 里被拆分、截取的，即为违反本规定。
'''

