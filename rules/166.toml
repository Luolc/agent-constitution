[title]
en = "As a lead, put an unsettled review to a principal with `fleet ask-human`"
zh = "lead 用 `fleet ask-human` 把没谈拢的审查交给委托人"

[text.statement]
en = "As a lead that fleet started, when a review is still unapproved after three rounds or its author and reviewer disagree about a P0 finding, put the matter to a principal with `fleet ask-human`; give another round yourself instead only when the remaining finding is the same as in the round before, smaller than it was, and undisputed."
zh = "作为 fleet 起的 lead，审查三轮仍未批准，或者作者与审查方对一条 P0 级问题有分歧时，用 `fleet ask-human` 交委托人决定；只有剩下的问题与上一轮是同一条、比上一轮小、双方也没有分歧时，才可以不问人，自己再给一轮。"

[text.reason]
en = '''
A review still unsettled after three rounds mostly hides a disagreement about direction or standards, and going on only spins; a disagreement about a P0 finding means the two judge its consequences differently, which is for a person to decide ({@constitution:asking}). When one finding shrinks round after round and no one disputes it, another round costs little and is not worth a person's attention. {@rule:64} leaves the decision after three rounds to the agent responsible for the work; this rule narrows it for a lead of fleet. `fleet ask-human` posts the question into the job's home thread, the conversation principals hold with the thread agent, as {@rule:115} allows.
'''
zh = '''
审查三轮还没谈拢，多半是方向或标准上有分歧，再审下去只是空转；对 P0 级问题有分歧，说明双方对后果的判断不同，这得由人来定 ({@constitution:asking})。而一条问题逐轮缩小、也没有人有异议时，再给一轮代价很小，不值得占用人的注意力。{@rule:64}把三轮之后的决定交给负责这项工作的 agent；本规定对 fleet 的 lead 把它收窄。`fleet ask-human` 把问题贴进 job 的 home thread，也就是委托人与 thread agent 的那段对话，这是{@rule:115}允许的做法。
'''

[text.verification]
en = '''
A round is one verdict of the reviewer. A P0 finding is one of the highest priority on the scale the review grades its findings by. Before giving another round itself, the lead checks both points: the remaining finding is the same as in the round before and smaller than it was, and the author and the reviewer do not disagree about it. When it asks, it asks everything at once, with the course it recommends.

Violated when, after the third round without approval, the lead gives another round without both points holding or settles the review in any other way without putting it to a principal; when a disagreement about a P0 finding is settled without a principal; or when the lead puts either question to a principal by any route other than `fleet ask-human`.
'''
zh = '''
一轮指审查方发出一份 verdict。P0 级问题指审查给问题分级所用的那套优先级里最高一级的问题。lead 自己再给一轮之前，核对两点：剩下的问题与上一轮是同一条，而且比上一轮小；作者与审查方对它没有分歧。问人时一次问完，附上推荐的做法。

第三轮之后仍未批准，lead 不满足上面两点仍自己给了新的一轮，或者没有交委托人就用别的方式了结了这次审查；对 P0 级问题的分歧没有交委托人就定了；或者 lead 经 `fleet ask-human` 以外的途径向委托人提这两类问题的，即为违反本规定。
'''

