# Publishes the statute crate to crates.io when a tag statute-v<version> is
# pushed (docs/design/amendments-and-releases.md). crates.io trusts this
# workflow and the environment `release` (Trusted Publishing): the job
# trades its OIDC token for a short-lived crates.io token, so the repo holds
# no crates.io secret. The environment admits only statute-v* tags.
# Before publishing, check-release-tag checks the tag against the
# manifest, that the commit is on main, and that its CI run on main
# succeeded on the first attempt.

name: Release

on:
  push:
    tags: ["statute-v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      actions: read # check-release-tag lists the commit's CI runs
      id-token: write # the OIDC token crates.io trades for its own
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and origin/main, for the check that the tagged
          # commit is on main.
          fetch-depth: 0
          persist-credentials: false

      # The uv version is the rev of the uv-lock hook, as in ci.yml.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - run: uv sync --locked --all-packages

      - name: Release check
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen check-release-tag --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"

      - name: Install the Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked -p statute
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
