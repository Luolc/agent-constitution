# Commit hooks: secret scan, constitution build check and its tests, and
# limae on the Chinese text, in the sources and in the built file.
repos:
  # Scans only the staged diff (the upstream entry ends in --staged); CI
  # scans the full history, so the two complement each other.
  # --redact is repeated here: inherited arguments are not visible in this
  # file and could be dropped when the rev is bumped.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--redact", "--no-banner", "."]

  # The constitution build: --check validates the sources (the constitution
  # and the rules) and requires the committed outputs to match a fresh
  # build; the tests cover the script. The numbering check against a base
  # commit (--base) runs only in CI.
  - repo: local
    hooks:
      - id: constitution
        name: constitution build check
        entry: python3 tools/build_constitution.py --check
        language: system
        files: ^(constitution|rules|tools)/
        pass_filenames: false
      # Python, not system, so that limae is installed for the tests of
      # lint_zh_sources.py, which run it.
      - id: constitution-tests
        name: tools tests
        entry: python -m unittest discover -s tools
        language: python
        additional_dependencies: ["limae==0.13.3"]
        files: ^tools/
        pass_filenames: false
      # The `zh` text of each source, citations replaced by Chinese text
      # shaped like their rendering. Checks only; fix locally with
      # `python3 tools/lint_zh_sources.py --fix`.
      - id: zh-sources
        name: limae on the zh text of the sources
        entry: python tools/lint_zh_sources.py
        language: python
        additional_dependencies: ["limae==0.13.3"]
        files: ^(constitution/(index\.toml|articles/)|rules/|tools/lint_zh_sources\.py$)
        pass_filenames: false

  # The built Chinese constitution, with limae's default configuration.
  # Rule switches go in a limae.toml, never in args: --disable and --enable
  # make limae skip its configuration file. The rev and the limae pins of
  # the local hooks above name the same version; bump them together.
  - repo: https://github.com/Luolc/limae-pre-commit
    rev: v0.13.3
    hooks:
      - id: limae
        files: ^constitution/constitution\.zh\.md$
