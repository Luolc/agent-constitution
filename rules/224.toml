[title]
en = "End an attempt as done or abandoned"
zh = "尝试只以完成或放弃结束"

[text.statement]
en = "End the child work item of an attempt only in the status `{$work-items.status-done}` or the status `{$work-items.status-abandoned}`."
zh = "一次尝试的子工作项只以状态 `{$work-items.status-done}` 或状态 `{$work-items.status-abandoned}` 结束。"

[text.reason]
en = '''
With two outcomes only, the parent work item shows at a glance how each attempt ended. Whoever made the attempt judges how it ended, whether or not anything was merged ({@constitution:decide-yourself.changing-approach}).
'''
zh = '''
结局只有两种，父工作项一眼就看得出每次尝试的结局。结局由做这次尝试的一方自己判，与有没有合入无关 ({@constitution:decide-yourself.changing-approach})。
'''

[text.verification]
en = '''
The child work items are those of {@rule:177}. The status for an abandoned attempt is a status of its own, added beside the existing ones; no existing status is renamed or deleted for it. On a ticketing system that groups statuses into types, it is of the type for canceled work (in Linear, the canceled type).

Violated when a child work item ends in a status other than these two.
'''
zh = '''
子工作项指{@rule:177}所说的子工作项。放弃的尝试所用的状态是单独的一个状态，加在现有状态旁边；不为它改名或删除任何现有状态。工单系统把状态分成类型的，它属于取消类的类型 (在 Linear 里是 canceled 类型)。

子工作项结束时停在这两个状态以外的状态的，即为违反本规定。
'''

