{{- /* Under the language switch: the color theme, cycling through
  following the system, light and dark (assets/theme.js). */ -}}
<button type="button" class="theme-toggle" aria-label="{{ i18n "theme-switch" }}">
  <span class="auto">{{ i18n "theme-auto" }}</span><span class="light">{{ i18n "theme-light" }}</span><span class="dark">{{ i18n "theme-dark" }}</span>
</button>
