# Node 20, a domain, a one-of or a rule, with a `parent` or `overrides`,
# in a source that also holds domain 2, one-of 3 and rule 10 under it,
# and `subdomain`, domain 4 under domain 2. Only what one source can tell
# is checked here (docs/design/rule-sources.md, Overrides and
# Subdomains): a reference to another source, `team:7`, is checked for
# its form alone. The compiler (test_rule_tree.py) builds the source with
# each node. A case that fails draws errors on rules/20.toml and on no
# other file, among them one holding its `compiler` text.

subdomain = """
id = 4
revision = 1
kind = "domain"
status = "draft"
lang = "en"
parent = 2

[title]
en = "Subdomain"
"""

[[cases]]
name = "a subdomain under a domain"
passes = true
node = """
id = 20
revision = 1
kind = "domain"
status = "draft"
lang = "en"
parent = 2

[title]
en = "Node"
"""

[[cases]]
name = "a rule under a subdomain"
passes = true
node = """
id = 20
revision = 1
kind = "rule"
status = "draft"
lang = "en"
parent = 4
authority = ["alpha"]
constitution = ">=1"
level = "project"
check = "review"

[title]
en = "Node"

[text.statement]
en = "Do it."

[text.reason]
en = "Because."

[text.verification]
en = "Violated when not."
"""

