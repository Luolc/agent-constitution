[title]
en = "Name the repository in a command that would take it from the working directory"
zh = "命令会从工作目录推断仓库的，写明仓库"

[text.statement]
en = "When you run, from a directory not known to be a checkout of the repository you mean, a command that would take its repository from the working directory, name that repository in the command, or first confirm that the working directory is inside it."
zh = "在一个不确知是目标仓库检出的目录里，运行不写明仓库时会从工作目录推断仓库的命令的，在命令里写明这个仓库，或者先确认工作目录就在这个仓库里。"

[text.reason]
en = '''
Run from another directory, such a command reads another repository or none, and its answer, often empty, looks the same as a true "none": it cannot tell the two cases apart ({@constitution:discriminating-checks}), and a fact taken from it is not the one looked for ({@constitution:evidence.facts}).
'''
zh = '''
在别的目录下运行，这样的命令读到的是另一个仓库，或者什么仓库也读不到；它的回答往往是空的，看上去和真正的「没有」一样，分不开这两种情况 ({@constitution:discriminating-checks})，从中取得的事实也不是要查的那个 ({@constitution:evidence.facts})。
'''

[text.verification]
en = '''
Such a command picks its repository from the working directory when none is named, as `gh` does without `-R <owner>/<repo>` and `git` without `-C <path>`. A directory is known to be a checkout of the repository when the agent set its working directory to a checkout of that repository, by starting there or changing into it, and has not changed it since. Confirming means running before it, in the same shell and directory, a command that prints the repository the working directory belongs to, such as `git rev-parse --show-toplevel`, and reading that it is the repository meant.

Violated when an agent cites or acts on the output of such a command, run from a directory not known to be a checkout of the repository meant, that neither named its repository nor followed such a confirmation.
'''
zh = '''
这样的命令，在没写明仓库时从工作目录选定仓库，例如不带 `-R <owner>/<repo>` 的 `gh`，不带 `-C <path>` 的 `git`。agent 把工作目录设成了这个仓库的检出，即从那里开始或者切换到那里，此后没有再换过，这个目录就是确知的这个仓库的检出。确认，指在它之前、在同一个 shell 和目录里，运行一条打印出工作目录所属仓库的命令，例如 `git rev-parse --show-toplevel`，并读到它就是要操作的仓库。

agent 引用或依据这样一条命令的输出行事，而这条命令是在不确知是目标仓库检出的目录里运行的，既没有写明仓库，之前也没有做过这样的确认的，即为违反本规定。
'''

