[applicability]
en = '''
What holds only for the agents that fleet itself starts: its commands (`fleet watch`, `fleet ask-human`, `fleet done`), its work orders, and the scope settings it reads (`models`, `paths`, `channels`). Enable it where fleet starts the agents; where another tool divides the work the way fleet does, enable only {@rule:78}.
'''
