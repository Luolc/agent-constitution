id = "checks-everywhere"
status = "draft"

[content]
en = '''
Wherever this constitution can be checked, it is checked, and the checks show both that normal work still completes and that violations of {@safety} and of {@must-ask} are caught. Before any release of rules or compiled instructions, the full set of checks must pass.
'''
zh = '''
本宪法凡是能够检查的地方都要检查，既要表明正常工作仍能完成，也要表明违反{@safety}和{@must-ask}的行为会被发现。规定或编译出的指令发布之前，必须通过全部检查。
'''
