[title]
en = "Keep the shared main checkout read-only"
zh = "共用的主检出只读"

[text.statement]
en = "Where work is divided among agents the way Agent Fleet does, treat the main checkout the agents share as read-only and switch no branch in it, and do work that needs a checkout or runs tests in a worktree of your own."
zh = "在像 Agent Fleet 那样在 agent 之间分工的法域里，agent 共用的主检出只读、不切分支；要检出或跑测试的工作，在自己的 worktree 里做。"

[text.reason]
en = '''
Several agents read the main checkout: the agent talking with principals, the agents responsible for jobs and the workers. When one of them switches a branch there, changes a file or runs a command that writes files, the others no longer read the main branch, and when something goes wrong no one can tell who caused it ({@constitution:safety-before-speed}). Worktrees of their own do not affect one another.
'''
zh = '''
主检出是几个 agent 共用的：与委托人对话的 agent、负责各项工作的 agent 和各个 worker 都会读它。有人在里面切分支、改文件或者运行会写文件的命令，别人读到的就不再是主分支，出了问题也说不清是谁造成的 ({@constitution:safety-before-speed})。各自的 worktree 互不影响。
'''

[text.verification]
en = '''
This rule is for the jurisdictions of {@rule:28}. The shared main checkout is the checkout of a repository that the agents of the jurisdiction read in common, as opposed to the worktrees each opens for its own work; with Agent Fleet, it is the one in the scope's `paths.checkouts`. A worktree is opened the way the tool that starts the agents provides, when it provides one (with Agent Fleet, `fleet worktree <repo> --branch <type>/<short-desc>` or `--detach <sha>`, not a bare `git worktree add`). Reading files and running read-only Git commands (`git log`, `git show`, `git fetch`) in the main checkout is not a violation. Where the repository's instructions say who does what in the main checkout (for example, that the agent responsible for a job deploys the merged main branch to a machine from it), it is done as they say.

Violated when an agent switches a branch, changes or creates a file, commits, or runs a command that writes into the working tree (a build, the tests) in the shared main checkout, other than as the repository's instructions provide.
'''
zh = '''
本规定适用于{@rule:28}所说的法域。共用的主检出，指法域里的 agent 共同读的那份仓库检出，区别于各自为自己的工作开的 worktree；用 Agent Fleet 时，就是 scope 的 `paths.checkouts` 下的那份。worktree 按起 agent 的工具提供的方式开，如果它提供的话 (用 Agent Fleet 时是 `fleet worktree <repo> --branch <type>/<short-desc>` 或 `--detach <sha>`，不用裸 `git worktree add`)。在主检出里读文件、运行只读的 Git 命令 (`git log`、`git show`、`git fetch`) 不算违反。仓库的指令写明了由谁在主检出里做什么的 (例如由负责一项工作的 agent 在那里把已合入的主分支部署到机器上)，照它写的做。

在共用的主检出里切换分支、修改或新建文件、提交，或者运行会写进工作区的命令 (构建、测试)，又不是仓库的指令所规定的，即为违反本规定。
'''

