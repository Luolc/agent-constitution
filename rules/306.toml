[title]
en = "On a local device, inject a service account's token only into its unattended tasks"
zh = "本地设备上，service account 的 token 只注入无人值守的任务"

[text.statement]
en = "On a local device, let a service account's token reach only the environment of the unattended tasks there, never a login shell."
zh = "在本地设备上，service account 的 token 只注入那里无人值守的任务的环境，不进登录 shell。"

[text.reason]
en = '''
On a local device reads go through a route the person unlocks ({@rule:304}). A token in a login shell would reach everything run there, and reads that should wait for the person could go through the token instead. Injected into the unattended tasks alone, it can leak only through them.
'''
zh = '''
本地设备上，读取经人解锁的途径进行 ({@rule:304})。token 进了登录 shell，在里面运行的一切都拿得到它，本该等人解锁的读取也就可能改经 token 进行。只注入无人值守的任务，泄露的途径就只剩这些任务。
'''

[text.verification]
en = '''
A local device is a machine that a person sits at and works on directly ({@rule:304}). A login shell is the shell that a person or an agent gets on logging in to a machine, together with its startup files and every process started from it. On a remote machine ({@rule:305}) this rule does not limit which shell the token reaches.

Violated when, on a local device, a service account's token is set in a login shell's startup files or environment, or reaches the environment of a process other than the unattended tasks it is given to.
'''
zh = '''
本地设备，指人坐在跟前直接操作的机器 ({@rule:304})。登录 shell，指人或 agent 登录一台机器后得到的 shell，连同它的启动文件和从它启动的所有进程。在远程机器上 ({@rule:305})，本规定不限制 token 进哪个 shell。

在本地设备上，service account 的 token 写进了登录 shell 的启动文件或环境，或者进了分给它的无人值守任务以外的进程的环境的，即为违反本规定。
'''

