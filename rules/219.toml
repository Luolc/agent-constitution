[title]
en = "Commit only pointers and SHA-256 for large data"
zh = "大数据在仓库里只提交指针与 SHA-256"

[text.statement]
en = "Commit no large data file to a repository; commit only a pointer to it in the data directory ({@rule:131}), with its SHA-256."
zh = "大数据文件不提交进仓库，只提交指向数据目录 ({@rule:131}) 里那份数据的指针及其 SHA-256。"

[text.reason]
en = '''
A large file, once in git history, is hard to remove. With a pointer and SHA-256 in the repository, another machine can check that it holds the same data ({@constitution:simplicity}).
'''
zh = '''
大文件进了 git 历史就很难再清掉；仓库里留指针与 SHA-256，换一台机器也能核对数据是不是同一份 ({@constitution:simplicity})。
'''

[text.verification]
en = '''
Violated when a large data file is committed to the repository, or a pointer to data in the data directory is committed without its SHA-256.
'''
zh = '''
把大数据文件提交进仓库，或者提交了指向数据目录里数据的指针却没附它的 SHA-256 的，即为违反本规定。
'''

