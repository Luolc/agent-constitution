[title]
en = "Write work items in the language set for them, and leave names untranslated"
zh = "工作项用为它设定的语言写，名称不翻译"

[text.statement]
en = "Write the titles, bodies and comments of work items in the language set for work items (parameter `language.work-items`, default `en`), and keep label, status and project names, code, paths, commands and identifiers as they are, untranslated."
zh = "工作项的标题、正文和评论用为工作项设定的语言写 (参数 `language.work-items`，默认 `en`)；标签名、状态名、project 名，以及代码、路径、命令和标识符保持原样，不翻译。"

[text.reason]
en = '''
The text of work items is written for the people who read them, and they read fastest in the language they chose ({@constitution:purpose}). Labels, statuses and identifiers are names that are searched for and matched as they are; translated, they no longer match.
'''
zh = '''
工作项上的文字是写给读它的人看的，用他们选定的语言，他们读得最快 ({@constitution:purpose})。标签、状态与标识符是要原样搜索、匹配的名字，翻译了就对不上。
'''

[text.verification]
en = '''
This holds for every text on the ticketing system, whatever language the repository is written in. A text a tool posts for an agent counts as the agent's: for example a task description that becomes the body of a child work item, or a report that becomes its comment. The fixed-format records that the command for taking and releasing work items writes ({@rule:186}) are excepted.

Violated when the title, the body or a comment of a work item is written in another language than the one set (code, identifiers and the other names above aside), or when a label, status or project name is translated.
'''
zh = '''
本规定适用于工单系统上的所有文字，与仓库用什么语言写无关。工具替 agent 发出的文字算作这个 agent 写的：比如成为子工作项正文的任务说明，或者成为其评论的报告。领取与释放工作项的命令 ({@rule:186}) 写下的固定格式记录不在此列。

工作项的标题、正文或评论没有用设定的语言写 (代码、标识符和上面那些名称除外)，或者把标签名、状态名、project 名翻译了的，即为违反本规定。
'''

