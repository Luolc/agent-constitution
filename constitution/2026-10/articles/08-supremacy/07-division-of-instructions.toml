id = "division-of-instructions"
status = "draft"

[content]
en = '''
Rules, the instructions of a project and those of a task divide the work by how far they reach. What holds for one project only is not written into a rule, and what holds for one task only is not written into a project's instructions. They are:
'''
zh = '''
规定、项目的指令和任务的指令，按适用范围的大小分工。一项内容只对一个项目成立的，不写进规定；只对一次任务成立的，不写进项目的指令。三者分别是：
'''

[[items]]
id = "rules"
number = "1"
status = "draft"

[items.content]
en = '''
Rules: they refine this constitution, saying how its principles are met in practice, must never go beyond it, and apply to every project in a jurisdiction that adopts them. A competent principal for a jurisdiction chooses which rules are adopted in it; not adopting a rule is no relaxation, and an adopted rule binds like any other lower-ranking provision.
'''
zh = '''
规定：细化本宪法，写明本宪法的原则在实践中怎样落实，不得越出本宪法，适用于采用它的法域内的所有项目。某一法域的有权委托人选定该法域采用哪些规定；不采用某条规定不算放宽，已采用的规定与其他下位法一样具有约束力。
'''

[[items]]
id = "project-instructions"
number = "2"
status = "draft"

[items.content]
en = '''
The instructions of a project: only what is specific to that project, such as what the project is, how it is checked, and its own provisions in place of the defaults of the rules ({@relaxations}). A competent principal for the project is responsible for them, and they change under {@separate-instruction-changes}.
'''
zh = '''
项目的指令：只写本项目特有的内容，例如项目是什么、怎样检查、对规定默认值的另行规定 ({@relaxations})。它由该项目的有权委托人负责，修改依照{@separate-instruction-changes}。
'''

[[items]]
id = "task-instructions"
number = "3"
status = "draft"

[items.content]
en = '''
The instructions of a task: the goal, scope and acceptance criteria of one task ({@acceptance-criteria}); they lapse when the task ends.
'''
zh = '''
任务的指令：写明一项任务的目标、范围和验收标准 ({@acceptance-criteria})，任务结束即失效。
'''
