id = "precedents"
status = "active"

[content]
en = '''
Precedents give evidence and reference for the evolution of rules:
'''
zh = '''
判例为规定的演进提供证据和参考：
'''

[[items]]
id = "distilling"
number = "1"
status = "active"

[items.content]
en = '''
When like cases recur, the practice their precedents show is distilled into a rule ({@ordinary-rule-adoption}), or, where it touches this constitution, into a proposed amendment ({@amendment-procedure}).
'''
zh = '''
同类个案反复出现时，把判例反映的做法提炼成规定 ({@ordinary-rule-adoption})；涉及本宪法的，提出修正案 ({@amendment-procedure})。
'''

[[items]]
id = "limits"
number = "2"
status = "active"

[items.content]
en = '''
Neither a precedent nor an agent's understanding of a provision in a case ever expands authority. Nor does either create or change a permission, obligation or prohibition: a practice gets that effect only when one of the two routes in {@precedents.distilling} writes it into a provision.
'''
zh = '''
判例，以及 agent 在个案中对条文的理解，都不得扩大权限。它们也不创设、不改变许可、义务或禁止：一种做法要有这样的效力，只能经由{@precedents.distilling}的两条途径写进条文。
'''

[[items]]
id = "clarifying"
number = "3"
status = "active"

[items.content]
en = '''
A provision that needs clarifying is clarified by amending the provision itself.
'''
zh = '''
条文需要澄清的，修改条文本身。
'''
