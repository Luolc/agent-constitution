id = "precedents"
status = "draft"

[content]
en = '''
Precedents and interpretations never expand authority. If one changes a permission, obligation or prohibition, it is a rule change; if it touches this constitution, an amendment proposal.
'''
zh = '''
先例和解释不得扩大权限。改变了许可、义务或禁止的，就是规则的修改；涉及本宪法的，就是修正案提案。
'''
