# Releases statute when a tag statute-v<version> is pushed
# (docs/design/amendments-and-releases.md): publishes the crate to
# crates.io, and attaches a prebuilt binary for each target to the tag's
# GitHub Release. crates.io trusts this workflow and the environment
# `release` (Trusted Publishing): the job `publish` trades its OIDC token
# for a short-lived crates.io token, so the repo holds no crates.io secret.
# The environment admits only statute-v* tags.
# Before any job that publishes, the job `check` runs check-release-tag:
# the tag against the manifest, that the commit is on main, and that its
# CI run on main succeeded on the first attempt.
# The job `homebrew` then writes Formula/statute.rb in the tap
# Luolc/homebrew-tap, pointing at the tarballs of the Release, so that
# `brew install luolc/tap/statute` installs them.
# The job `pypi-wheels` packs the Release's binaries into PyPI wheels, and
# `publish-pypi` uploads them, trusted by PyPI in the same way.
# The job `mirror` then pins that version in the pre-commit mirror
# Luolc/statute-pre-commit and tags it v<version>.
# Run by hand (workflow_dispatch) with an existing tag, the workflow builds
# the binaries and keeps them as workflow artifacts, renders, audits,
# installs and tests that tag's formula, and builds, checks and installs
# that tag's wheels; it publishes nothing.

name: Release

on:
  push:
    tags: ["statute-v*"]
  workflow_dispatch:
    inputs:
      tag:
        # No default: a default would go stale without anyone noticing.
        description: "Existing statute-v<version> tag to rehearse the release jobs with"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # The check runs in a job of its own, without the environment or
  # id-token: write, so that none of the tools uv installs can ask for the
  # OIDC token crates.io trusts.
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # check-release-tag lists the commit's CI runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and origin/main, for the check that the tagged
          # commit is on main.
          fetch-depth: 0
          persist-credentials: false

      # The uv version is the rev of the uv-lock hook, as in ci.yml.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - run: uv sync --locked --all-packages

      - name: Release check
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen check-release-tag --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"

  publish:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # the OIDC token crates.io trades for its own
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked -p statute
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # The binaries are built without a write token: the build runs the build
  # scripts of every dependency, so only the job `release` below, which
  # compiles nothing, may write to the Release. Linux builds are static
  # musl, which runs on glibc systems too; the dependency tree has no
  # OpenSSL or other C library to link.
  build:
    needs: check
    # On a dispatch `check` is skipped, and `needs` alone would skip this
    # job too.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.check.result == 'success') }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
          - target: x86_64-apple-darwin
            os: macos-15
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: rustup toolchain install --no-self-update

      # The musl linkers; the macOS runner links both apple targets itself.
      - uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        if: runner.os == 'Linux'
        with:
          target: ${{ matrix.target }}

      # Writes statute-<target>.tar.gz and statute-<target>.sha256 in the
      # workspace. dry-run: build and pack only, without a token.
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: statute
          package: statute
          locked: true
          target: ${{ matrix.target }}
          checksum: sha256
          dry-run: true
          dry-run-intended: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: statute-${{ matrix.target }}
          path: |
            statute-${{ matrix.target }}.tar.gz
            statute-${{ matrix.target }}.sha256
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the Release and upload its assets
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: statute-*
          path: assets
          merge-multiple: true

      # Four targets, two files each; every tarball matches its sidecar.
      - name: Check the assets
        working-directory: assets
        run: |
          set -eu
          set -- *
          [ "$#" -eq 8 ]
          for sum in *.sha256; do sha256sum --check --strict "$sum"; done

      # --verify-tag: never create the tag when it is missing. A Release
      # left by an earlier run is reused, and --clobber replaces its assets,
      # so the job can be rerun.
      - name: Attach the binaries to the Release
        run: |
          set -eu
          if ! gh release view "$TAG" >/dev/null; then
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes "statute ${TAG#statute-v}: https://crates.io/crates/statute/${TAG#statute-v}"
          fi
          gh release upload "$TAG" assets/* --clobber

  # The formula is rendered by tools/render_homebrew_formula.sh from the
  # Release's checksums; Homebrew downloads the Release tarballs and compiles
  # nothing. Only the tag push writes the tap, with HOMEBREW_TAP_TOKEN, a
  # repository secret outside the environment `release` so that a dispatch
  # can run the steps before it. Its failure leaves crates.io and the Release
  # as they are. The macOS runner ships Homebrew and tests the
  # aarch64-apple-darwin tarball; the other three are covered by their
  # digests.
  homebrew:
    needs: release
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: macos-15
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the Release checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$TAG" --pattern 'statute-*.sha256' --dir assets

      - name: Render the formula
        run: tools/render_homebrew_formula.sh "$TAG" assets statute.rb

      # Through a local tap, the path a user's install takes, rather than a
      # formula file handed to brew.
      - name: Put the formula in a local tap
        run: |
          set -euo pipefail
          brew tap-new --no-git luolc/local
          cp statute.rb "$(brew --repository luolc/local)/Formula/statute.rb"

      - name: Check the formula's version
        run: tools/check_formula_version.sh "$TAG" luolc/local/statute

      - name: brew audit
        run: brew audit --strict luolc/local/statute

      - name: brew install and brew test
        run: |
          set -euo pipefail
          brew install luolc/local/statute
          brew test luolc/local/statute

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          repository: Luolc/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      # A rerun finds the formula already there and commits nothing.
      - name: Commit the formula to the tap
        if: github.event_name == 'push'
        working-directory: tap
        run: |
          set -euo pipefail
          mkdir -p Formula
          cp ../statute.rb Formula/statute.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/statute.rb
          if git diff --cached --quiet; then
            echo "formula: already at $TAG, nothing to commit"
          else
            git commit -q -m "statute $TAG"
            git push origin HEAD:main
            echo "formula: pushed statute $TAG"
          fi

  # The wheels hold the Release's binaries as they are; nothing is compiled
  # here. On a dispatch they are built from the Release of the tag given,
  # not from this run's `build`, and kept as an artifact.
  pypi-wheels:
    needs: release
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # For `uvx wheel` and `uvx twine`.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"

      # tools/build_pypi_wheels.sh reads the metadata with `cargo metadata`.
      - name: Install the Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Download the Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$TAG" --pattern 'statute-*' --dir assets

      - name: Build the wheels
        run: tools/build_pypi_wheels.sh "$TAG" assets dist

      # sha256 of the binary in each wheel against that of the Release
      # tarball that passed its sidecar, both printed.
      - name: Check that the wheels carry the Release binaries
        run: tools/check_pypi_wheels.sh "$TAG" assets dist

      - name: twine check
        run: uvx --from 'twine==6.1.0' twine check --strict dist/*.whl

      # The runner is x86_64 Linux, so that wheel can be installed and run.
      - name: Install and run the x86_64 Linux wheel
        run: |
          set -euo pipefail
          wheel=(dist/statute-*-manylinux*_x86_64*.whl)
          [ "${#wheel[@]}" -eq 1 ]
          printed=$(uvx --no-cache --from "${wheel[0]}" statute --version)
          printf '%s\n' "$printed"
          [ "$printed" = "statute ${TAG#statute-v}" ]

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-wheels
          path: dist
          if-no-files-found: error

  # PyPI trusts this workflow in the environment `release`. Only this job
  # holds id-token: write, and it runs no tool uv installs. It comes after
  # crates.io, so a version on PyPI is one crates.io took. A rerun after a
  # partial upload (`gh run rerun --failed`) skips the wheels PyPI already
  # holds with the same bytes, and stops on a name PyPI holds with others.
  publish-pypi:
    if: github.event_name == 'push'
    needs: [publish, pypi-wheels]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # the OIDC token PyPI trades for an upload token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-wheels
          path: dist

      - name: Drop the wheels PyPI already holds
        id: remaining
        run: |
          set -euo pipefail
          tools/pypi_upload_set.sh statute "${GITHUB_REF_NAME#statute-v}" dist
          # nullglob: with every wheel dropped the count is 0, not 1.
          shopt -s nullglob
          remaining=(dist/*.whl)
          echo "count=${#remaining[@]}" >>"$GITHUB_OUTPUT"

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: steps.remaining.outputs.count != '0'
        with:
          packages-dir: dist

  # The pre-commit mirror Luolc/statute-pre-commit, whose hook installs the
  # PyPI wheel, so that pre-commit runs statute without compiling it. Only
  # the `statute==` pin in its pyproject.toml and its v<version> tags are
  # written from here; its other files are hand-written. It comes after
  # PyPI: a tag there whose pin PyPI does not serve fails at `pip install`
  # in a consumer's repository, not in this run. No job needs it, so its
  # failure leaves crates.io, the Release, the tap and PyPI as they are.
  mirror:
    if: github.event_name == 'push'
    needs: publish-pypi
    runs-on: ubuntu-24.04
    # The mirror is written with PRECOMMIT_MIRROR_TOKEN; nothing here needs
    # this repository's token.
    permissions: {}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Luolc/statute-pre-commit
          token: ${{ secrets.PRECOMMIT_MIRROR_TOKEN }}

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"

      # `needs` proves that the upload returned success, not that the index
      # serves the version; this installs it from PyPI and runs it.
      - name: Check that PyPI serves this version and the wheel runs
        run: |
          set -euo pipefail
          printed=$(uvx --from "statute==${TAG#statute-v}" statute --version)
          printf '%s\n' "$printed"
          [ "$printed" = "statute ${TAG#statute-v}" ]

      - name: Pin this version, commit and tag
        run: |
          set -euo pipefail
          version="${TAG#statute-v}"
          mirror_tag="v$version"
          pin="dependencies = [\"statute==$version\"]"

          # The tag is looked up before anything is written, so that a rerun
          # for an older release cannot move main back to its pin. A tag on
          # HEAD with this pin is an earlier run of this job, so a rerun
          # passes; one elsewhere is not moved. An annotated tag's own line
          # carries the tag object, and a pattern given to ls-remote drops
          # the peeled ^{} line, so list every tag and prefer the peeled one.
          refs=$(git ls-remote --tags origin)
          peeled=$(printf '%s\n' "$refs" | awk -v t="refs/tags/$mirror_tag^{}" '$2 == t { print $1 }')
          direct=$(printf '%s\n' "$refs" | awk -v t="refs/tags/$mirror_tag" '$2 == t { print $1 }')
          existing=${peeled:-$direct}
          if [ -n "$existing" ]; then
            echo "tag: $mirror_tag already exists at commit $existing"
            [ "$existing" = "$(git rev-parse HEAD)" ]
            grep -Fxq "$pin" pyproject.toml
            exit 0
          fi

          # sed exits 0 when nothing matched, so the grep is the check.
          sed -i -E "s/^dependencies = \[\"statute==[^\"]*\"\]$/$pin/" pyproject.toml
          grep -Fxq "$pin" pyproject.toml
          echo "pin: $(grep -F 'statute==' pyproject.toml)"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- pyproject.toml; then
            echo "pin: already at $version, nothing to commit"
          else
            git commit -q -m "Pin statute==$version" -- pyproject.toml
            git push origin HEAD:main
          fi

          head=$(git rev-parse HEAD)
          git tag "$mirror_tag" "$head"
          git push origin "refs/tags/$mirror_tag"
          echo "tag: pushed $mirror_tag at $head"
