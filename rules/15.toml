agent 怎么证明自己的主张：验收记录，读数与主张对得上，检查能分开它该分开的情况，清理之后数残留，没证实修好的失败不关闭；CI 跑的检查见 {@rule:276}。凡有 agent 工作的地方都要启用。
'''

