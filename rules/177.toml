[title]
en = "A parent work item is the goal, a child work item one attempt"
zh = "父工作项是目标，子工作项是一次尝试"

[text.statement]
en = "Write what is to be done in a parent work item, and record each attempt at it in a child work item."
zh = "要做的事写在父工作项里，每一次尝试记在一个子工作项里。"

[text.reason]
en = '''
A goal may take several attempts. With the goal and the attempts apart, a failed attempt still leaves its record, and the parent shows at a glance how many attempts there were and how each ended ({@constitution:decide-yourself.changing-approach}).
'''
zh = '''
一件事可能要试几次才成。目标和尝试分开，失败的尝试也留得下记录，父工作项一眼就看得出试过几次、各是什么结局 ({@constitution:decide-yourself.changing-approach})。
'''

[text.verification]
en = '''
How an attempt ends is in {@rule:224}.

Violated when an attempt is recorded directly on the parent work item.
'''
zh = '''
尝试怎样结束，见{@rule:224}。

把一次尝试直接记在父工作项上的，即为违反本规定。
'''

