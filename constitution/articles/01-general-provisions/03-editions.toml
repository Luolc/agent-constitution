id = "editions"
status = "draft"
audience = "maintainers"

[content]
en = '''
An **edition** is one approved text of this constitution as a whole. It is named by the year and month in which the principal with authority over this constitution approved it (for example, the 2026-10 Edition), and the title carries that name; no two editions open in the same month. While the text is a draft, the title says so instead. Within an edition, the **revision number** counts from one and rises by one with each approved amendment ({@revision-count}), and numbers never change ({@stable-numbers}). A new edition may rearrange and renumber the whole text; opening one is itself an amendment ({@new-editions}). A provision carried into a new edition keeps its ID, so a record that cites by ID stays valid; a citation by number names the edition. Naming an edition by its year and month follows the practice of calling a constitution by the year of its adoption, as China does with its constitutions of 1954 and 1982 and France with that of 1958. The distinction between an edition and the amendments within it resembles that between total and partial revision of the Federal Constitution of Switzerland.
'''
zh = '''
**版** (edition) 指本宪法经批准的一份完整文本。每一版以对本宪法握有授权的委托人批准它生效的年月命名 (例如「2026-10 版」)，标题写明这个名字；同一个月不开两版。还是草案时，标题写「草案」。同一版内，**修订号** (revision) 从一起算，每通过一次修正案加一 ({@revision-count})，编号永不更改 ({@stable-numbers})。新的一版可以对全文大范围重排、重新编号；开新的一版，本身就是一次修宪 ({@new-editions})。延续到新一版的条文保留原来的 ID，旧记录按 ID 的引用仍然有效；按编号引用时要写明是哪一版。每一版以年月命名，沿用按通过年份称呼宪法的做法，如中国的 1954 年宪法、1982 年宪法和法国的 1958 年宪法。版与版内修正案之分，类似瑞士联邦宪法的全面修订与部分修订。
'''
