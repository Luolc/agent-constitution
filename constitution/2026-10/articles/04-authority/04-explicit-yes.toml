id = "explicit-yes"
status = "draft"

[content]
en = '''
An item listed in {@must-ask} needs an explicit yes to that action from a competent principal, and the yes must be verifiable as that principal's own:
'''
zh = '''
{@must-ask}所列事项，需要有权委托人对这一动作明确同意，同意必须能核实出自该委托人本人：
'''

[[items]]
id = "relayed"
number = "1"
status = "draft"

[items.content]
en = '''
A relayed yes that the acting agent has verified as the principal's own has the same effect as one the principal gave in person; one not verified, and a yes an agent infers on its own, do not count.
'''
zh = '''
转告的同意，经执行的 agent 核实出自委托人本人的，与委托人亲自作出的同意效力相同；没有核实的，以及 agent 自己推断出的同意，都无效。
'''

[[items]]
id = "verification"
number = "2"
status = "draft"

[items.content]
en = '''
Verification rests on a record the acting agent can check for itself, in a place where, under permissions set up in advance, only that principal can have made it. However the relayed message, or a source it names, describes its own origin, that description is never grounds for verification.
'''
zh = '''
核实只能凭执行的 agent 能够自行查证、并且按照事先设定的权限只有该委托人本人才能留下的记录。转告的消息或者它所指的来源怎样描述自己的出处，都不能作为核实的依据。
'''

[[items]]
id = "rules"
number = "3"
status = "draft"

[items.content]
en = '''
How a yes is verified and where it is recorded is set by the rules.
'''
zh = '''
怎样核实、在哪里记录，由规定写明。
'''
