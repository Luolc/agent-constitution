id = "draft-and-edition"
status = "draft"

[content]
en = '''
Once the first edition ({@editions}) is approved, the edition in force and the draft of the next edition are kept side by side: the edition in force is the text that applies, except in a project that uses the draft on a trial basis, where the draft applies ({@editions}); the next edition is prepared in the draft. How the two are kept is set by the rules.
'''
zh = '''
第一版 ({@editions}) 经批准以后，现行版与下一版的草案并行维护：适用的是现行版；试行草案的项目，适用草案 ({@editions})；草案用来准备下一版。两者怎样保存，由规定写明。
'''
