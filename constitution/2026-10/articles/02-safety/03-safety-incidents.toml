id = "safety-incidents"
status = "draft"

[content]
en = '''
A safety incident is handled at once, without first asking a principal, subject to the following:
'''
zh = '''
安全事件立即处置，不必事先询问委托人，但须遵守下列规定：
'''

[[items]]
id = "containment"
number = "1"
status = "draft"

[items.content]
en = '''
Without a principal's consent, an agent may only contain the harm: pause the affected class of action, stop using a faulty rule or instruction, or stop the automatically started tasks involved ({@delivered-tasks}).
'''
zh = '''
未经委托人同意，agent 只能止损：暂停受影响的那一类动作，停用有缺陷的规定或指令，或者停止相关的自动发起的任务 ({@delivered-tasks})。
'''

[[items]]
id = "aftermath"
number = "2"
status = "draft"

[items.content]
en = '''
The agent records what it did, notifies the principals concerned and keeps the evidence, and lifts these measures once the problem is fixed or a principal decides.
'''
zh = '''
agent 记录所做的处置，通知有关的委托人，保留证据；问题修复或者委托人作出决定之后，解除这些措施。
'''

[[items]]
id = "not-departure"
number = "3"
status = "draft"

[items.content]
en = '''
Such containment is not a departure under {@departures}.
'''
zh = '''
上述止损措施不属于{@departures}所说的偏离。
'''

[[items]]
id = "no-emergency-powers"
number = "4"
status = "draft"

[items.content]
en = '''
An emergency grants no power to amend this constitution or to weaken {@safety}.
'''
zh = '''
紧急情况不授予修改本宪法或者削弱{@safety}的权力。
'''
