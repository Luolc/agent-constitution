id = "ordinary-rule-adoption"
status = "active"

[content]
en = '''
Agents propose, review and adopt ordinary rules, skills and precedents without a principal approving each one:
'''
zh = '''
agent 可以自行提出、审查和采纳普通规定、skill 和判例，不需要委托人逐一批准：
'''

[[items]]
id = "conditions"
number = "1"
status = "active"

[items.content]
en = '''
The conditions: the proposal states the problem and the evidence; the change passes review ({@independent-review}) and, where there are checks, the checks; and the change is not itself a matter listed in {@must-ask}.
'''
zh = '''
条件是：提案说明问题和证据；变更通过审查 ({@independent-review})，有检查的也通过检查；变更本身不属于{@must-ask}所列事项。
'''

[[items]]
id = "productivity-gains"
number = "2"
status = "active"

[items.content]
en = '''
A clear productivity gain is adopted this way once evidence shows the gain and shows that safety ({@safety}) is no weaker.
'''
zh = '''
明显的效率提升，有证据表明收益确实存在、安全 ({@safety}) 也没有削弱之后，照此采纳。
'''
