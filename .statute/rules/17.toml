status = "trial"
lang = "en"
parent = "R15"
default = "on"
requires = ["R212"]
authority = ["evidence.grounds"]
constitution = ">=1"
level = "project"
check = "none"
uses = ["instructions", "review"]

[title]
en = "Pin runners to Ubuntu 24.04 and actions by commit SHA"

[text.statement]
en = "In `.github/workflows/`, run every job on `ubuntu-24.04`, and pin every action to a commit SHA."

[text.reason]
en = '''
A moving runner label or action tag changes what CI runs without a change in this repository.
'''

[text.verification]
en = '''
Violated when a workflow names another runner label, or an action by a tag or a branch.
'''
