[title]
en = "A research worker only reads"
zh = "调研 worker 只读"

[text.statement]
en = "Where work is divided among agents the way fleet does, as a research worker, change no repository."
zh = "在像 fleet 那样在 agent 之间分工的法域里，作为调研 worker，不改任何仓库。"

[text.reason]
en = '''
A research worker's product is a conclusion, not a change, and what is delegated to it is only reading ({@constitution:delegated-authority}); a change it made would be outside its task and would have no reviewer.
'''
zh = '''
调研 worker 的产出是结论，不是变更，委派给它的只有读 ({@constitution:delegated-authority})；它要是改了什么，就超出了任务，也没有人审查。
'''

[text.verification]
en = '''
This rule is for the jurisdictions of {@rule:28}. A research worker is a worker whose task is to find something out and report it. It writes its result as `research-<topic>-<date>.md` in the directory for its files outside any worktree (with fleet, `$FLEET_SCRATCH`), and commits and pushes nothing.

Violated when a research worker changes any repository.
'''
zh = '''
本规定适用于{@rule:28}所说的法域。调研 worker 指任务是查清某件事并报告结论的 worker。它把结果写成 `research-<topic>-<date>.md`，放在它存放 worktree 之外文件的目录里 (用 fleet 时是 `$FLEET_SCRATCH`)，不 commit、不 push。

调研 worker 改了任何仓库的，即为违反本规定。
'''

