[title]
en = "A release goes through a principal"
zh = "发布须经委托人"

[text.statement]
en = "Treat a release, any act that makes a version or artifact available, as an item of {@constitution:must-ask}, which goes through a principal."
zh = "发布，即使某个版本或制品对外可用的任何动作，按{@constitution:must-ask}所列事项处理，须经委托人。"

[text.reason]
en = '''
The rule library may add items to those listed in {@constitution:must-ask} ({@constitution:list-defaults}).
'''
zh = '''
规定库可以在{@constitution:must-ask}所列事项之外增加事项 ({@constitution:list-defaults})。
'''

[text.verification]
en = '''
A release is, for example, pushing a release tag or publishing a package. Raising a version number, a dry run, or opening or merging a change that raises the version makes nothing available and is not a release.

When unsure whether an act makes a version or artifact available, treat it as a release.

Violated when an agent releases without the yes that {@constitution:must-ask} requires.
'''
zh = '''
发布的例子有推送发布 tag、发布软件包。提升版本号、试运行，以及提交或合并提升版本号的变更，都没有让任何东西对外可用，不算发布。

不确定某个动作是否使版本或制品对外可用的，按发布处理。

agent 未取得{@constitution:must-ask}所要求的同意就发布的，即为违反本规定。
'''

