id = 132
slug = "third-party-sources-root"
revision = 2
kind = "rule"
status = "trial"
lang = "en"
parent = 127
default = "on"
authority = ["simplicity"]
constitution = ">=1"
level = "user"
check = "none"

[title]
en = "Clone third-party sources to `<owner>/<repo>` under a root of their own"
zh = "第三方源码 clone 到自己的根目录下的 `<owner>/<repo>`"

[text.statement]
en = "Clone third-party sources to `<root>/<owner>/<repo>/`, under the root the jurisdiction designates for them."
zh = "第三方源码的 clone 放在法域为它指定的根目录下的 `<root>/<owner>/<repo>/`。"

[text.reason]
en = '''
Others' sources cloned into the root of main checkouts ({@rule:216}) mix with your own repositories; with `<owner>` in the path, two repositories of the same name do not collide ({@constitution:simplicity}).
'''
zh = '''
别人的源码放进主检出的根目录 ({@rule:216})，就和自己的仓库混在一起；路径带上 `<owner>`，同名的仓库也不会冲突 ({@constitution:simplicity})。
'''

[text.verification]
en = '''
The root holds two levels of directories, `<owner>/<repo>`; the jurisdiction designates it, for example in a rule of a lower layer.

Violated when a clone of third-party sources is kept elsewhere than in `<root>/<owner>/<repo>/`.
'''
zh = '''
根目录下是两级目录 `<owner>/<repo>`；根目录由法域指定，例如写在下层的规定里。

第三方源码的 clone 放在 `<root>/<owner>/<repo>/` 以外的，即为违反本规定。
'''

