管 agent 的指令文件与 skill 放在哪里、怎样安装，以及 (在子 domain 里) 只对某一个 agent 工具成立的做法。agent 读写指令文件或 skill、或者要安装 skill 的仓库启用；agent 只使用工具、不碰它们的指令、skill 和配置的仓库不必启用。
'''

