# Releases statute when a tag statute-v<version> is pushed
# (docs/design/amendments-and-releases.md): publishes the crate to
# crates.io, and attaches a prebuilt binary for each target to the tag's
# GitHub Release. crates.io trusts this workflow and the environment
# `release` (Trusted Publishing): the job `publish` trades its OIDC token
# for a short-lived crates.io token, so the repo holds no crates.io secret.
# The environment admits only statute-v* tags.
# Before any job that publishes, the job `check` runs check-release-tag:
# the tag against the manifest, that the commit is on main, and that its
# CI run on main succeeded on the first attempt.
# The job `homebrew` then writes Formula/statute.rb in the tap
# Luolc/homebrew-tap, pointing at the tarballs of the Release, so that
# `brew install luolc/tap/statute` installs them.
# Run by hand (workflow_dispatch) with an existing tag, the workflow builds
# the binaries and keeps them as workflow artifacts, and renders, audits,
# installs and tests that tag's formula; it publishes nothing.

name: Release

on:
  push:
    tags: ["statute-v*"]
  workflow_dispatch:
    inputs:
      tag:
        # No default: a default would go stale without anyone noticing.
        description: "Existing statute-v<version> tag whose Homebrew formula to render and test"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # The check runs in a job of its own, without the environment or
  # id-token: write, so that none of the tools uv installs can ask for the
  # OIDC token crates.io trusts.
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # check-release-tag lists the commit's CI runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and origin/main, for the check that the tagged
          # commit is on main.
          fetch-depth: 0
          persist-credentials: false

      # The uv version is the rev of the uv-lock hook, as in ci.yml.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - run: uv sync --locked --all-packages

      - name: Release check
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen check-release-tag --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"

  publish:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # the OIDC token crates.io trades for its own
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked -p statute
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # The binaries are built without a write token: the build runs the build
  # scripts of every dependency, so only the job `release` below, which
  # compiles nothing, may write to the Release. Linux builds are static
  # musl, which runs on glibc systems too; the dependency tree has no
  # OpenSSL or other C library to link.
  build:
    needs: check
    # On a dispatch `check` is skipped, and `needs` alone would skip this
    # job too.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.check.result == 'success') }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
          - target: x86_64-apple-darwin
            os: macos-15
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: rustup toolchain install --no-self-update

      # The musl linkers; the macOS runner links both apple targets itself.
      - uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        if: runner.os == 'Linux'
        with:
          target: ${{ matrix.target }}

      # Writes statute-<target>.tar.gz and statute-<target>.sha256 in the
      # workspace. dry-run: build and pack only, without a token.
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: statute
          package: statute
          locked: true
          target: ${{ matrix.target }}
          checksum: sha256
          dry-run: true
          dry-run-intended: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: statute-${{ matrix.target }}
          path: |
            statute-${{ matrix.target }}.tar.gz
            statute-${{ matrix.target }}.sha256
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the Release and upload its assets
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: statute-*
          path: assets
          merge-multiple: true

      # Four targets, two files each; every tarball matches its sidecar.
      - name: Check the assets
        working-directory: assets
        run: |
          set -eu
          set -- *
          [ "$#" -eq 8 ]
          for sum in *.sha256; do sha256sum --check --strict "$sum"; done

      # --verify-tag: never create the tag when it is missing. A Release
      # left by an earlier run is reused, and --clobber replaces its assets,
      # so the job can be rerun.
      - name: Attach the binaries to the Release
        run: |
          set -eu
          if ! gh release view "$TAG" >/dev/null; then
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes "statute ${TAG#statute-v}: https://crates.io/crates/statute/${TAG#statute-v}"
          fi
          gh release upload "$TAG" assets/* --clobber

  # The formula is rendered by tools/render_homebrew_formula.sh from the
  # Release's checksums; Homebrew downloads the Release tarballs and compiles
  # nothing. Only the tag push writes the tap, with HOMEBREW_TAP_TOKEN, a
  # repository secret outside the environment `release` so that a dispatch
  # can run the steps before it. Its failure leaves crates.io and the Release
  # as they are. The macOS runner ships Homebrew and tests the
  # aarch64-apple-darwin tarball; the other three are covered by their
  # digests.
  homebrew:
    needs: release
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: macos-15
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the Release checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$TAG" --pattern 'statute-*.sha256' --dir assets

      - name: Render the formula
        run: tools/render_homebrew_formula.sh "$TAG" assets statute.rb

      # Through a local tap, the path a user's install takes, rather than a
      # formula file handed to brew.
      - name: Put the formula in a local tap
        run: |
          set -euo pipefail
          brew tap-new --no-git luolc/local
          cp statute.rb "$(brew --repository luolc/local)/Formula/statute.rb"

      - name: Check the formula's version
        run: tools/check_formula_version.sh "$TAG" luolc/local/statute

      - name: brew audit
        run: brew audit --strict luolc/local/statute

      - name: brew install and brew test
        run: |
          set -euo pipefail
          brew install luolc/local/statute
          brew test luolc/local/statute

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          repository: Luolc/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      # A rerun finds the formula already there and commits nothing.
      - name: Commit the formula to the tap
        if: github.event_name == 'push'
        working-directory: tap
        run: |
          set -euo pipefail
          mkdir -p Formula
          cp ../statute.rb Formula/statute.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/statute.rb
          if git diff --cached --quiet; then
            echo "formula: already at $TAG, nothing to commit"
          else
            git commit -q -m "statute $TAG"
            git push origin HEAD:main
            echo "formula: pushed statute $TAG"
          fi
