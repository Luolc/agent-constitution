# Commit hooks, each taking a second or so: secret scan, lock check,
# Python lint, format and docstring checks, Rust format check, rule
# validation, constitution build check, the design translation check, and
# limae on the Chinese text in the sources and on every Markdown file of
# the repo. The type check and the tests take longer and run in CI.
repos:
  # Scans only the staged diff (the upstream entry ends in --staged); CI
  # scans the commits of each PR or push, and gitleaks.yml the full history
  # weekly. The rev is also GITLEAKS_VERSION in ci.yml and gitleaks.yml;
  # change all three together.
  # --redact is repeated here: inherited arguments are not visible in this
  # file and could be dropped when the rev is bumped.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--redact", "--no-banner", "."]

  # Keeps uv.lock in step with pyproject.toml: fails when `uv lock` would
  # change the lock. The rev is the uv version, the same as in CI.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.0
    hooks:
      - id: uv-lock

  # The local hooks run in the environment of pyproject.toml, which pins
  # limae and the Python checkers. `uv run --frozen --no-sync` uses .venv as
  # it is: it never syncs it from uv.lock nor changes the lock. A tool
  # missing from .venv fails the hook; a stale .venv runs the versions it
  # has. Run `uv sync` after cloning and whenever uv.lock changes.
  - repo: local
    hooks:
      # The Python checkers, configured in pyproject.toml, on the whole of
      # tools/ (both workspace members) rather than the staged files.
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen --no-sync ruff check .
        language: system
        files: ^(tools/.*\.(py|toml)|pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --no-sync ruff format --check .
        language: system
        files: ^(tools/.*\.(py|toml)|pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: pydoclint
        name: pydoclint
        entry: uv run --frozen --no-sync pydoclint --config pyproject.toml --quiet tools
        language: system
        files: ^(tools/.*\.(py|toml)|pyproject\.toml|uv\.lock)$
        pass_filenames: false
      # Formatting of the Rust workspace under crates/, with the toolchain
      # of rust-toolchain.toml. Lint and tests take longer and run in CI.
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check
        language: system
        files: ^(crates/.*\.rs|(.*/)?Cargo\.toml|rust-toolchain\.toml)$
        pass_filenames: false
      # The rule files, validated by statute as a source of rules, and what
      # the constitution beside them decides of them (their status and what
      # they cite of it), so a change to the constitution runs it too. The
      # first build of statute in a checkout takes a while; after it, a run
      # takes a second or two.
      - id: statute-validate
        name: statute validate rules
        entry: cargo run --locked --quiet -p statute -- validate rules
        language: system
        files: ^(rules/|constitution/|crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$)
        pass_filenames: false
      # The constitution build: --check validates the constitution sources
      # and requires the committed outputs to match a fresh build. The
      # numbering check against a base commit (--base) runs only in CI.
      - id: constitution
        name: constitution build check
        entry: cargo run --locked --quiet -p statute -- constitution build --check
        language: system
        files: ^(constitution/|crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$)
        pass_filenames: false
      # The `zh` text of each source, citations replaced by Chinese text
      # shaped like their rendering. Checks only; fix locally with
      # `uv run lint-zh-sources --fix`.
      - id: zh-sources
        name: limae on the zh text of the sources
        entry: uv run --frozen --no-sync lint-zh-sources
        language: system
        files: ^(constitution/[^/]+/(index\.toml|articles/)|rules/|tools/checks/src/repo_checks/lint_zh_sources\.py$|pyproject\.toml$|uv\.lock$)
        pass_filenames: false
      # The Chinese translation of the design against the English: the same
      # files, each up to date with its English file by SHA-256, and the
      # same headings with the same anchors, and every relative link of
      # the design leading to a file of the repo. Without docs/design/zh/
      # only the English links are checked.
      - id: design-translation
        name: design translation in step with the English
        entry: uv run --frozen --no-sync check-design-translation
        language: system
        files: ^(docs/design/|tools/checks/src/repo_checks/check_design_translation\.py$)
        pass_filenames: false
      # Every Markdown file of the repo (the built Chinese constitution, the
      # design and its translation, the READMEs), with limae's default
      # configuration. It reports little on English text, which is
      # no reason to leave the English files out. The theme under web/ is a
      # third party's submodule.
      # Rule switches go in a limae.toml, never in args: --disable and
      # --enable make limae skip its configuration file.
      # A false positive is passed over on its line with a
      # `<!-- limae-disable-next-line <rule> -->` comment, not here.
      - id: limae
        name: limae on the Markdown files
        entry: uv run --frozen --no-sync limae
        language: system
        files: \.md$
        exclude: ^web/themes/
