id = "draft-and-edition"
status = "active"

[content]
en = '''
The edition in force and the draft:
'''
zh = '''
现行版与草案：
'''

[[items]]
id = "side-by-side"
number = "1"
status = "active"

[items.content]
en = '''
Once the first edition ({@editions.edition}) is approved, the edition in force is the text that applies, except in a project that uses a draft on a trial basis, where the draft applies ({@editions.draft}). A draft of the next edition is opened only when the next edition is to be prepared; until then there is only the edition in force, and an amendment to it takes effect once approved under {@approving-amendments.edition-amendments}, incrementing its revision number ({@revision-count.increment}).
'''
zh = '''
第一版 ({@editions.edition}) 经批准以后，适用的是现行版；试行草案的项目，适用草案 ({@editions.draft})。需要准备下一版时，才开始起草下一版的草案；在此之前只有现行版，对现行版的修改依照{@approving-amendments.edition-amendments}经批准后生效，修订号加一 ({@revision-count.increment})。
'''

[[items]]
id = "keeping"
number = "2"
status = "active"

[items.content]
en = '''
The edition in force and a draft are kept as {@text-and-sources.sources} provides.
'''
zh = '''
现行版与草案怎样保存，依照{@text-and-sources.sources}的规定。
'''

[[items]]
id = "trial-safeguards"
number = "3"
status = "active"

[items.content]
en = '''
In a project that uses the draft on a trial basis, an amendment to the draft that relaxes {@must-ask} or {@explicit-yes}, weakens {@safety}, or narrows this item applies there only once a competent principal for the project explicitly approves it ({@explicit-yes}).
'''
zh = '''
试行草案的项目中，放宽{@must-ask}或者{@explicit-yes}、削弱{@safety}，或者缩小本项适用范围的草案修正案，须经该项目的有权委托人明确同意 ({@explicit-yes})，才在该项目中适用。
'''
