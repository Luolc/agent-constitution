[title]
en = "Rest a rule only on mechanisms that already run"
zh = "规定只依赖已经在跑的机制"

[text.statement]
en = "Make what a rule requires, and the condition under which it applies, rest only on checks, counts, records and other mechanisms that already run, never on one that is still to be built."
zh = "规定要求的事，以及它适用的条件，只能依赖已经在跑的检查、计数、记录等机制，不能依赖还没建起来的机制。"

[text.reason]
en = '''
A requirement that rests on a mechanism nothing runs can be neither met nor decided: no agent can tell whether its work complies, and no reviewer can tell either ({@constitution:decidable-provisions}). A rule that let a trial rule become active after a number of uses that nothing counted was such a rule: its threshold could never be checked. Where the mechanism is worth having, build it first and write the rule that rests on it after; otherwise leave the condition out.
'''
zh = '''
依赖一个没人在跑的机制的要求，既没法满足，也没法判定：agent 判断不了自己的工作是否合规，审查方也判断不了 ({@constitution:decidable-provisions})。曾有一条规定让试用规定在用过若干次之后改为生效，而这个次数没有任何东西在记，就是这样的规定：它的门槛永远核对不了。机制值得有，就先把它建起来，再写依赖它的规定；不值得，就不写这个条件。
'''

[text.verification]
en = '''
A rule rests on a mechanism when what it requires, or the condition under which it applies, needs that mechanism to be met or decided: a check or a script it says to run, a count, a record or a format it measures by or has agents fill in, a switch or a setting it relies on. For example, a rule that lets a trial rule become active after a number of uses rests on a record of uses; where nothing marks a use as one, that record does not run.

An act the rule asks agents to do themselves rests on no mechanism when what the act works on is there to be read when it is done, as the processes left after a cleanup are; when it works on a history or a record that nothing keeps, or on a format that nothing reads, it rests on that. Building a mechanism is not resting on it when building it is the whole requirement, as in a rule that has commit hooks scan for credentials; a rule that has agents fill in a format that nothing reads, or feed a gate that nothing runs, rests on that format or gate. A condition that asks only whether a mechanism exists, as in "where the repository has a screenshot script", rests on none.

A mechanism runs when, as the change takes effect, an agent can run it or read what it keeps: a command that is installed, a CI job that runs, a record that something writes. Where it must run depends on which source the rule belongs to. For a rule of a repository's own source, it must run in that repository. For a rule of a public source, it must be one that source ships itself, such as a check built into its tool, or, for a rule under a tool's domain ({@rule:102}), one of that tool. A value the rule leaves to the layers below as a parameter ({@rule:101}) is the jurisdiction's to provide and is not a mechanism of the rule.

Violated when a change adds or rewrites a rule so that what it requires, or the condition under which it applies, rests on a mechanism that does not run, where this verification says it must, as the change takes effect.
'''
zh = '''
规定要求的事或它适用的条件，要靠某个机制才能满足或判定，这条规定就依赖这个机制：它让人跑的检查或脚本，它拿来衡量或让 agent 填写的计数、记录或格式，它所依赖的开关或设置。例如，让试用规定在用过若干次之后改为生效的规定，依赖一份使用记录；没有任何东西把一次使用记成使用，这份记录就没有在跑。

规定要求 agent 自己做的动作，在做的时候，它所处理的东西就摆在那里可以读 (例如清理之后剩下的进程)，就不依赖机制；它处理的是没有东西在记的历史或记录，或者没有东西去读的格式，就依赖它们。规定要求的就是把某个机制建起来 (例如要求用 commit 钩子扫描凭证的规定)，不算依赖这个机制；规定让 agent 去填一个没有东西去读的格式，或者去喂一个没有东西在跑的 gate，就依赖这个格式或 gate。只问某个机制有没有的条件 (例如「仓库有截图脚本的」)，不依赖机制。

在变更生效时，agent 能运行这个机制或读到它记下的东西，这个机制就算在跑：已经装好的命令，在跑的 CI job，有东西在写的记录。它要在哪里跑，看规定属于哪个来源：仓库自己的来源里的规定，机制要在这个仓库里跑；公开来源里的规定，机制要是这个来源自己带的 (例如它的工具内置的检查)，挂在某个工具的领域下的 ({@rule:102})，也可以是那个工具带的。规定作为参数留给下层的值 ({@rule:101})，由辖区提供，不算这条规定的机制。

变更新增或改写的规定，要求的事或适用的条件依赖了一个机制，而在变更生效时，这个机制在本节说的地方没有在跑的，即为违反本规定。
'''

