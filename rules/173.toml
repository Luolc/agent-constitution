[title]
en = "Keep a joint project's charter in its initiative's repository"
zh = "联合项目的章程放在 initiative 的仓库里"

[text.statement]
en = "Write the charter of a cross-repository joint project in the `AGENTS.md` of its initiative's repository."
zh = "跨仓联合项目的章程写在它的 initiative 仓库的 `AGENTS.md` 里。"

[text.reason]
en = '''
The charter is the joint project's project instructions ({@constitution:division-of-instructions.project-instructions}); kept in a fixed place, the agents taking part know where to read it. Its members and rules of collaboration are written only in the charter and repeated nowhere else.
'''
zh = '''
章程就是这个联合项目的项目指令 ({@constitution:division-of-instructions.project-instructions})；放在固定的位置，参与的 agent 才知道去哪里读。它的成员与协作规则只写在章程里，不在别处重复。
'''

[text.verification]
en = '''
The initiative's repository is the one whose checkout is in the scope's initiatives directory under the initiative's name ({@rule:314}); the initiative's thread agents work there, and direct messages use the scope's general initiative. How the repository is named is set by the layers below.

Violated when the charter of a joint project is written elsewhere.
'''
zh = '''
initiative 的仓库，指在 scope 的 initiatives 目录下以 initiative 名字检出的那个仓库 ({@rule:314})；该 initiative 的 thread agent 在那里工作，私信用 scope 的通用 initiative。仓库怎么命名，由下层规定定。

联合项目的章程写在了别处的，即为违反本规定。
'''

