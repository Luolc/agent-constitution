[title]
en = "Read back a FedNet card relayed as a yes yourself with `fednet client read-answer`"
zh = "用 `fednet client read-answer` 自己读回作为同意转告的 FedNet 卡片"

[text.statement]
en = "Before you act on a yes relayed from a FedNet question card, run `fednet client read-answer -socket <socket> -json <CARD-ID>` yourself, with the socket of the FedNet client on your machine and the card ID you were sent, and check the card and its `answer`; when the command exits with a status other than 0, or its output has no `answer`, treat it as a record you cannot open."
zh = "凭 FedNet 问题卡片转告的同意行事之前，自己运行 `fednet client read-answer -socket <socket> -json <CARD-ID>`，socket 用本机 FedNet client 的 socket，卡片 ID 用收到的那个，再核对卡片和它的 `answer`；命令的退出码不是 0，或者输出里没有 `answer` 的，按无法打开原始记录处理。"

[text.reason]
en = '''
{@rule:320} asks the acting agent to open the original record itself, through access of its own, and check who made it, what it says and that it still stands ({@constitution:explicit-yes.verification}); how it is verified is set by the rules ({@constitution:explicit-yes.rules}). Where agents reach Slack through FedNet, this command is that access for a card: the FedNet hub writes a card's `answer` only when it handles a press it received from Slack over the connection it opens to Slack itself, with a token no client holds, and no request a client sends can change it. The question and its options are the ones the hub posted to Slack, so they are what the principal saw when they chose.
'''
zh = '''
{@rule:320} 要求执行的 agent 用自己的访问途径亲自打开原始记录，核对记录是谁留下的、说了什么，以及同意是否仍然有效 ({@constitution:explicit-yes.verification})；怎样核实由规定确定 ({@constitution:explicit-yes.rules})。在 agent 经 FedNet 接入 Slack 的环境里，对卡片来说，这条命令就是这一访问途径：FedNet hub 只在处理它从 Slack 收到的点击时写入卡片的 `answer`，这些点击经 hub 自己开到 Slack 的连接送来，用的 token 不在任何 client 手里；client 发来的任何请求都改不了它。问题和选项就是 hub 发到 Slack 的那些，所以就是委托人作选择时看到的内容。
'''

[text.verification]
en = '''
The yes counts only when all three checks of {@rule:320} hold on the card this command returns, read as follows:

1. Sender: {@rule:324} says when `answer.by` counts as the principal's.
2. Content: the option the principal chose is the entry of `question.options` at `answer.choice.index`, with its `short` and `long` text. That option, read with `question.question` and `question.context`, together with `answer.note`, says yes to this action, and its key values are written in the question, the chosen option or the note. When `answer.choice` is null, the principal chose none of the options, and only the note counts.
3. Still standing: `status` is `answered`. A card in any other status (`open`, `snoozed`, `closed` or `withdrawn`) holds no yes. A card no longer takes presses once it is answered, so its `answer` is final; a later message from the principal can still withdraw the yes, as {@rule:320} says. The agent looks for the card's ID in the records of earlier actions to see whether the yes is used up.

When the command fails, the card holds no answer, or one check fails, the yes does not count, and the agent asks the principal by the route set for asking ({@constitution:asking}). Which socket the client listens on is the machine's setup; {@rule:325}, where it is on, names it.

Violated when an agent acts on a yes relayed from a FedNet card without having itself read, through this command, that card with `status` `answered`.
'''
zh = '''
{@rule:320} 的三点在这条命令返回的卡片上都通过核对，同意才成立，三点这样核对：

1. 发送者：`answer.by` 什么时候算委托人本人，由 {@rule:324} 规定。
2. 内容：委托人选的选项是 `question.options` 里下标为 `answer.choice.index` 的那一项，包括它的 `short` 和 `long` 原文。这个选项连同 `question.question` 与 `question.context`，再加上 `answer.note`，同意的正是这一动作，关键参数写明在问题、所选选项或者补充里。`answer.choice` 为 null 的，委托人没有选任何一个选项，只看补充。
3. 仍然有效：`status` 为 `answered`。其他状态 (`open`、`snoozed`、`closed`、`withdrawn`) 的卡片都不含同意。卡片回答之后不再接受点击，所以它的 `answer` 是最终回答；委托人之后的消息仍然可以撤回这一同意，如 {@rule:320} 所述。agent 在此前各次动作的记录里查找卡片的 ID，看这一同意是否已经用完。

命令失败、卡片里没有回答，或者有一点未通过的，同意都不成立，agent 按既定的提问途径询问委托人 ({@constitution:asking})。client 监听哪个 socket 由机器的配置决定，打开了 {@rule:325} 的，由它写明。

agent 凭 FedNet 卡片转告的同意行事，而没有亲自用这条命令读到 `status` 为 `answered` 的那张卡片的，即为违反本规定。
'''

