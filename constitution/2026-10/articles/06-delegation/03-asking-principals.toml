id = "asking-principals"
status = "draft"

[content]
en = '''
Which agents may ask principals directly is set by the rules; how to ask follows {@asking}. Where the rules set nothing, questions to principals about one task go through one fixed channel only, so that several agents do not each take up the principals' attention with the same task.
'''
zh = '''
哪些 agent 可以直接向委托人提问，由规定写明；怎样提问，依照{@asking}。规定没有写明的，同一项任务只能经一个固定的途径向委托人提问，以免多个 agent 就同一项任务分别占用委托人的注意力。
'''
