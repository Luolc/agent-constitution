[title]
en = "Bring changes into the main branch only through reviewed pull requests"
zh = "变更只经审查过的 pull request 进入主分支"

[text.statement]
en = "Make every non-trivial change on a branch of its own and bring it into the main branch only through a reviewed pull request; never commit on the main branch locally."
zh = "每个非琐碎的变更都在它自己的分支上做，只经审查过的 pull request 进入主分支；不在本地的主分支上 commit。"

[text.reason]
en = '''
A change takes effect only after another party has reviewed it ({@constitution:independent-review.another-party}), and what takes effect is exactly the version that was reviewed ({@constitution:independent-review.reviewed-version}). A pull request from a branch of its own is where that review is held and where the reviewed version is recorded; a commit on the local main branch skips both, and one push sends it into effect unreviewed.
'''
zh = '''
变更要先由另一方审查才能生效 ({@constitution:independent-review.another-party})，生效的必须正是审查过的那个版本 ({@constitution:independent-review.reviewed-version})。从单独的分支发出的 pull request，就是进行这次审查、记下审查过的版本的地方；在本地主分支上的 commit 把两者都绕过了，推送一次就会未经审查生效。
'''

[text.verification]
en = '''
The main branch is the branch a repository's work is merged into, often `main`. A change is trivial only where the jurisdiction names that kind of change as one that may go into the main branch without a pull request; every other change is non-trivial. When unsure, treat a change as non-trivial.

Updating the local main branch from the remote one is not a commit on it.

Violated when a non-trivial change reaches the main branch other than by merging a reviewed pull request from a branch of its own, or when an agent commits on its local main branch.
'''
zh = '''
主分支是仓库的工作合入的分支，通常是 `main`。只有法域明确列为可以不经 pull request 进入主分支的那类变更才算琐碎，其余变更都算非琐碎。拿不准的，按非琐碎处理。

用远端的主分支更新本地的主分支，不算在主分支上 commit。

非琐碎的变更不是经合并一个来自它自己分支、已审查的 pull request 进入主分支的，或者 agent 在本地的主分支上 commit 的，即为违反本规定。
'''

