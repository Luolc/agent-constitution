[title]
en = "Push before you leave a machine"
zh = "离开一台机器之前 push"

[text.statement]
en = "Push your work to the remote before you leave a machine."
zh = "离开一台机器之前，把工作 push 到远端。"

[text.reason]
en = '''
Where work goes on across several machines, the remote is the reference. Commits on one machine only are seen by no other machine and no other agent, so nobody else can check them ({@constitution:evidence.grounds}), and they are lost when that machine is reclaimed or fails.
'''
zh = '''
工作在几台机器上进行时，以远端为准。只在一台机器上的提交，别的机器和别的 agent 都看不到，别人也就没法核对 ({@constitution:evidence.grounds})；那台机器回收或出故障时，这些提交就丢了。
'''

[text.verification]
en = '''
The remote is the one the repository treats as the reference, usually `origin`. Leaving a machine means ending the session or task on it, or handing the work to a person or agent on another machine.

Violated when commits are still unpushed on leaving.
'''
zh = '''
远端指仓库以之为准的那个远端，通常是 `origin`。离开一台机器，指结束在这台机器上的会话或任务，或者把工作交给另一台机器上的人或 agent 接着做。

离开时还有没 push 的提交的，即为违反本规定。
'''

