# The static site: in each language, the constitution and its version
# for agents, made by content/_content.gotmpl from
# constitution.<lang>.md and constitution.<lang>.agent.md, the files
# `statute constitution build` generates; the rules, made by
# content/rules/_content.gotmpl from data/rules.json, which
# `uv run site-rules` writes; and the design.
# `hugo-0.167.0 -s web` builds it into site/, after `uv run site-rules`,
# with the tokens that `uv run count-tokens` counted, if any;
# `uv run check-site-anchors site` checks the links (all three in
# tools/site). See docs/design/static-site.md.
baseURL = "/"
publishDir = "../site"
# Relative links, so that site/index.html also opens as a file.
relativeURLs = true
title = "Agent Constitution"
theme = "hugo-book"
defaultContentLanguage = "en"
disableKinds = ["taxonomy", "term", "rss", "sitemap", "404"]
enableRobotsTXT = false

# countWords: whether the lengths give words as well as characters; words
# are split on white space, which Chinese does not put between them.
[languages.en]
  label = "English"
  title = "Agent Constitution"
  weight = 1
  [languages.en.params]
    countWords = true

[languages.zh]
  label = "中文"
  title = "Agent 宪法"
  weight = 2
  [languages.zh.params]
    countWords = false

# The sidebar lists the site's pages in groups, each a top-level entry
# with the group's name in bold and an icon (BookIcon, named as
# layouts/_partials/icon.html takes it), its pages as children. The first
# group, the constitution, links the home page; under it, its editions
# newest first, each entry added by content/_content.gotmpl from its
# index.toml. Its version for agents is not listed, as it is not meant for
# people to read, and is linked from the home page. The icon is Lucide's
# `scale`.
[[languages.en.menus.before]]
  identifier = "constitution"
  name = "Constitution"
  pageRef = "/"
  weight = 1
  [languages.en.menus.before.params]
    class = "menu-group"
    BookIcon = "lucide:scale"
[[languages.zh.menus.before]]
  identifier = "constitution"
  name = "宪法"
  pageRef = "/"
  weight = 1
  [languages.zh.menus.before.params]
    class = "menu-group"
    BookIcon = "lucide:scale"
# The second group, the rules, links their list, rules/, made by
# content/rules/_content.gotmpl. The icon is Lucide's `list-checks`.
[[languages.en.menus.before]]
  identifier = "rules"
  name = "Rules"
  pageRef = "/rules"
  weight = 2
  [languages.en.menus.before.params]
    class = "menu-group"
    BookIcon = "lucide:list-checks"
[[languages.zh.menus.before]]
  identifier = "rules"
  name = "规定"
  pageRef = "/rules"
  weight = 2
  [languages.zh.menus.before.params]
    class = "menu-group"
    BookIcon = "lucide:list-checks"
# The third group, the design, links its README; under it, its files in
# the README's order, each entry added by content/design/_content.gotmpl.
# The icon is Lucide's `book-open`.
[[languages.en.menus.before]]
  identifier = "design"
  name = "Design"
  pageRef = "/design"
  weight = 3
  [languages.en.menus.before.params]
    class = "menu-group"
    collapse = true
    BookIcon = "lucide:book-open"
[[languages.zh.menus.before]]
  identifier = "design"
  name = "设计"
  pageRef = "/design"
  weight = 3
  [languages.zh.menus.before.params]
    class = "menu-group"
    collapse = true
    BookIcon = "lucide:book-open"

# The content is only this repo's own built constitution and design; raw
# HTML is needed for their anchors (<a id="...">) and the asterisks
# (<sup class="omitted">).
[markup.goldmark.renderer]
  unsafe = true

# The table of contents at the right lists the articles and the preamble,
# the level-2 headings under the page's `#` title.
[markup.tableOfContents]
  startLevel = 2
  endLevel = 2

[params]
  BookTheme = "auto"
  # The menu root is the home page; its one child, the version for
  # agents, is hidden from the theme's list of pages, which the menu
  # above replaces.
  BookSection = "/"
  BookToC = true
  BookSearch = false
  BookComments = false
  BookServiceWorker = false
  BookTranslatedOnly = false
  # The statuses the filter of the list checks by default.
  rulesStatuses = ["active", "trial"]
  # Linked in the sidebar, under the site's title.
  SourceRepo = "https://github.com/Luolc/agent-constitution"
  # The asterisk after a provision the version for agents leaves out, as
  # the constitution's build writes it (OMITTED_MARK in
  # crates/statute/src/constitution/render.rs).
  omittedMark = '<sup class="omitted">*</sup>'
  # The model count-tokens counts the tokens for, and its name in
  # the popup on the counts.
  [params.tokenCount]
    model = "claude-opus-5-5"
    name = "Claude Opus 5.5"

# The built constitution comes from its edition directory,
# constitution/<YYYY-MM>/: index.toml, for the revision and the status,
# and the two Markdown files of each language in generated/, all as
# assets, which layouts/_partials/constitution/source.html finds by name.
# data/lengths.json, written by count-tokens, holds the tokens, and
# data/rules.json, written by site-rules, the rules; neither is committed.
# A component with a mount of its own loses its default one, so data and
# assets are mounted again.
[[module.mounts]]
  source = "../constitution"
  target = "assets/constitution"
  files = ["*/index.toml", "*/generated/constitution.*.md"]
# The design, docs/design/*.md, and its Chinese translation,
# docs/design/zh/*.md, as assets, which content/design/_content.gotmpl
# makes into pages.
[[module.mounts]]
  source = "../docs/design"
  target = "assets/design"
  files = ["*.md", "zh/*.md"]
# The design tokens, the icons and the script of a parameter's tip, from
# crates/statute/assets/, where the local site of `statute site` can
# include them too (docs/design/frontend.md): tokens.css among the style
# sheets (assets/styles/index.yaml), the icons as
# icons/<source>/<name>.svg, which layouts/_partials/icon.html includes,
# and param-tip.js among the scripts (layouts/_partials/docs/inject/head.html).
[[module.mounts]]
  source = "../crates/statute/assets"
  target = "assets/styles"
  files = ["tokens.css"]
[[module.mounts]]
  source = "../crates/statute/assets"
  target = "assets"
  files = ["param-tip.js"]
[[module.mounts]]
  source = "../crates/statute/assets/icons"
  target = "assets/icons"
  files = ["*/*.svg"]
[[module.mounts]]
  source = "data"
  target = "data"
[[module.mounts]]
  source = "assets"
  target = "assets"
