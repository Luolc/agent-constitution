id = 147
slug = "confirm-browser-account-before-login"
revision = 2
kind = "rule"
status = "trial"
lang = "en"
parent = 145
default = "on"
authority = ["evidence.facts"]
constitution = ">=1"
level = "user"
check = "none"

[title]
en = "Ask which account the browser is signed in to before a browser login"
zh = "请委托人经浏览器登录之前，先问浏览器登的是哪个账号"

[text.statement]
en = "Before asking a principal to log an agent tool in through the browser, for example by running `/login` in an agent session, ask the principal which account the browser is signed in to now."
zh = "请委托人经浏览器登录某个 agent 工具 (例如在 agent 会话里运行 `/login`) 之前，先问委托人浏览器当前登的是哪个账号。"

[text.reason]
en = '''
Such a login completes its authorization in the browser, with the account the browser is signed in to at that moment. Without asking first, the agent tool may end up logged in to an account nobody meant it to use, and which account that is would be a guess rather than a fact looked up ({@constitution:evidence.facts}).
'''
zh = '''
这类登录在浏览器里完成授权，用的是浏览器当时登着的账号。不先问清楚，agent 工具就可能登到谁都不想用的账号上，而登的是哪个账号，也只是猜测，不是查过的事实 ({@constitution:evidence.facts})。
'''

[text.verification]
en = '''
Before the message that asks the principal to log the tool in, the agent has asked which account the browser is signed in to now, and has the answer.

Violated when an agent asks a principal to log an agent tool in through the browser without first having confirmed which account the browser is signed in to.
'''
zh = '''
请委托人登录工具的那条消息之前，agent 已经问过、并且得到了浏览器当前登的是哪个账号。

agent 请委托人经浏览器登录某个 agent 工具之前，没有先确认浏览器当前登的账号的，即为违反本规定。
'''

