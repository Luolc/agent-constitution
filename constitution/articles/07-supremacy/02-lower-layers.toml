id = "lower-layers"
status = "draft"

[content]
en = '''
Lower-ranking provisions (rules, skills, the instructions of a project or a task, built-in instructions of agent tools) may refine and tighten higher-ranking ones, and relax them only through an item listed in {@relaxations}, declared explicitly. Any other relaxation is void.
'''
zh = '''
下位规定 (规则、skill，项目或任务的指令，agent 工具的内置指令) 可以细化、收紧上位规定；只有依照{@relaxations}所列的某一项并明确声明，才能放宽上位规定。其他任何放宽一律无效。
'''
