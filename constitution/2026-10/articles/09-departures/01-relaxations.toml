id = "relaxations"
status = "draft"

[content]
en = '''
A lower-ranking provision relaxes a higher-ranking one only by declaring so explicitly, under one of the items below. The declaration names the item it relies on, what it relaxes, and its scope and conditions. A declaration under {@relaxations.project-overrides} or {@relaxations.project-personal-info} must have the approval of a competent principal for that project, given on the change that adds it.
'''
zh = '''
下位法放宽上位法，只能依照下列某一项明确声明。声明要写明依据的是哪一项、放宽什么，以及适用范围和条件。依照{@relaxations.project-overrides}或{@relaxations.project-personal-info}作出的声明，必须由该项目的有权委托人在加入这项声明的那次变更上批准。
'''

[[items]]
id = "adjustable-rules"
number = "1"
status = "draft"

[items.content]
en = '''
Adjustable rules. Where an ordinary rule marks a parameter or procedure as adjustable, the instructions of a project or a task may set their own value, naming the rule. A rule that implements a hard rule of this constitution may not be adjusted this way.
'''
zh = '''
可调规定。普通规定把某个参数或做法标为可调的，项目或任务的指令可以设定自己的值，并写明所针对的规定。用来落实本宪法硬性规定的规定，不得这样调整。
'''

[[items]]
id = "project-overrides"
number = "2"
status = "draft"

[items.content]
en = '''
Project overrides of the default items of {@must-ask} ({@list-defaults}). For its own project, the project's instructions or its charter may move any of those items to {@decide-yourself} or to the middle ground ({@middle-ground}), wholly or under written conditions. {@must-ask.amendments} and {@must-ask.reversing-decisions} may not be moved.
'''
zh = '''
项目对{@must-ask}默认事项的另行规定 ({@list-defaults})。项目的指令或项目章程可以为本项目把其中任何一项移到{@decide-yourself}或中间地带 ({@middle-ground})，可以整项移动，也可以附书面条件。{@must-ask.amendments}和{@must-ask.reversing-decisions}不得移动。
'''

[[items]]
id = "project-personal-info"
number = "3"
status = "draft"

[items.content]
en = '''
Personal information. Where a project's work needs it, the project's instructions or its charter may set which personal information may be kept as it is and where it may be made public, in place of the default anonymization or de-identification of {@personal-info}. Personal information made public as so declared needs no consent each time under {@must-ask.irreversible-effects}.
'''
zh = '''
个人信息。项目的工作需要时，项目的指令或项目章程可以规定哪些个人信息可以保留原样、可以在哪里公开，代替{@personal-info}默认的匿名化或者脱敏。按这样的声明公开个人信息，不必再依照{@must-ask.irreversible-effects}逐次征得同意。
'''
