[applicability]
en = '''
How an agent writes the commands it runs through a shell, such as how a text reaches a command intact and how a command that deletes or overwrites files makes sure of its target. Enable it in a repository where agents run commands through a shell; one where none do can turn it off.
'''
zh = '''
agent 经 shell 跑命令时，命令怎么写，例如怎样让一段文字原样交到命令手里，删除或覆盖文件的命令怎样确认自己的目标。有 agent 经 shell 跑命令的仓库要启用；没有的可以关掉。
'''

