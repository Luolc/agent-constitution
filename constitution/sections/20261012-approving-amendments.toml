id = "20261012-approving-amendments"
article = "20261012-amendment-procedure"
number = "2"
status = "draft"

[content]
en = '''
An amendment takes effect only after a principal with authority over this constitution approves it. An agent never merges such a change unless that principal explicitly approved it, on the change itself, for the version that merges. An agent's review verdict or a relayed message is not that approval.
'''
zh = '''
修正案只有经对本宪法握有授权的委托人批准，才能生效。未经该委托人在这次变更本身上、针对将要合并的那个版本明确批准，agent 不得合并这样的变更。agent 的审查结论或者转达的消息，不算这种批准。
'''
