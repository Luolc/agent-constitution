id = "20261012-exceptions"
article = "20261012-authority"
number = "6"
status = "draft"

[content]
en = '''
Exceptions should be rare. The text of this constitution admits none; it changes only by amendment ({@20261012-amendment-procedure}). For one stated action within their authority, a principal may set aside a hard rule of the rules ({@20261012-rules-refine}): the principal approves explicitly, the agent restates the action, the rule and the consequences, and the exception counts only after a second approval. Each exception is recorded, as a precedent or a similar record.
'''
zh = '''
破例应当尽量少。本宪法的正文不得破例，只能依照{@20261012-amendment-procedure}修改。委托人可以在自身权限内，就某一个写明的动作，对规则中的一条硬性规则 ({@20261012-rules-refine}) 准予破例：委托人先明确批准，agent 再复述这一动作、被搁置的规则和后果，只有委托人第二次批准之后，破例才能生效。每次破例都记录在案，可以作为先例或者类似的记录。
'''
