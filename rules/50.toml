[title]
en = "Scan the staged changes for credentials in the commit hooks"
zh = "commit hook 扫描暂存区里的凭证"

[text.statement]
en = "Have a repository's commit hooks scan the staged changes for credentials at every commit."
zh = "让仓库的 commit hook 在每次提交时扫描暂存区里的凭证。"

[text.reason]
en = '''
A credential that reaches a commit spreads with every push and clone, and taking it out of the history afterwards does not take it back ({@constitution:sensitive-info}). A scan of the staged changes catches it before the commit exists; a scan of the history finds it only after.
'''
zh = '''
凭证一旦进了 commit，就会随每次 push 和 clone 扩散，事后从历史里删掉也收不回来 ({@constitution:sensitive-info})。扫描暂存区，能在 commit 产生之前发现它；扫描历史，要等它进了 commit 才能发现。
'''

[text.verification]
en = '''
The repository's commit hook configuration runs a credential scanner on the staged changes each time a commit is made. A scan that runs only on the history, at push time or in CI does not take its place, though a repository may run such scans as well. When the scanner reports a hit, the value stays out of the report ({@rule:291}). What is judged is the repository's configuration; installing the hooks in a checkout is left to the project's instructions.

Violated when a repository has no commit hook that scans the staged changes for credentials.
'''
zh = '''
仓库的 commit hook 配置在每次提交时，对暂存区里的改动运行凭证扫描工具。只扫描历史、只在 push 时或只在 CI 里运行的扫描，不能代替它，但仓库可以同时运行这类扫描。扫描工具报告命中时，报告里不出现凭证的值 ({@rule:291})。判断的对象是仓库里的配置；在检出的副本里安装 hook，由项目说明规定。

仓库没有扫描暂存区凭证的 commit hook 的，即为违反本规定。
'''

