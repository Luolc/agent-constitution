id = "20261012-prefer-tooling"
article = "20261012-rule-evolution"
number = "2"
status = "draft"

[content]
en = '''
Prefer fixing loading, tooling or procedure over adding an obligation. Rule count is a cost: merge, shorten and repeal rules that no longer pay their way.
'''
zh = '''
宁可改进加载方式、工具或流程，也不增加义务。规则的数量本身就是成本：不再值得保留的规则，合并、精简或者废止。
'''
