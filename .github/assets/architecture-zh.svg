<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 840" width="960" height="840" role="img" aria-labelledby="t">
<title id="t">Agent 宪法的结构：宪法由规定细化；仓库在 statute.toml 里选规定，由 statute.lock 锁定；statute 把它们编译成 AGENTS.md，并用 statute check 给出要审的规定清单；agent 依此工作，审查 agent 按 domain、按规定逐项审；遇到没有规定覆盖的缺口，就写一条试行规定。</title>
<g font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif'>
<rect x="1" y="1" width="958" height="838" rx="20" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
<rect x="40" y="28" width="820" height="96" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<g transform="translate(64 50) scale(1.15)" fill="none" stroke="#7d3a1e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9.5 12 3l9.5 6.5z"/><path d="M5 9.5V19M9.7 9.5V19M14.3 9.5V19M19 9.5V19M2.5 21h19"/></g>
<text x="106" y="70" font-size="20" font-weight="600" fill="#1f2328">宪法</text>
<rect x="747" y="48" width="93" height="26" rx="13" fill="#f5ece7" stroke="#e3cfc3"/>
<text x="793" y="66" font-size="13" font-weight="500" text-anchor="middle" fill="#7d3a1e">2026-10 版</text>
<text x="106" y="98" font-size="14.5" fill="#59636e">原则、谁能决定什么，以及规定和宪法本身怎样修改</text>
<path d="M450 132v20M445 147l5 5 5-5" fill="none" stroke="#818b98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="450" y="174" font-size="13.5" text-anchor="middle" fill="#59636e">由规定细化</text>
<rect x="40" y="196" width="820" height="96" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<g transform="translate(64 218) scale(1.15)" fill="none" stroke="#7d3a1e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
<text x="106" y="238" font-size="20" font-weight="600" fill="#1f2328">规定</text>
<rect x="106.0" y="251.3" width="128.0" height="20.0" rx="5" fill="#818b98" fill-opacity="0.12"/>
<text x="106" y="266" font-size="14.5" fill="#59636e"><tspan dx="4" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace' font-size="0.92em">rules/&lt;id&gt;.toml</tspan>&#160; · 按编号、归入 domain · 状态为 draft、trial 或 active</text>
<path d="M450 300v20M445 315l5 5 5-5" fill="none" stroke="#818b98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="315.4" y="328.3" width="97.3" height="18.6" rx="5" fill="#818b98" fill-opacity="0.12"/>
<rect x="470.0" y="328.3" width="97.3" height="18.6" rx="5" fill="#818b98" fill-opacity="0.12"/>
<text x="450" y="342" font-size="13.5" text-anchor="middle" fill="#59636e">在&#160;<tspan font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace' font-size="0.92em">statute.toml</tspan>&#160; 里选，由&#160;<tspan font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace' font-size="0.92em">statute.lock</tspan>&#160; 锁定</text>
<rect x="40" y="364" width="820" height="96" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<g transform="translate(64 386) scale(1.15)" fill="none" stroke="#7d3a1e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2.5"/><path d="m6.5 9 3 3-3 3M12 15h5.5"/></g>
<rect x="184" y="384" width="104" height="30" rx="6" fill="#818b98" fill-opacity="0.12"/>
<text x="106" y="405" font-size="15" font-weight="500" fill="#59636e">Command:</text>
<text x="196" y="406" font-size="20" font-weight="600" fill="#1f2328" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace'>statute</text>
<rect x="232.5" y="419.3" width="287.9" height="20.0" rx="5" fill="#818b98" fill-opacity="0.12"/>
<text x="106" y="434" font-size="14.5" fill="#59636e">解析规定集并编译：<tspan font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace' font-size="0.92em">init · add · lock · compile · check</tspan></text>
<path d="M450 468v20M445 483l5 5 5-5" fill="none" stroke="#818b98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="450" y="510" font-size="13.5" text-anchor="middle" fill="#59636e">写进仓库，交给审查</text>
<rect x="40" y="532" width="400" height="112" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<g transform="translate(64 554) scale(1.15)" fill="none" stroke="#7d3a1e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6.5A2 2 0 0 0 4.5 5v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V8.5z"/><path d="M14 3v5.5h5.5M8.5 13h7M8.5 17h5"/></g>
<rect x="106.0" y="552.0" width="116.0" height="30.0" rx="5" fill="#818b98" fill-opacity="0.12"/>
<text x="106" y="574" font-size="20" font-weight="600" fill="#1f2328"><tspan dx="4" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace'>AGENTS.md</tspan></text>
<text x="106" y="602" font-size="14.5" fill="#59636e">宪法的 agent 版和选中的每条规定，</text>
<text x="106" y="624" font-size="14.5" fill="#59636e">所需的 skill 写在它旁边</text>
<rect x="460" y="532" width="400" height="112" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<g transform="translate(484 554) scale(1.15)" fill="none" stroke="#7d3a1e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 19.5 6v6c0 4.4-3.2 7.6-7.5 9-4.3-1.4-7.5-4.6-7.5-9V6z"/><path d="m8.7 12.2 2.3 2.3 4.4-4.6"/></g>
<text x="526" y="574" font-size="20" font-weight="600" fill="#1f2328">审查</text>
<rect x="598" y="585" width="134" height="26" rx="6" fill="#818b98" fill-opacity="0.12"/>
<text x="526" y="603" font-size="14" font-weight="500" fill="#59636e">Command:</text>
<text x="607" y="603" font-size="15" font-weight="600" fill="#1f2328" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace'>statute check</text>
<text x="526" y="624" font-size="14.5" fill="#59636e">逐条规定的审查清单</text>
<path d="M450 652v20M445 667l5 5 5-5" fill="none" stroke="#818b98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="450" y="694" font-size="13.5" text-anchor="middle" fill="#59636e">agent 工作时读，审查时运行</text>
<rect x="40" y="716" width="820" height="96" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<g transform="translate(64 738) scale(1.15)" fill="none" stroke="#7d3a1e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4.8"/><circle cx="12" cy="3.6" r="1.2"/><path d="M9 13.2v1.6M15 13.2v1.6M2 13v3M22 13v3"/></g>
<text x="106" y="758" font-size="20" font-weight="600" fill="#1f2328">agent 工作与审查</text>
<text x="106" y="786" font-size="14.5" fill="#59636e">审查 agent 按 domain、按规定逐项审；脚本能自动判定的只是少数</text>
<path d="M864 764H888a12 12 0 0 0 12-12V256a12 12 0 0 0-12-12H866M872 238l-6 6 6 6" fill="none" stroke="#7d3a1e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="887" y="373" width="26" height="262" fill="#ffffff"/>
<text transform="translate(905 504) rotate(-90)" font-size="13.5" text-anchor="middle" fill="#7d3a1e">遇到没有规定覆盖的缺口 → 写试行规定</text>
</g>
</svg>
