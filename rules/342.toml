[title]
en = "Run a Python project's lint in the commit hooks and all its checks in CI"
zh = "Python 项目的 lint 进 commit hook，全部检查进 CI"

[text.statement]
en = "Run a Python project's formatter, linter and docstring checker and the check that its lock file is current in the repository's commit hooks, and every check it configures, its type check and tests among them, in CI."
zh = "Python 项目的 formatter、linter、docstring 检查器，以及检查锁文件是否最新的那项检查，放进仓库的 commit hook；它配置的每一项检查，类型检查和测试在内，都放进 CI。"

[text.reason]
en = '''
A check that runs only when someone remembers to run it catches mistakes only then. In the hooks, the fast checks stop a mistake before it is committed; in CI, every check runs on every change, whatever was run before the push ({@constitution:automation-first.keep-moving}). The type check and the tests stay out of the hooks, which {@rule:250} keeps to checks that take seconds.
'''
zh = '''
只在有人记得时才跑的检查，也只有那时才抓得到错。快的检查放进 hook，错在提交之前就被拦下；全部检查放进 CI，每个变更都跑一遍，不管 push 之前跑过什么 ({@constitution:automation-first.keep-moving})。类型检查和测试不进 hook，{@rule:250} 把 hook 限在几秒跑完的检查。
'''

[text.verification]
en = '''
The checks a project configures are those its configuration sets up: the tools in its dependency groups with settings for them, and its test suite. The lock file check is one that fails when the lock file no longer matches the project file, such as the `uv-lock` hook. Running a check in the hooks and again in CI meets both halves.

Violated when a repository's commit hooks, read from their configuration, do not run the formatter, the linter, the docstring checker or the lock file check of a Python project in it, or when its CI does not run, on every change, a check that a Python project in it configures.
'''
zh = '''
项目配置的检查，指它的配置里设了的那些：依赖组里有、且配了设置的工具，以及它的测试集。锁文件检查指锁文件与项目文件对不上时会失败的检查，例如 `uv-lock` hook。同一项检查在 hook 里跑、在 CI 里再跑一遍，两半都满足。

仓库的 commit hook (从其配置读) 没有跑仓库里某个 Python 项目的 formatter、linter、docstring 检查器或锁文件检查的，或者仓库的 CI 没有对每个变更都跑仓库里某个 Python 项目配置的某项检查的，即为违反本规定。
'''

