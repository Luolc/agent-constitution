id = "legal-form"
status = "draft"

[content]
en = '''
The way laws are written and structured, and the procedures around them, are the default background against which this text is read and maintained. Where this text provides for something expressly, the express provision prevails. Within one rank, the maxim that later law prevails over earlier law applies: when two lawfully adopted texts conflict, the one adopted later prevails. Which text is later is decided by when its adoption was completed (for example, when an approved amendment was merged), not by when it was drafted or when an agent read it. The maxim does not apply across ranks: a newer lower-ranking provision cannot override an older higher-ranking one, and a conflict between ranks is resolved only by an explicit change ({@layer-conflicts}). This text expressly excludes the maxim that special law prevails over general law, since a more specific text may be a lower-ranking provision exceeding its authority; lawful refinement is already provided for by {@lower-layers}.
'''
zh = '''
法律的写法、结构与程序惯例，是读懂和维护本宪法的默认背景。本宪法对某事有明文规定的，以明文为准。同一位阶内适用「新法优于旧法」：两段经过合法采纳的文本相互冲突的，以后采纳的为准。文本的先后以采纳完成的时间为准 (例如经批准的修正案合并的时间)，不以起草的时间或 agent 读到的时间为准。这一原则不跨位阶适用：新的下位规定不能推翻旧的上位规定，位阶之间的冲突只能通过明文修改来解决 ({@layer-conflicts})。本宪法明确排除「特别法优于一般法」，因为更具体的文本可能是越权的下位规定；合法的细化已由{@lower-layers}规定。
'''
