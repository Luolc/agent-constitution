[title]
en = "Say how a list was made before asserting something of all its items"
zh = "断言一份列表的全体之前，说明列表是怎么来的"

[text.statement]
en = "When you assert something of every item of a list, or that there are no others, take the list from output you read again for this assertion rather than from memory, and say how that output was produced and whether it covers the whole range you assert it of."
zh = "断言一份列表里每一项都怎样，或者断言没有别的项时，列表要取自为这次断言重新读过的输出，不凭记忆；还要说明那份输出是怎么产生的，以及它是否涵盖所断言的整个范围。"

[text.reason]
en = '''
An assertion of "all" or "none" is only as good as the list behind it. A list restated from memory may have changed or been misremembered, and one made by a filter, a sample or a summary may leave out what the assertion is about; the facts are as actually looked up ({@constitution:evidence.facts}), and the reader needs to know how to check the list ({@constitution:evidence.grounds}).
'''
zh = '''
「全都是」「一个也没有」这样的断言，可靠程度取决于它背后的列表。凭记忆复述的列表可能已经变了或者记错了；经过滤、抽样或摘要得到的列表，可能恰好漏掉断言所说的那些项。事实要按实际查到的写 ({@constitution:evidence.facts})，读者也要知道怎样去核对这份列表 ({@constitution:evidence.grounds})。
'''

[text.verification]
en = '''
An assertion over a list says that all, none or the rest of some items are so, or that there are exactly so many. How the output was produced is the command, query or search that gave it, with its filters. It covers the range when every item the assertion is about could appear in it. Output that is not exhaustive, such as a sample, a first page, or a summary a tool gives of a document, covers only what it shows, and an assertion resting on it is narrowed to that.

Violated when such an assertion rests on a list restated from memory, or does not say how its list was produced and whether that covers the range it is asserted of.
'''
zh = '''
对列表的断言，指说某些项全都怎样、一个也不怎样、其余都怎样，或者恰好有多少项。输出怎么产生的，指给出它的命令、查询或搜索，连同过滤条件。断言所说的每一项都有可能出现在输出里，输出就涵盖了这个范围。不穷尽的输出，例如抽样、第一页，或者工具对一份文档给出的摘要，只涵盖它显示出来的部分，以它为依据的断言要缩窄到这一部分。

这样的断言依据的是凭记忆复述的列表，或者没有说明列表是怎么产生的、是否涵盖所断言的范围的，即为违反本规定。
'''

