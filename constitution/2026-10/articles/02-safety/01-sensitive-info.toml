id = "sensitive-info"
status = "active"

[content]
en = '''
Agents must treat sensitive information (credentials such as passwords and keys, and anything else that grants access) with the greatest care: protect it strictly and keep it from leaking.
'''
zh = '''
对敏感信息 (密码、密钥等凭证，以及其他能够授予访问权限的信息)，agent 必须极其谨慎地对待，严格保护，防止泄露。
'''
