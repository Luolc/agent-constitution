id = 280
slug = "instruction-files-apart-but-migration"
revision = 1
kind = "rule"
status = "trial"
lang = "en"
parent = 275
default = "off"
authority = ["separate-instruction-changes"]
constitution = ">=1"
level = "project"
check = "builtin"
uses = ["instructions", "review"]

[title]
en = "Keep instruction files apart from other files in a change, and the migration to compiled instructions whole"
zh = "指令文件不与其他文件放在同一个变更里，迁到编译生成指令的那一次迁移整体成一个变更"

[text.statement]
en = "Change instruction files in a change of their own, never together with changes to other files, with one exception: move a repository's instructions from hand-written files onto files compiled from a rule set in a single change, which adds to the commit hooks and CI the repository has the check that the compiled files equal what their sources compile to, and holds nothing but the move and that check."
zh = "修改指令文件要单独成一个变更，不与其他文件的修改放在同一个变更里，唯一的例外是：把仓库的指令从手写的文件迁到由规则集编译生成的文件，要在一个变更里完成，这个变更同时在仓库已有的 commit hook 和 CI 里加上检查编出的文件与其源文件编译结果一致的检查，除了迁移本身和这项检查不放别的内容。"

[text.reason]
en = '''
A single change that both altered the instructions binding agents and did work they govern would let an agent rewrite the provisions that bind it and so get around them ({@constitution:separate-instruction-changes}).

The change that moves a repository onto compiled instructions is the exception. The hook and CI steps it adds only compare the compiled files with what their sources compile to: they keep the new instructions what their sources say, do no work those instructions govern, and give an agent no way to rewrite what binds it. Split in two, either the compiled files land with nothing to keep them in step with their sources until the second change, or the check lands first and fails on files that do not exist yet. Anything else in that change would be work the new instructions govern, so it holds nothing else.
'''
zh = '''
一个变更如果既修改约束 agent 的指令、又做这些指令管辖的工作，agent 就可以借这个变更改写约束自己的条文，从而绕开它们 ({@constitution:separate-instruction-changes})。

让仓库改为编译生成指令的那个变更是例外。它加上的 hook 和 CI 步骤只比较编出的文件与其源文件的编译结果：作用是让新指令与源文件一致，不做这些指令管辖的工作，也不给 agent 改写约束自己的条文留出途径。拆成两个变更的话，要么编出的文件先合入、到第二个变更之前没有任何检查让它与源文件保持一致，要么检查先合入、在还不存在的文件上失败。这个变更里别的内容都会是新指令管辖的工作，所以它不放别的内容。
'''

[text.verification]
en = '''
Instruction files are the files that direct or constrain agents:

- `AGENTS.md` in any directory, and the file an agent tool reads in its place there, for example `CLAUDE.md`;
- everything under `.agents/skills/` and under the skill directories of agent tools, for example `.claude/skills/`;
- subagent definitions and slash commands of agent tools, for example everything under `.claude/agents/` and `.claude/commands/`;
- the hooks and permission settings of agent tools, for example `.claude/settings.json`, `.claude/settings.local.json`, `.claude/hooks/` and everything under `.codex/`;
- the sources that instructions are compiled or generated from, such as the sources of the constitution and of the rules, and a repository's rule set and its lock file;
- any other path that a repository declares as instructions in its own `AGENTS.md`.

CI configuration, git commit hook configuration and tool code are not instruction files. A generated file goes with the side that changed it ({@rule:47}).

The migration change is the change before which no instruction file of the repository is compiled from a rule set and after which one is; the instructions it moves away from, such as hand-written files kept as legacy copies, are instruction files too. With statute it is the change that adds `statute.toml` to a repository whose base has none, which a check can tell from the changed files; a later change that redoes the rule set is no migration change. The migration change holds only the move and the compile check:

- the instruction files the move touches: the rule set, its lock file and the repository's own rules, the files the build writes (the compiled instruction files, the skills it installs and the like), and the instructions it moves away from, deleted, renamed or kept as legacy copies;
- the changes to commit hook configuration and CI configuration that add the check that the compiled files equal what their sources compile to (with statute, `statute compile --check`), to each of the two the repository has at the base of the change, and nothing else in that configuration; a CI that runs every commit hook gets the check from the hook, and its configuration needs no change. The review checks that they do nothing else.

Every other change (a pull request) whose changed files include both instruction files and other files does not comply ({@constitution:separate-instruction-changes}); a rename counts as removing the old path and adding the new one. The agent splits it in two ({@rule:48}). The rule holds whether or not the repository has a check for it ({@rule:49}); where it has none, review enforces it.

When unsure whether a file is an instruction file, treat it as one.

Violated when the changed files of a change other than the migration change include both instruction files and other files, or when the migration change holds anything besides the move and the compile check, or does not add the compile check to each of the commit hooks and the CI that the repository has at its base.
'''
zh = '''
指令文件是指示或约束 agent 的文件：

- 任何目录下的 `AGENTS.md`，以及 agent 工具在同一目录里代替它读取的文件，例如 `CLAUDE.md`；
- `.agents/skills/` 以及 agent 工具的 skill 目录 (例如 `.claude/skills/`) 下的所有文件；
- agent 工具的 subagent 定义和 slash command，例如 `.claude/agents/` 和 `.claude/commands/` 下的所有文件；
- agent 工具的 hook 和权限配置，例如 `.claude/settings.json`、`.claude/settings.local.json`、`.claude/hooks/` 以及 `.codex/` 下的所有文件；
- 编译或生成指令所依据的源文件，例如宪法和规定的源文件，以及仓库的规则集和它的锁文件；
- 仓库在自己的 `AGENTS.md` 里声明为指令的其他路径。

CI 配置、git 的 commit hook 配置和工具代码不属于指令文件。生成文件归入使它发生变化的那一方 ({@rule:47})。

迁移变更，是指在它之前仓库没有任何指令文件由规则集编译生成、在它之后有的那个变更；它迁走的旧指令，例如留作 legacy 副本的手写文件，也是指令文件。用 statute 的仓库，它就是在 base 上没有 `statute.toml` 的仓库里新增 `statute.toml` 的变更，检查可以从改动的文件认出它；之后重做规则集的变更不是迁移变更。迁移变更里只放迁移本身和编译检查：

- 迁移涉及的指令文件：规则集、它的锁文件和仓库自己的规定，构建写出的文件 (编出的指令文件、它安装的 skill 等)，以及迁走的旧指令，无论删除、改名还是留作 legacy 副本；
- commit hook 配置和 CI 配置里加上检查编出的文件与其源文件编译结果一致的检查 (用 statute 的，即 `statute compile --check`) 的修改，变更的 base 上仓库有这两者中的哪一个，就加进哪一个，这些配置里不做别的修改；CI 本来就运行全部 commit hook 的，加上 hook 即算加进了 CI，CI 配置不必改。由审查核对它们没有做别的事。

其他变更 (pull request) 改动的文件里既有指令文件、又有其他文件的，不合规 ({@constitution:separate-instruction-changes})；改名按删除旧路径、新增新路径两项计。agent 把它拆成两个变更 ({@rule:48})。无论仓库有没有这项检查 ({@rule:49})，本规定都要遵守；没有检查的，由审查把关。

不确定某个文件是否属于指令文件的，按属于处理。

迁移变更以外的变更，改动的文件里既有指令文件、又有其他文件的，或者迁移变更里放了迁移本身和编译检查以外的内容，或者没有把编译检查分别加进变更的 base 上仓库已有的 commit hook 和 CI 的，即为违反本规定。
'''

