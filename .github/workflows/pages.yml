# The static site on main: exchanges the run's GitHub OIDC token for a
# short-lived Anthropic access token through Workload Identity Federation,
# counts the tokens with it, builds and checks the site, writes the length
# line of both pages into the job summary and the log, and publishes the
# site to GitHub Pages (docs/design.md, Static site). The federation rule
# matches the repository, not a branch; this repository publishes only main,
# so the job runs only on a push to main or a manual run on main. A failed
# exchange, count, build or link check fails the run and publishes nothing.
# The four IDs are identifiers, not credentials, but kept as repository
# secrets: the run logs of a public repository are open to anyone, and a
# step's header prints its variables in clear while it masks secrets as ***.

name: Pages

on:
  push:
    branches: [main]
  # To publish main again, for example right after Pages is turned on;
  # on another branch the job is skipped.
  workflow_dispatch:

concurrency:
  # Pages refuses a deployment while another is in progress, so the runs
  # queue and one in progress is never cancelled; a queued one is replaced
  # by a newer one, which leaves the site on the newest commit.
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # No environment here: an environment would replace the subject of the
  # run's OIDC token with its own, which the rule is not set up for.
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The site's theme, web/themes/hugo-book.
          submodules: true

      # As in ci.yml: pinned by version and SHA-256, unpacked outside the
      # checkout under the versioned name the build step calls.
      - name: Install Hugo
        env:
          HUGO_VERSION: 0.167.0
          HUGO_SHA256: 4d84519b9f619e6d4c3fb45a50157abeabeb724f859c60605f44c23def6e1169
        run: |
          set -euo pipefail
          bindir="$(mktemp -d)"
          tarball="${bindir}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "$bindir" hugo
          mv "${bindir}/hugo" "${bindir}/hugo-${HUGO_VERSION}"
          echo "$bindir" >> "$GITHUB_PATH"

      # As in ci.yml: the Python of pyproject.toml, environment from uv.lock.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --all-packages

      # The JWT and the access token live only in this step's shell and in
      # files under a private temporary directory: never echoed, never put
      # on a command line or into GITHUB_ENV, masked as soon as they exist.
      # A failed exchange prints its HTTP status and the error body with
      # every field named *token replaced.
      - name: Exchange the OIDC token and count the tokens
        env:
          FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d)"
          curl -fsS -o "${work}/oidc.json" \
            -H @- "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://api.anthropic.com" \
            <<< "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
          jwt="$(jq -r '.value // empty' "${work}/oidc.json")"
          if [ -z "$jwt" ]; then
            echo "::error::no OIDC token from GitHub"
            exit 1
          fi
          echo "::add-mask::${jwt}"
          unset jwt
          jq '{
              grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
              assertion: .value,
              federation_rule_id: env.FEDERATION_RULE_ID,
              organization_id: env.ORGANIZATION_ID,
              service_account_id: env.SERVICE_ACCOUNT_ID,
              workspace_id: env.WORKSPACE_ID
            }' "${work}/oidc.json" > "${work}/request.json"
          rm "${work}/oidc.json"
          status="$(curl -sS -o "${work}/response.json" -w '%{http_code}' \
            -H 'content-type: application/json' --data-binary @"${work}/request.json" \
            https://api.anthropic.com/v1/oauth/token)"
          rm "${work}/request.json"
          if [ "$status" != 200 ]; then
            echo "::error::token exchange failed: HTTP ${status}"
            jq 'walk(if type == "object" then with_entries(if (.key | test("token$"; "i")) then .value = "<redacted>" else . end) else . end)' \
              "${work}/response.json" || echo "(the error body is not JSON)"
            exit 1
          fi
          CONSTITUTION_TOKEN_COUNT_ACCESS_TOKEN="$(jq -r '.access_token // empty' "${work}/response.json")"
          rm "${work}/response.json"
          if [ -z "$CONSTITUTION_TOKEN_COUNT_ACCESS_TOKEN" ]; then
            echo "::error::the token exchange returned no access_token"
            exit 1
          fi
          echo "::add-mask::${CONSTITUTION_TOKEN_COUNT_ACCESS_TOKEN}"
          export CONSTITUTION_TOKEN_COUNT_ACCESS_TOKEN
          uv run --frozen count-tokens --require-tokens

      # As in ci.yml: Hugo reads the counts from web/data/lengths.json.
      # The site's domain only here: web/hugo.toml keeps "/", as with an
      # absolute baseURL the theme puts integrity and crossorigin on the
      # style sheet link, which a page opened as a file cannot load.
      - name: Build the static site
        run: hugo-0.167.0 --source web --cleanDestinationDir --panicOnWarning --baseURL https://agent-constitution.luolc.com/
      - name: Link check
        run: uv run --frozen check-site-anchors site

      # The length line under the title of each built page, in the job
      # summary and in the log, which, unlike the summary, the API can read.
      - name: Job summary
        run: |
          set -euo pipefail
          {
            echo "## Constitution length"
            echo
            for page in site/index.html site/zh/index.html; do
              line="$(grep -o '<li class="length">[^<]*' "$page" | sed 's/<[^>]*>//g')"
              echo "- \`${page}\`, version for agents: ${line}"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # Publishes only when the repository is public and the repository
  # variable PAGES_DEPLOY is `true`, which is set once Pages is turned on;
  # otherwise the job is skipped, not failed.
  deploy:
    if: github.event.repository.visibility == 'public' && vars.PAGES_DEPLOY == 'true'
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
