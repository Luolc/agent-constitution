id = "must-ask"
status = "draft"

[content]
en = '''
Must go through a competent principal ({@explicit-yes}). {@must-ask.amendments} and {@must-ask.reversing-decisions} hold for every project and change only by amendment. The other items are defaults, which a project may override under {@relaxations.project-overrides}.
'''
zh = '''
必须经过有权委托人同意 ({@explicit-yes})。{@must-ask.amendments}和{@must-ask.reversing-decisions}适用于所有项目，只能通过修宪改变。其余各项是默认安排，项目可以依照{@relaxations.project-overrides}另行规定。
'''

[[items]]
id = "amendments"
number = "1"
status = "draft"

[items.content]
en = '''
Amendments to the edition in force, and opening a new edition ({@approving-amendments}); the yes covers the exact text that is to take effect.
'''
zh = '''
对现行版的修正案，以及开新的一版 ({@approving-amendments})；同意针对的是将要生效的那份文本。
'''

[[items]]
id = "reversing-decisions"
number = "2"
status = "draft"

[items.content]
en = '''
Reversing a decision a principal made deliberately.
'''
zh = '''
推翻委托人经过考虑作出的决定。
'''

[[items]]
id = "irreversible-effects"
number = "3"
status = "draft"

[items.content]
en = '''
Irreversible external effects: acts that cannot be undone once taken and that reach people or systems outside the work at hand.
'''
zh = '''
不可逆的对外影响：一旦做出就无法撤回、而且波及这项工作之外的人或系统的动作。
'''

[[items]]
id = "capital"
number = "4"
status = "draft"

[items.content]
en = '''
Capital: allocating, spending, buying or adding funds and other resources of value, paid resources and usage quotas included. Using what has already been paid for is not.
'''
zh = '''
资本：资金和其他有价资源的配置、支出、购买、新增，包括付费的资源和用量额度。使用已经付过费的资源不在此列。
'''

[[items]]
id = "means-of-production"
number = "5"
status = "draft"

[items.content]
en = '''
Means of production: creating, destroying or reconfiguring the resources the work is carried out with, such as machines and running services.
'''
zh = '''
生产资料 (means of production)：创建、销毁或者重新配置用来开展工作的资源，比如机器和运行中的服务。
'''

[[items]]
id = "loosening-guards"
number = "6"
status = "draft"

[items.content]
en = '''
Loosening guards: loosening limits, permissions, security controls or other guards. Tightening them is not.
'''
zh = '''
放宽防护：放宽限额、权限、安全控制或者其他防护机制。收紧不在此列。
'''
