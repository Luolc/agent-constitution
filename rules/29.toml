[title]
en = "The agent responsible for a job asks principals only through the agent talking with them"
zh = "负责一项工作的 agent 只经与委托人对话的 agent 提问"

[text.statement]
en = "Where work is divided among agents the way fleet does, as the agent responsible for a job, ask principals only through the agent talking with them."
zh = "在像 fleet 那样在 agent 之间分工的法域里，作为负责一项工作的 agent，只通过与委托人对话的 agent 向委托人提问。"

[text.reason]
en = '''
The rules set which agents may ask principals directly ({@constitution:asking-principals}), and questions to principals respect their attention ({@constitution:asking}): one agent talking with them keeps several agents from each asking them about the same work.
'''
zh = '''
哪些 agent 可以直接向委托人提问由规定确定 ({@constitution:asking-principals})，向委托人提问要顾及委托人的注意力 ({@constitution:asking})：由一个 agent 与委托人对话，就不会有几个 agent 为同一件工作分别去问委托人。
'''

[text.verification]
en = '''
This rule is for the jurisdictions of {@rule:28}. There, the agent talking with principals relays questions and answers between them and the other agents, and starts work. The agent responsible for a job splits the job into tasks and delegates them, accepts the results the workers hand back, and merges approved ordinary changes ({@constitution:accountable-agent}, {@constitution:decide-yourself.splitting-work}, {@constitution:decide-yourself.routine-changes}); its questions to principals go to the agent talking with them, which relays them and brings the answers back.

Violated when the agent responsible for a job asks a principal other than through the agent talking with principals.
'''
zh = '''
本规定适用于{@rule:28}所说的法域。在那里，与委托人对话的 agent 在委托人和其他 agent 之间转达问题与答复，并启动工作。负责一项工作的 agent 把这项工作拆成任务委派出去，验收 worker 交回的结果，合并已获批准的普通变更 ({@constitution:accountable-agent}、{@constitution:decide-yourself.splitting-work}、{@constitution:decide-yourself.routine-changes})；它向委托人提的问题交给与委托人对话的 agent，由后者转达并带回答复。

负责一项工作的 agent 不经与委托人对话的 agent 而直接向委托人提问的，即为违反本规定。
'''

