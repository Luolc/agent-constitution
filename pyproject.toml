# The uv workspace of tools/: its three members, each with a pyproject.toml
# of its own, and the development tools the commit hooks run, pinned here
# for all of them. One uv.lock, at this root, locks the whole workspace;
# `uv sync` installs the members and the tools into .venv. The interpreter's
# minor version is in .python-version, which uv and CI read.
[project]
name = "agent-constitution-tools"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["constitution-compiler", "constitution-site", "repo-checks"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["tools/compiler", "tools/site", "tools/checks"]

[tool.uv.sources]
constitution-compiler = { workspace = true }
constitution-site = { workspace = true }
repo-checks = { workspace = true }

[dependency-groups]
dev = [
    "basedpyright==1.40.1",
    "limae==0.13.3",
    "pre-commit==4.6.2",
    "pydoclint==0.11.0",
    "ruff==0.16.10",
]

[tool.ruff]
line-length = 80
indent-width = 2
include = ["*.py", "*.pyi", "**/pyproject.toml"]
src = ["tools/*/src"]

[tool.ruff.lint]
select = [
    "B",
    "BLE",
    "C",
    "D",
    "D401",
    "D417",
    "E",
    "F",
    "I",
    "ISC001",
    "N",
    "PLW0129",
    "W",
    "W505",
    "RUF008",
    "UP",
    "SIM",
]
ignore = ["D105"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
order-by-type = false
extra-standard-library = ["typing_extensions"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 80

[tool.ruff.lint.per-file-ignores]
"tools/*/tests/*.py" = ["D1"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["tools"]
executionEnvironments = [
    { root = "tools/compiler/tests" },
    { root = "tools/site/tests" },
    { root = "tools/checks/tests" },
]

[tool.pydoclint]
style = "google"
allow-init-docstring = true
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
skip-checking-short-docstrings = false
