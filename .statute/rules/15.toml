[title]
en = "Pass over a limae false positive on its line only"

[text.statement]
en = "Pass over a false positive of limae with a `<!-- limae-disable-next-line <rule> -->` comment above the line, never by turning the rule off."

[text.reason]
en = '''
Turning a rule off for a file or the repository hides its true findings as well.
'''

[text.verification]
en = '''
Violated when a change turns a limae rule off in the configuration, or for a whole file, to pass over a finding.
'''
