[title]
en = "Rest a rule only on mechanisms that already run"
zh = "规定只依赖已经在跑的机制"

[text.statement]
en = "Make what a rule requires, and the condition under which it applies, rest only on checks, counts, records and other mechanisms that already run where the rule is enabled, never on one that is still to be built."
zh = "规定要求的事，以及它适用的条件，只能依赖在启用它的地方已经在跑的检查、计数、记录等机制，不能依赖还没建起来的机制。"

[text.reason]
en = '''
A requirement that rests on a mechanism nothing runs can be neither met nor decided: no agent can tell whether its work complies, and no reviewer can tell either ({@constitution:decidable-provisions}). A rule that let a trial rule become active after a number of uses that nothing counted was such a rule: its threshold could never be checked. Where the mechanism is worth having, build it first and write the rule that rests on it after; otherwise leave the condition out.
'''
zh = '''
依赖一个没人在跑的机制的要求，既没法满足，也没法判定：agent 判断不了自己的工作是否合规，审查方也判断不了 ({@constitution:decidable-provisions})。曾有一条规定让试用规定在用过若干次之后改为生效，而这个次数没有任何东西在记，就是这样的规定：它的门槛永远核对不了。机制值得有，就先把它建起来，再写依赖它的规定；不值得，就不写这个条件。
'''

[text.verification]
en = '''
A rule rests on a mechanism when what it requires, or the condition under which it applies, needs that mechanism to be met or decided: a check or a script it says to run, a count or a record it measures by, a switch or a setting it relies on. The mechanism runs when, as the change takes effect, it exists and works in each jurisdiction that enables the rule, so that an agent there can run it or read what it keeps: a command that is installed, a CI job that runs, a count that something writes down.

A rule does not rest on a mechanism that the rule itself requires agents to set up, such as a rule that has commit hooks scan for credentials; on an act it requires agents to do themselves, such as counting what is left after a cleanup; or on a condition that asks only whether a mechanism exists, as in "where the repository has a screenshot script".

Violated when a change adds or rewrites a rule so that what it requires, or the condition under which it applies, rests on a mechanism that does not run in a jurisdiction that enables the rule as the change takes effect.
'''
zh = '''
规定要求的事或它适用的条件，要靠某个机制才能满足或判定，这条规定就依赖这个机制：它让人跑的检查或脚本，它拿来衡量的计数或记录，它所依赖的开关或设置。在变更生效时，这个机制在每个启用这条规定的辖区里都存在、都能用，那里的 agent 能运行它或读到它记下的东西，这个机制就算在跑：已经装好的命令，在跑的 CI job，有东西在记的计数。

规定本身要求 agent 去建的机制 (例如要求用 commit 钩子扫描凭证的规定)，规定要求 agent 自己做的动作 (例如清理之后数剩下多少)，以及只问某个机制有没有的条件 (例如「仓库有截图脚本的」)，都不算依赖机制。

变更新增或改写的规定，要求的事或适用的条件依赖了一个机制，而在变更生效时，这个机制在某个启用这条规定的辖区里没有在跑的，即为违反本规定。
'''

