uses = ["instructions", "review"]

[title]
en = "Instruction files apart, the compiled AGENTS.md and statute's own entries in the lock file going with the side that changed them"

[text.statement]
en = "Change instruction files in a change of their own, never together with changes to other files, and count as generated files ({@rule:R47}), not as instruction files, the `AGENTS.md` at the root of this repository, which this repository's statute compiles and `statute compile --check` in CI proves equal to a recompile, and a change to the root `statute.lock` that alters nothing in it but the `statute` version and the `commands` that statute records (for example, a change to statute's code commits either together with that code); every other change to `statute.toml`, `statute.lock`, `.statute/`, `rules/` or the sources of the constitution stays a change to instructions."

[text.reason]
en = '''
{@rule:R280} counts every `AGENTS.md` as an instruction file. Here the code is the compiler of `AGENTS.md`: a change to how statute renders the rules must commit the recompiled `AGENTS.md` to pass the compile check, and then mixes an instruction file with code, so it can pass CI neither way. Only this repository is so: in any other repository statute is a fixed tool, part of building the instructions, and the public rule stays as it is there.

The root `AGENTS.md` can hold only what statute compiles from `statute.toml` and `statute.lock` (the commit hook and CI run `statute compile --check`), so a change to it that does not come from those files must come from the compiler. {@rule:R47} still binds such a change: its description says that only the rendering changed, the review checks that, and if the meaning changed the change counts as a change to instructions ({@constitution:separate-instruction-changes}).

The lock file records the version of statute that wrote it and the commands of the enabled rules' checks, so that CI can install that version from the lock file alone. The version is set by statute's code, and the commands are rendered from the rules, so these two entries carry no meaning of their own: a change that raises the version of statute must rewrite them to pass the compile check, as it must recompile `AGENTS.md`. The rest of the lock file pins the rules and sources and stays an instruction file.

This loosens a guard, so it took effect only with a principal's yes on the change that adds it ({@constitution:must-ask.loosening-guards}).
'''

[text.verification]
en = '''
Instruction files are those {@rule:R280} lists, with the files of statute that {@rule:27} counts as instruction files besides them, except the `AGENTS.md` at the root of the repository, and the root `statute.lock` when, read as TOML before and after the change with its top-level `statute` and `commands` left out, it is the same. An `AGENTS.md` or a `statute.lock` in a subdirectory stays an instruction file.

`uv run check-instruction-changes --base origin/main` lists such a root `AGENTS.md` and `statute.lock` among the generated files, which count with neither side, and CI runs it on every pull request; it still fails a change that mixes another instruction file with other files. `statute compile --check` shows that the root `AGENTS.md` and `statute.lock` equal what statute writes now.

Violated when a change mixes an instruction file other than the root `AGENTS.md`, or a change to the root `statute.lock` beyond its `statute` and `commands`, with other files.
'''
