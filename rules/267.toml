[title]
en = "Shared Machines"
zh = "共享机器"

[applicability]
en = '''
Work on a machine where other tasks are running too: a fair share of the resources they share, no harm to the tasks already running, waits that end when what they wait for fails, and a fallback for stopping every lasting background process. Enable it wherever agents work.
'''
zh = '''
机器上还有别的任务在跑时的工作：共用的资源只用自己该用的一份，不妨碍正在运行的任务，等的事失败了就结束等待，一直占用资源的后台进程都有兜底。凡有 agent 工作的地方都要启用。
'''

