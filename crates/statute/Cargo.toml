[package]
name = "statute"
version = "0.1.20"
description = "Compile a constitution and chosen rules into the instruction files coding agents read."
readme = "README.md"
keywords = ["agents", "ai", "instructions", "rules", "compiler"]
categories = ["command-line-utilities", "development-tools"]
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.1.8"
toml_edit = "0.25.17"
