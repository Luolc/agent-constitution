id = "stable-numbers"
status = "draft"
audience = "maintainers"

[content]
en = '''
Within an edition ({@editions}), from its first approved revision on, the numbers of articles, sections and items never change and are never reused. A new provision goes at the end of its article or section; one that must go between two others takes a letter suffix (2a). An amended provision keeps its number. A repealed provision keeps its number, with a one-line note in place of its text. While this text is a draft, numbers may still change.
'''
zh = '''
同一版内 ({@editions})，自第一次经批准的修订起，条、款、项的编号永不更改，也不重复使用。新增的条文放在所在条或款的末尾；必须插在中间的，用「之一」这样的编号 (如第二款之一)。修改过的条文保留原来的编号。废止的条文保留编号，原文换成一行说明。本文本还是草案时，编号仍可调整。
'''
