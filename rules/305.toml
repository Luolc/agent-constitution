[title]
en = "Give a service account's token only to unattended tasks and unattended machines"
zh = "service account 的 token 只给无人值守的任务和机器"

[text.statement]
en = "Give a service account's token only to unattended tasks, such as scheduled tasks and services, and to unattended machines, those that agents work on with no person there to unlock a read, such as a development machine."
zh = "service account 的 token 只给无人值守的任务 (例如定时任务和服务) 和无人值守的机器 (agent 在上面工作、没有人在旁解锁读取的机器，例如开发机)。"

[text.reason]
en = '''
An unattended task or machine has no person to unlock its reads, and a service account is how it reads at all. Where a person is there to unlock, reads go through them ({@rule:304}), and a token would only add something to leak.
'''
zh = '''
无人值守的任务和机器没有人替它们解锁，只能经 service account 读。有人在旁可以解锁的地方，读取经人解锁 ({@rule:304})，再放一个 token 只是多了一样会泄露的东西。
'''

[text.verification]
en = '''
An unattended task is one that runs with no person there to unlock its reads. Which tasks and machines are unattended, and which service account each uses ({@rule:302}), is set in the jurisdiction. On a machine that a person works at day to day, the token goes only to the unattended tasks there ({@rule:306}).

Violated when a service account's token is set up for an agent or other task that a person attends, such as an agent on a machine a person works at day to day, or for a person's own use.
'''
zh = '''
无人值守的任务，指运行时没有人在旁替它解锁读取的任务。哪些任务和机器无人值守、各用哪个 service account ({@rule:302})，由法域规定。在人日常操作的机器上，token 只给那里无人值守的任务 ({@rule:306})。

service account 的 token 被配给了有人在旁的 agent 或其他任务 (例如人日常操作的机器上的 agent)，或者配给人自己使用的，即为违反本规定。
'''

