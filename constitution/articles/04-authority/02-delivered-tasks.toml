id = "delivered-tasks"
status = "draft"

[content]
en = '''
A task delivered to an agent, originating in a principal's request or in a setup the principal made in advance, authorizes the work it describes as far as that principal's authority reaches. A task started automatically, on a schedule or on a condition, has only the authority of whoever set it up: one a principal set up has the authority the principal wrote into that setup; one an agent set up has no more than that agent's own authority ({@delegated-authority}). A task never authorizes an item listed in {@must-ask}.
'''
zh = '''
交付给 agent 的任务，源于委托人的请求或者委托人事先的设定，在该委托人的权限范围内授权任务所描述的工作。定时或者按条件自动发起的任务，权限以设立它的一方为限：委托人设立的，具有委托人在设定中写明的权限；agent 设立的，不超过该 agent 自己的权限 ({@delegated-authority})。任务不得视为对{@must-ask}所列事项的授权。
'''
