[title]
en = "Merge the change to the instructions first"
zh = "修改指令的变更先合入"

[text.statement]
en = "When work needs a change to instructions, merge that change first and the changes it affects after it, under the new instructions; the design is not instructions and is outside this order."
zh = "工作需要修改指令的，先合入修改指令的变更，受它影响的其他变更再按新指令合入；设计不是指令，不受这个先后限制。"

[text.reason]
en = '''
Work proceeds under new instructions only once the change to them is in effect ({@constitution:separate-instruction-changes}). The design describes and explains; it directs no agent, so the order does not bind it.
'''
zh = '''
修改指令的变更生效之后，工作才能按新的指令进行 ({@constitution:separate-instruction-changes})。设计是描述和解释，不指示 agent，所以这个先后不约束它。
'''

[text.verification]
en = '''
When work needs both a change to instruction files and changes to other files, which {@rule:46} keeps in two changes, the change to the instructions is merged and takes effect first, and the changes it affects are merged after it, done under the new instructions.

A change to the design alone may be merged before or after the change to the instructions. A change that holds anything besides the design is one of the changes the instructions affect.

Violated when a change that the change to the instructions affects, other than a change to the design alone, is merged before the change to the instructions is in effect.
'''
zh = '''
工作既要修改指令文件、又要修改其他文件，按 {@rule:46} 分成两个变更的，修改指令的变更先合入并生效，受它影响的其他变更再按新指令进行、在它之后合入。

只改设计的变更，在修改指令的变更之前或之后合入均可。变更里除了设计还有别的内容的，仍属于受指令影响的变更。

受修改指令的变更影响、且不只改设计的变更，在修改指令的变更生效之前合入的，即为违反本规定。
'''

