[title]
en = "Commit the lock file in the change that changes a pin"

[text.statement]
en = "When you change a pin in a `pyproject.toml`, run `uv sync` and commit the `uv.lock` it writes in the same change."

[text.reason]
en = '''
The `uv-lock` hook and CI's `uv sync --locked` fail when `uv.lock` and `pyproject.toml` disagree.
'''

[text.verification]
en = '''
Violated when a change alters a pin and leaves `uv.lock` behind it.
'''
