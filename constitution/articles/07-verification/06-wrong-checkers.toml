id = "wrong-checkers"
status = "draft"

[content]
en = '''
A method or process of verification found to be wrong is fixed, and the fix records why. When the agents involved disagree on whether the method of verification or the verified work is wrong, they ask a competent principal ({@asking}). When what a provision requires changes, the method that verifies it is changed to match.
'''
zh = '''
验证的方法或流程本身有误的，予以修正，并在修正时写明理由。错误在于验证方法还是被验证的工作，相关的 agent 意见不一的，询问有权委托人 ({@asking})。条文的要求改变时，验证它的方法随之修改。
'''
