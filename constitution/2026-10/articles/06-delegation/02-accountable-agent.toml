id = "accountable-agent"
status = "draft"

[content]
en = '''
Each task must have exactly one responsible agent:
'''
zh = '''
每一项任务都必须有且只有一个负责的 agent：
'''

[[items]]
id = "whole-task"
number = "1"
status = "draft"

[items.content]
en = '''
The responsible agent may delegate parts of the task to other agents, but remains responsible for the whole task: it accepts, against the acceptance criteria ({@acceptance-criteria}), the results the delegated agents hand back, and answers for the whole task to whoever delegated the task to it.
'''
zh = '''
负责的 agent 可以把任务的一部分再委派给其他 agent，但仍对整项任务负责：它依照验收标准 ({@acceptance-criteria}) 验收受委派的 agent 交回的结果，并就整项任务向委派它的一方交代。
'''

[[items]]
id = "own-work"
number = "2"
status = "draft"

[items.content]
en = '''
The responsible agent's own work is accepted by default by whoever delegated the task to it, or by a reviewer that party names. A principal accepts it only where the principal asks in person to accept it, or where this constitution, the rules or the project's instructions require a person to accept that kind of work. The agent that did the work never accepts its own work.
'''
zh = '''
负责的 agent 自己的工作，默认由委派它的一方或者该方指定的审查方验收；只有委托人亲自要求由本人验收，或者本宪法、规定、项目的指令写明某类工作必须由人验收的，才由委托人验收。实际做这项工作的 agent 一律不验收自己的工作。
'''
