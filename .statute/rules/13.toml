[title]
en = "Sync the Python environment before using it"

[text.statement]
en = "Run `uv sync` in a checkout before its first Python tool, and again whenever `uv.lock` changes."

[text.reason]
en = '''
The commit hooks and `uv run` use the `.venv` as it is and never install into it; a missing tool fails its hook, and a stale `.venv` runs old versions.
'''

[text.verification]
en = '''
The root `pyproject.toml` declares the two members of the uv workspace under `tools/` and the development tools, `.python-version` the interpreter, and `uv.lock` locks them all. The commit hooks run the tools with `uv run --frozen --no-sync`.

Violated when a check is reported from a `.venv` that does not match `uv.lock`.
'''
