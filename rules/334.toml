id = 334
slug = "instruction-system-apart"
revision = 1
kind = "rule"
status = "trial"
lang = "en"
parent = 275
default = "off"
authority = ["separate-instruction-changes"]
constitution = ">=1"
level = "project"
check = "none"
uses = ["instructions", "review"]

[title]
en = "Keep changes to the instruction system apart from other changes"
zh = "指令体系的修改不与其他修改放在同一个变更里"

[text.statement]
en = "Change the instruction system in a change of its own, never together with changes to anything else; the instruction system is the instruction files together with what serves them and has to change with them, such as the commit hook and CI steps that install the compiler of the instructions, pin its version or run it."
zh = "修改指令体系要单独成一个变更，不与其他任何修改放在同一个变更里；指令体系指指令文件，加上为它们服务、必须随它们一起改的东西，例如安装指令的编译器、钉住它的版本或运行它的 commit hook 与 CI 步骤。"

[text.reason]
en = '''
A single change that both altered the instructions binding agents and did work they govern would let an agent rewrite the provisions that bind it and so get around them ({@constitution:separate-instruction-changes}).

What only installs, builds or checks the instructions does no work they govern and gives an agent no way to rewrite what binds it: it is part of the instructions as a whole, and goes with them. A rule set's lock file and the commit hook that runs the compiler both pin the compiler's version and must agree, so split into two changes, the hook fails on the one in between. The change that first moves a repository onto compiled instructions is the same case: the compiled files and the hook and CI steps that keep them equal to their sources belong together.
'''
zh = '''
一个变更如果既修改约束 agent 的指令、又做这些指令管辖的工作，agent 就可以借这个变更改写约束自己的条文，从而绕开它们 ({@constitution:separate-instruction-changes})。

只负责安装、构建或检查指令的东西，不做指令管辖的工作，也不给 agent 改写约束自己的条文留出途径：它是整套指令的一部分，跟指令一起改。规则集的锁文件和运行编译器的 commit hook 都钉着编译器的版本，两处必须一致，拆成两个变更的话，夹在中间的那个变更上 hook 就会失败。仓库第一次改为编译生成指令的那个变更也是这样：编出的文件，和让它们与源文件保持一致的 hook 与 CI 步骤，应当放在一起。
'''

[text.verification]
en = '''
Instruction files are the files that direct or constrain agents:

- `AGENTS.md` in any directory, and the file an agent tool reads in its place there, for example `CLAUDE.md`;
- everything under `.agents/skills/` and under the skill directories of agent tools, for example `.claude/skills/`;
- subagent definitions and slash commands of agent tools, for example everything under `.claude/agents/` and `.claude/commands/`;
- the hooks and permission settings of agent tools, for example `.claude/settings.json`, `.claude/settings.local.json`, `.claude/hooks/` and everything under `.codex/`;
- the sources that instructions are compiled or generated from, such as the sources of the constitution and of the rules, and a repository's rule set and its lock file;
- the hand-written instructions a repository keeps as legacy copies once its instructions are compiled;
- any other path that a repository declares as instructions in its own `AGENTS.md`.

The instruction system is the instruction files together with what serves them and has to change with them: in the configuration of the commit hooks and of CI, the entries that install the compiler of the instructions, pin its version or run it. The rest of that configuration, the code of tools, the compiler's own code included, and every other file are outside it. A file that holds both, such as a commit hook configuration with other hooks in it, counts by what the change alters in it. A generated file goes with the side that changed it ({@rule:47}).

A change (a pull request) that alters both the instruction system and anything outside it does not comply ({@constitution:separate-instruction-changes}); a rename counts as removing the old path and adding the new one. The agent splits it in two ({@rule:48}). The rule holds whether or not the repository has a check for it ({@rule:49}); where it has none, review enforces it.

When unsure whether a file is an instruction file, treat it as one.

Violated when a change alters both the instruction system and anything outside it.
'''
zh = '''
指令文件是指示或约束 agent 的文件：

- 任何目录下的 `AGENTS.md`，以及 agent 工具在同一目录里代替它读取的文件，例如 `CLAUDE.md`；
- `.agents/skills/` 以及 agent 工具的 skill 目录 (例如 `.claude/skills/`) 下的所有文件；
- agent 工具的 subagent 定义和 slash command，例如 `.claude/agents/` 和 `.claude/commands/` 下的所有文件；
- agent 工具的 hook 和权限配置，例如 `.claude/settings.json`、`.claude/settings.local.json`、`.claude/hooks/` 以及 `.codex/` 下的所有文件；
- 编译或生成指令所依据的源文件，例如宪法和规定的源文件，以及仓库的规则集和它的锁文件；
- 仓库改为编译生成指令之后留作 legacy 副本的手写指令；
- 仓库在自己的 `AGENTS.md` 里声明为指令的其他路径。

指令体系是指令文件，加上为它们服务、必须随它们一起改的东西：commit hook 配置和 CI 配置里，安装指令的编译器、钉住它的版本或运行它的那些条目。这些配置里的其余部分、工具的代码 (包括编译器自己的代码) 以及其他所有文件，都不属于指令体系。一个文件里两者都有的，例如还配了别的 hook 的 commit hook 配置，按变更在其中改了什么来算。生成文件归入使它发生变化的那一方 ({@rule:47})。

一个变更 (pull request) 既改了指令体系、又改了指令体系以外的东西的，不合规 ({@constitution:separate-instruction-changes})；改名按删除旧路径、新增新路径两项计。agent 把它拆成两个变更 ({@rule:48})。无论仓库有没有这项检查 ({@rule:49})，本规定都要遵守；没有检查的，由审查把关。

不确定某个文件是否属于指令文件的，按属于处理。

一个变更既改了指令体系、又改了指令体系以外的东西的，即为违反本规定。
'''

