id = 28
slug = "compiled-agents-file-generated"
revision = 1
kind = "rule"
status = "trial"
lang = "en"
overrides = "R46"
authority = ["separate-instruction-changes"]
constitution = ">=1"
level = "project"
check = "none"
uses = ["instructions", "review"]

[title]
en = "Instruction files apart, the compiled AGENTS.md going with the side that changed it"

[text.statement]
en = "Change instruction files in a change of their own, never together with changes to other files, and count the `AGENTS.md` at the root of this repository, which this repository's statute compiles and `statute compile --check` in CI proves equal to a recompile, as a generated file ({@rule:R47}), not as an instruction file (for example, a change to statute's code commits it together with that code), while a change to `statute.toml`, `statute.lock`, `.statute/`, `rules/` or the sources of the constitution stays a change to instructions."

[text.reason]
en = '''
{@rule:R46} counts every `AGENTS.md` as an instruction file. Here the code is the compiler of `AGENTS.md`: a change to how statute renders the rules must commit the recompiled `AGENTS.md` to pass the compile check, and then mixes an instruction file with code, so it can pass CI neither way. Only this repository is so: in any other repository statute is a fixed tool, part of building the instructions, and the public rule stays as it is there.

The root `AGENTS.md` can hold only what statute compiles from `statute.toml` and `statute.lock` (the commit hook and CI run `statute compile --check`), so a change to it that does not come from those files must come from the compiler. {@rule:R47} still binds such a change: its description says that only the rendering changed, the review checks that, and if the meaning changed the change counts as a change to instructions ({@constitution:separate-instruction-changes}).

This loosens a guard, so it took effect only with a principal's yes on the change that adds it ({@constitution:must-ask.loosening-guards}).
'''

[text.verification]
en = '''
Instruction files are those {@rule:R46} lists, with the files of statute that {@rule:L27} counts as instruction files besides them, except the `AGENTS.md` at the root of the repository. An `AGENTS.md` in a subdirectory stays an instruction file.

`uv run check-instruction-changes --base origin/main` lists the root `AGENTS.md` among the generated files, which count with neither side, and CI runs it on every pull request; it still fails a change that mixes another instruction file with other files. `statute compile --check` shows that the root `AGENTS.md` equals a recompile.

Violated when a change mixes an instruction file other than the root `AGENTS.md` with other files.
'''
