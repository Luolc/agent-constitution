[title]
en = "Give a service account's token only to unattended tasks and remote machines"
zh = "service account 的 token 只给无人值守的任务和远程机器"

[text.statement]
en = "Give a service account's token only to unattended tasks, such as scheduled tasks and services, and to remote machines, those that people and agents reach only over the network, such as servers and development machines."
zh = "service account 的 token 只给无人值守的任务 (例如定时任务和服务) 和远程机器 (人和 agent 只经网络访问的机器，例如服务器和开发机)。"

[text.reason]
en = '''
No person sits at a remote machine or attends an unattended task to unlock its reads, and a service account is how they read at all. On a local device the person there unlocks reads ({@rule:304}), and a token would only add something to leak.
'''
zh = '''
远程机器跟前没有人，无人值守的任务也没有人在旁，没人替它们解锁，只能经 service account 读。本地设备上读取由跟前的人解锁 ({@rule:304})，再放一个 token 只是多了一样会泄露的东西。
'''

[text.verification]
en = '''
An unattended task is one that runs with no person there to unlock its reads. A remote machine is one that no person sits at to work on directly; a machine that a person sits at and works on directly is a local device ({@rule:304}). Which machines are remote, which tasks are unattended, and which service account each uses ({@rule:302}), is set in the jurisdiction. On a local device, the token goes only to the unattended tasks there ({@rule:306}).

Violated when a service account's token is set up for an agent or other task on a local device that is not an unattended task there, or for a person's own use.
'''
zh = '''
无人值守的任务，指运行时没有人在旁替它解锁读取的任务。远程机器，指没有人坐在跟前直接操作的机器；人坐在跟前直接操作的机器是本地设备 ({@rule:304})。哪些机器是远程机器、哪些任务无人值守、各用哪个 service account ({@rule:302})，由法域规定。在本地设备上，token 只给那里无人值守的任务 ({@rule:306})。

service account 的 token 被配给了本地设备上无人值守的任务以外的 agent 或其他任务，或者配给人自己使用的，即为违反本规定。
'''

