# Commit hooks: secret scan, lock check, Python lint, format, docstring
# and type checks, constitution build check and its tests, and limae on
# the Chinese text, in the sources and in the built file.
repos:
  # Scans only the staged diff (the upstream entry ends in --staged); CI
  # scans the full history, so the two complement each other.
  # --redact is repeated here: inherited arguments are not visible in this
  # file and could be dropped when the rev is bumped.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--redact", "--no-banner", "."]

  # Keeps uv.lock in step with pyproject.toml: fails when `uv lock` would
  # change the lock. The rev is the uv version, the same as in CI.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.0
    hooks:
      - id: uv-lock

  # The local hooks run in the environment of pyproject.toml, which pins
  # limae and the Python checkers. `uv run --frozen --no-sync` uses .venv as
  # it is: it never syncs it from uv.lock nor changes the lock, so a missing
  # or stale environment fails the hook; run `uv sync` first.
  - repo: local
    hooks:
      # The Python checkers, configured in pyproject.toml, on the whole of
      # tools/ rather than the staged files.
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen --no-sync ruff check .
        language: system
        files: ^(tools/.*\.py|pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --no-sync ruff format --check .
        language: system
        files: ^(tools/.*\.py|pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: pydoclint
        name: pydoclint
        entry: uv run --frozen --no-sync pydoclint --config pyproject.toml --quiet tools
        language: system
        files: ^(tools/.*\.py|pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: basedpyright
        name: basedpyright
        entry: uv run --frozen --no-sync basedpyright
        language: system
        files: ^(tools/.*\.py|pyproject\.toml|uv\.lock)$
        pass_filenames: false
      # The constitution build: --check validates the sources (the
      # constitution and the rules) and requires the committed outputs to
      # match a fresh build; the tests cover the script. The numbering check
      # against a base commit (--base) runs only in CI.
      - id: constitution
        name: constitution build check
        entry: uv run --frozen --no-sync tools/build_constitution.py --check
        language: system
        files: ^(constitution|rules|tools)/
        pass_filenames: false
      # The tests of lint_zh_sources.py run limae.
      - id: constitution-tests
        name: tools tests
        entry: uv run --frozen --no-sync python -m unittest discover -s tools
        language: system
        files: ^(tools/|pyproject\.toml$|uv\.lock$)
        pass_filenames: false
      # The `zh` text of each source, citations replaced by Chinese text
      # shaped like their rendering. Checks only; fix locally with
      # `uv run tools/lint_zh_sources.py --fix`.
      - id: zh-sources
        name: limae on the zh text of the sources
        entry: uv run --frozen --no-sync tools/lint_zh_sources.py
        language: system
        files: ^(constitution/(index\.toml|articles/)|rules/|tools/lint_zh_sources\.py$|pyproject\.toml$|uv\.lock$)
        pass_filenames: false
      # The built Chinese constitution, both versions, with limae's default
      # configuration.
      # Rule switches go in a limae.toml, never in args: --disable and
      # --enable make limae skip its configuration file.
      - id: limae
        name: limae on the built Chinese constitution
        entry: uv run --frozen --no-sync limae
        language: system
        files: ^constitution/constitution\.zh(\.agent)?\.md$
